document.getElementById("tip").textContent="已选 "+ (s.pts?s.pts.size:pts.length) +" 个考点，覆盖 "+el+" 道题目";
document.getElementById("startBtn").textContent="开始练习（"+s.count+" 题随机组卷）";
document.getElementById("startBtn").disabled=el===0||!s.pts||s.pts.size===0;
renderMethod();
}
function tgSrc(i){const a=S.setup.srcs;i=a.includes(i)?a.filter(x=>x!==i):[...a,i];S.setup.srcs=i;renderSetup()}
function tgYr(y){const a=S.setup.years;S.setup.years=a.includes(y)?a.filter(x=>x!==y):[...a,y].sort();renderSetup()}
function tgPt(p){const s=S.setup;if(!s.pts)s.pts=new Set(curPT());s.pts.has(p)?s.pts.delete(p):s.pts.add(p);renderSetup()}
function selAllPt(){S.setup.pts=new Set(curPT());renderSetup()}
function clrPt(){S.setup.pts=new Set();renderSetup()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){const pool=eligible();if(!pool.length)return;const n=Math.min(S.setup.count,pool.length);S.quiz=shuffle(pool).slice(0,n);S.cur=0;S.answers=new Array(n).fill(-1);S.unc=new Array(n).fill(false);S.done=false;S.t0=Date.now();S.secs=0;clearInterval(S.timer);S.timer=setInterval(()=>{if(!S.done){S.secs=Math.floor((Date.now()-S.t0)/1000);document.getElementById("timer").textContent=fmt(S.secs)}},1000);view("quiz");renderQ()}
function renderQ(){const i=S.cur,q=S.quiz[i];
document.getElementById("qIdx").textContent="第 "+(i+1)+" / "+S.quiz.length+" 题";
document.getElementById("qProg").style.width=((i+1)/S.quiz.length*100)+"%";
document.getElementById("qMeta").innerHTML='<span class="tag pt">'+q.point+'</span><span class="tag">'+q.src+'</span><span class="tag">'+(q.srcType===0?"河南省考":q.srcType===1?"河南事业单位联考":"国考/联考真题")+' · '+q.yr+' 年</span>';
document.getElementById("qBody").innerHTML=q.q;
const opts=q.opts.map((o,oi)=>'<button class="opt'+(S.answers[i]===oi?" pick":"")+'" onclick="pick('+oi+')"><span class="o">'+"ABCD"[oi]+'</span>'+o+'</button>').join("");
document.getElementById("qOpts").innerHTML=opts;
document.getElementById("qNav").innerHTML=(i<S.quiz.length-1?'<button class="btn" onclick="next()">下一题</button>':'<button class="btn" id="finishQ" onclick="submit()">交卷判分</button>')+'<button class="btn ghost" onclick="prev()">上一题</button>';
document.getElementById("timer").textContent=fmt(S.secs);}
function pick(oi){if(S.done)return;S.answers[S.cur]=oi;renderQ()}
function toggleUnc(){S.unc[S.cur]=!S.unc[S.cur];renderQ()}
function next(){if(S.cur<S.quiz.length-1){S.cur++;renderQ()}}
function prev(){if(S.cur>0){S.cur--;renderQ()}}
function quitQuiz(){clearInterval(S.timer);view("setup")}
function submit(){S.done=true;clearInterval(S.timer);const rec={t:Date.now(),total:S.quiz.length,correct:S.quiz.filter((q,i)=>S.answers[i]===q.ans).length,secs:S.secs,ids:S.quiz.map((q,i)=>S.answers[i]!==q.ans?i:-1).filter(x=>x>=0),years:[...new Set(S.quiz.map(q=>q.yr))],mod:S.mod,qids:S.quiz.map((q,i)=>[curQB().indexOf(q),S.answers[i]===q.ans])};
S.h=S.h||[];S.h.push(rec);save();view("res")}
function renderRes(){const r=S.h[S.h.length-1];const cor=r.correct,tot=r.total,p=Math.round(cor/tot*100);const cls=p>=80?"hi":p>=60?"mid":"lo";
let html='<div class="score-wrap"><div class="score-ring '+cls+'">'+p+'%</div><h2 style="font-size:18px">'+cor+' / '+tot+' 题正确</h2><p style="color:var(--sub);font-size:13px;margin-top:6px">用时 '+fmt(r.secs)+' · 正确率 ≥80% 绿档 / ≥60% 橙档 / 其余红档</p></div>';
S.quiz.forEach((q,i)=>{const ok=S.answers[i]===q.ans;html+='<div class="anl" style="'+(ok?"border-color:#cde9dd":"border-color:#f2c6c4")+'"><b>'+(ok?"✓ 正确":"✗ 错误")+'</b> · <span style="font-size:12.5px;color:var(--sub)">你的答案：'+(S.answers[i]<0?"未答":"ABCD"[S.answers[i]])+' · 正确答案：'+"ABCD"[q.ans]+'</span><div style="margin-top:8px">'+q.q+'</div><div style="margin-top:8px"><b>考点：</b>'+q.point+'</div><div style="margin-top:6px"><b>解析：</b>'+q.solve+'</div><div class="key"><b>解题关键：</b>'+q.key+'</div>'+(q.traps.map(t=>'<div class="trap"><span class="tw">干扰项 '+"ABCD"[t.o]+'：</span>'+t.why+'</div>').join(""))+'<div class="orig"><b>出处核验：</b>'+(q.orig||"按真题卷收录，答案经华图/格木等多家机构交叉核对")+'</div></div>'});
html+='<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="view(\'setup\')">返回设置</button><button class="btn g" onclick="retryWrong()">重练错题</button><button class="btn" onclick="view(\'st\')">统计</button><button class="btn" onclick="view(\'pt\')">考点图谱</button><button class="btn" onclick="view(\'wk\')">错题本</button></div>';
document.getElementById("resCard").innerHTML=html;window.scrollTo(0,0)}
function retryWrong(){const wrong=S.quiz.filter((q,i)=>S.answers[i]!==q.ans);if(!wrong.length){alert("本次没有错题");return}S.setup.pts=new Set(wrong.map(q=>q.point));view("setup")}
function renderPt(){const r=(S.h||[]).filter(x=>x.mod===S.mod);const map={};curPT().forEach(p=>map[p]={n:0,c:0});
r.forEach(rec=>{rec.qids.forEach(([qi,ok])=>{const q=curQB()[qi];if(q&&map[q.point]){map[q.point].n++;if(ok)map[q.point].c++}})});
let html='<h2><span class="bar"></span>考点图谱（'+modName()+' · 共练 '+r.reduce((a,x)=>a+x.total,0)+' 题）</h2><table><tr><th>考点</th><th>已练</th><th>正确率</th><th>分布</th></tr>';
curPT().forEach(p=>{const m=map[p];const pc=m.n?Math.round(m.c/m.n*100):null;const cls=pc===null?"":pc>=80?"hi":pc>=60?"mid":"lo";
html+='<tr><td>'+p+'</td><td>'+m.n+'</td><td>'+(pc===null?"未练":'<b class="'+cls+'">'+pc+'%</b>')+'</td><td><div style="height:8px;background:#eef2f8;border-radius:4px;width:120px;display:inline-block;vertical-align:middle"><div style="width:'+(pc||0)+'%;height:100%;background:'+(cls==="hi"?"var(--green)":cls==="mid"?"var(--orange)":"var(--red)")+';border-radius:4px"></div></div></td></tr>'});
html+='</table><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="view(\'setup\')">返回设置</button><button class="btn g" onclick="view(\'st\')">按年份统计</button><button class="btn g" onclick="view(\'wk\')">错题本</button></div>';document.getElementById("ptCard").innerHTML=html}
function renderSt(){const r=(S.h||[]).filter(x=>x.mod===S.mod);const tot=r.reduce((a,x)=>a+x.total,0),cor=r.reduce((a,x)=>a+x.correct,0),wrong=r.reduce((a,x)=>a+x.ids.length,0);
const byY={};r.forEach(rec=>{rec.years.forEach(y=>{byY[y]=byY[y]||{n:0,c:0};byY[y].n+=rec.total;byY[y].c+=rec.correct})});
let html='<h2><span class="bar"></span>统计（'+modName()+'）</h2><div class="stat-grid"><div class="stat-box"><div class="v">'+r.length+'</div><div class="k">练习次数</div></div><div class="stat-box"><div class="v">'+tot+'</div><div class="k">累计答题</div></div><div class="stat-box"><div class="v">'+(tot?Math.round(cor/tot*100)+"%":"—")+'</div><div class="k">累计正确率</div></div><div class="stat-box"><div class="v">'+wrong+'</div><div class="k">累计错题</div></div></div>';
html+='<div class="sec-t">分年份正确率</div><table><tr><th>年份</th><th>已练</th><th>正确</th><th>正确率</th></tr>';
[2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026].forEach(y=>{const m=byY[y];html+='<tr><td>'+y+' 年</td><td>'+(m?m.n:0)+'</td><td>'+(m?m.c:0)+'</td><td>'+(m&&m.n?Math.round(m.c/m.n*100)+"%":"—")+'</td></tr>'});
html+='</table><div class="sec-t">历史记录</div>';
if(!r.length)html+='<p style="color:var(--sub);font-size:13px">暂无记录，先去练一组吧。</p>';
else r.slice().reverse().slice(0,10).forEach(rec=>{const p=Math.round(rec.correct/rec.total*100);html+='<div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px"><b>'+p+'%</b> · '+rec.correct+'/'+rec.total+' · 用时 '+fmt(rec.secs)+' · '+(rec.years||[]).join("/")+' 年 · '+new Date(rec.t).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</div>'});
html+='<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="view(\'setup\')">返回设置</button><button class="btn g" onclick="view(\'pt\')">考点图谱</button><button class="btn g" onclick="view(\'wk\')">错题本</button></div>';
document.getElementById("stCard").innerHTML=html}
function renderWk(){const r=(S.h||[]).filter(x=>x.mod===S.mod);const groups={};
r.forEach(rec=>{(rec.qids||[]).forEach(([idx,ok])=>{if(ok)return;const q=curQB()[idx];if(!q)return;const key=q.src+"/"+q.yr;groups[key]=groups[key]||{n:0,set:{}};groups[key].n++;groups[key].set[idx]=1})});
const arr=Object.entries(groups).sort((a,b)=>b[1].n-a[1].n);
let html='<h2><span class="bar"></span>错题本（'+modName()+' · 共 '+arr.reduce((a,x)=>a+x[1].n,0)+' 题次）</h2>';
if(!arr.length)html+='<p style="color:var(--sub);font-size:13px">暂无错题记录。</p>';
else{html+='<div style="margin-bottom:12px"><button class="btn" onclick="reWrongAll()">一键重练全部错题</button></div>';
arr.forEach(([key,g])=>{const [src,y]=key.split("/");const idxs=Object.keys(g.set).map(Number);const qs=idxs.map(i=>curQB()[i]).filter(Boolean);
html+='<div class="wrong-item" style="cursor:pointer" onclick="toggleWk(this)"><div class="wq"><span class="badge y">错 '+g.n+' 次</span><span class="badge">'+src+' · '+y+' 年</span><span class="wk-tip">点击展开/收起</span></div><div class="wr">'+qs.map(q=>q.q.replace(/<[^>]+>/g," ").slice(0,50)).join("；")+'…</div><div class="wk-detail" style="display:none;margin-top:8px">'+
qs.map((q,qi)=>{const idx=idxs[qi];return '<div style="border-top:1px dashed var(--line);padding:8px 0;font-size:13px"><div>'+q.q+'</div><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge">'+q.point+'</span><span class="badge">答案 '+"ABCD"[q.ans]+'</span><button class="btn" style="padding:4px 10px;font-size:12px" onclick="event.stopPropagation();retryOne('+idx+')">重练此题</button></div></div>'} ).join("")+
'<div style="margin-top:8px"><button class="btn g" style="padding:6px 12px;font-size:12.5px" onclick="event.stopPropagation();retryGroup(['+idxs.join(",")+'])">重练本组全部</button></div></div></div>'})}
html+='<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="view(\'setup\')">返回设置</button><button class="btn g" onclick="view(\'st\')">按年份统计</button><button class="btn g" onclick="view(\'pt\')">考点图谱</button></div>';
document.getElementById("wkCard").innerHTML=html}
function reWrongAll(){const r=(S.h||[]).filter(x=>x.mod===S.mod);const ids=new Set();r.forEach(rec=>{(rec.qids||[]).forEach(([idx,ok])=>{if(!ok)ids.add(idx)})});
const qs=curQB().filter((q,i)=>ids.has(i));if(!qs.length){alert("暂无错题");return}
startThese(qs)}
function toggleWk(el){const d=el.querySelector(".wk-detail");if(!d)return;d.style.display=d.style.display==="none"?"block":"none"}
function startThese(qs){if(!qs.length)return;clearInterval(S.timer);S.quiz=qs;S.cur=0;S.answers=new Array(qs.length).fill(-1);S.unc=new Array(qs.length).fill(false);S.done=false;S.t0=Date.now();S.secs=0;S.timer=setInterval(()=>{if(!S.done){S.secs=Math.floor((Date.now()-S.t0)/1000);document.getElementById("timer").textContent=fmt(S.secs)}},1000);view("quiz");renderQ()}
function retryOne(idx){const q=curQB()[idx];if(!q)return;startThese([q])}
function retryGroup(ids){startThese(ids.map(i=>curQB()[i]).filter(Boolean))}
function modName(){return S.mod==="pd"?"判断推理":(S.mod==="sl"?"数量关系":(S.mod==="zl"?"资料分析":"言语理解"))}
function renderMethod(){
const html=S.mod==="pd"?pdMethod():(S.mod==="sl"?slMethod():(S.mod==="zl"?zlMethod():yyMethod()));
document.getElementById("methodCard").innerHTML=html}
function pdMethod(){return '<div style="font-size:13.5px;line-height:2">'+
'<b>图形推理（先定性后定量）：</b>组成相同→位置类（平移/旋转/翻转）；组成相似→样式类（求同/存异/黑白叠加）；组成不同→先属性（对称/曲直/开闭）后数量（点线面素）；立体类→展开图用相对面/公共边，拼合看凹凸对应。<br>'+
'<b>定义判断（关键信息法）：</b>①拆定义成分（主体/对象/方式/结果/目的）；②多定义先看提问锁哪个定义；③选非题警惕“加强/肯定”表述混入；④干扰项惯用手法：偷换主体（把“企业”换成“个人”）、扩大/缩小范围（把“违规程度高”换成“所有”）、遗漏要件（只满足部分关键信息）。<br>'+
'<b>类比推理（先横向后纵向）：</b>①先确定题干两词/三词逻辑关系（外延：全同/种属/组成/并列/交叉；内涵：属性/功能/材料/因果/顺承；语义：近反义/褒贬；语法：主谓/动宾/偏正）；②再与选项纵向比较（词性、主体是否一致）；③成语类比先拆词素。<br>'+
'<b>逻辑判断（论证三要素法）：</b>①先找论点（表观点/结论词）和论据（表事实/数据）；②加强：补充论据/建立联系（搭桥）/补充前提；削弱：否定论点/削弱论据/切断联系（拆桥）/另有他因；③力度比较：直接削弱论点＞拆桥＞削弱论据；④翻译推理背熟“肯前肯后、否后否前、否前肯后不必然”；⑤真假推理先找矛盾（必一真一假）再找反对；⑥分析推理优先排除法+最大信息法。<br>'+
'<b>命题人干扰项五大规律：</b>①偷换主体/对象（张冠李戴）；②扩大/缩小范围（以偏概全）；③遗漏关键要件（部分符合即强选）；④偷换概念（近义词偷换语义）；⑤因果倒置/强加因果。解法：逐项回题干核对关键信息，差一个要件就排除。'+
'</div>'}
function slMethod(){return '<div style="font-size:13.5px;line-height:2;color:var(--sub)"><b>核心速算：</b>十字交叉法（溶液/平均）、n+1 增量原则、赋值法与比例法（工程/行程）、整除特性（不定方程）、捆绑插空（排列组合）、逆向思维（概率）、最不利构造（最值）。<b>命题人高频陷阱：</b>单位换算（万/亿）、“至少…保证”（最不利+1）、比例与数值偷换、选项相关陷阱（正确答案常为错误选项的修正值）。每题附解法拆解与陷阱预警。</div>'}
function zlMethod(){return '<div style="font-size:13.5px;line-height:2;color:var(--sub)"><b>核心速算：</b>增长率=（现期-基期）÷基期；增长量 n+1 原则；基期量=现期÷（1+r）；基期比重=现期比重×（1+整体增速）÷（1+部分增速）；平均数增长率=（a-b）÷（1+b）。<b>命题人高频陷阱：</b>“百分点”≠“增长率”；现期量≠基期量；部分增速快于整体→基期比重更低；增量与增速偷换；缺首期数据不可推“逐年”。每题附出处核验与错误选项逐条拆解。</div>'}
function yyMethod(){return '<div style="font-size:13.5px;line-height:2;color:var(--sub)"><b>逻辑填空（语境优先）：</b>先找提示词——转折（但/却/反而→取反义）、并列（和/也/同时→近义或反义）、递进（甚至/更→程度加深）、因果（因为/所以/可见→推结果）；再用词义锁定——近义干扰看侧重点（“退避三舍”本义是主动退让，并无畏惧义）、感情色彩（褒/贬/中性错位）、语义轻重（“束手无策”语义过重）、搭配对象（“比例”只能配主导/优势，不配关键/核心）。<b>多空题命题人惯用手法：</b>“半对”陷阱——前两空都成立、第三空错位（如“返璞归真”≠守住本和源），必须全匹配才选；还有“字面同构”干扰——用“此/彼”“防线”等字面近形词诱导，须回归本义。<b>片段阅读（细节判断六类偷换）：</b>偷换概念/时态/数量/范围/逻辑/主体——逐项回原文比对关键词，选项表述与原文一字之差即排除。<b>语句衔接与排序：</b>承上启下（话题一致）、指代衔接（这/那指代前文）、首句判断（下定义/背景引入）、捆绑对（关联词/重复词）。<b>典型误区：</b>凭语感不看对应、只看单空忽略整句、把近义词当同义词直接排除、被“看着顺眼”的强干扰项带偏。</div>'}
function init(){const st=L();S.h=st.h||[];if(!S.setup.pts)S.setup.pts=new Set(PD_POINTS);renderSetup();document.querySelectorAll(".navbar .nt").forEach(n=>{n.onclick=()=>setMod(n.dataset.m)});view("setup")}
init();
