{q:'【材料一】截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%；农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%。2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%；互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。补充：2018-2022年12月全国互联网普及率分别为59.6%、64.5%、70.4%、73%、75.6%（历年数据依解析卷补）。<div class="zl-q">截至2022年12月，我国20岁以上网民人数是20岁以下网民人数的：</div>',opts:['不到3倍', '3-4倍之间', '4-5倍之间', '5倍以上'],ans:2,point:'倍数与比值',solve:'20岁以上占比=14.2%+19.6%+16.7%+30.8%=81.3%，20岁以下=100%-81.3%=18.7%。整体量一致，倍数=占比之比=81.3%÷18.7%≈4.35，落在4-5倍之间。',key:'整体量一致时，部分量之比=占比之比；年龄段占比逐段加总。',traps:[{'o': 0, 'why': 'A 项不到3倍：把“20岁以上”漏算 20-29 岁/30-39 岁年龄段（只算 40-49 岁+50 岁及以上），或用错误口径；命题人用“年龄段划分”粗心设陷。'}, {'o': 1, 'why': 'B 项 3-4 倍：漏掉 50 岁及以上群体（占比 30.8%），20 岁以上只算 50.5%；命题人测试是否逐段加总。'}, {'o': 3, 'why': 'D 项 5 倍以上：把 20 岁以下误算为不足 15%（如把 14.2% 当 20 岁以下），拉高倍数；命题人用“年龄段归属”颠倒设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料一】截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%；农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%。2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%；互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。补充：2018-2022年12月全国互联网普及率分别为59.6%、64.5%、70.4%、73%、75.6%（历年数据依解析卷补）。<div class="zl-q">截至2022年12月，我国城镇网民规模同比增速约为：</div>',opts:['1.2%', '1.6%', '2.0%', '2.4%'],ans:1,point:'增长率计算',solve:'城镇增量=全国增量-农村增量=3549-2371=1178万；城镇基期=75900-1178=74722万；增速=1178÷74722≈1.58%，最接近1.6%。',key:'增量=整体增量-部分增量；增速=增量÷基期量（现期-增量）。',traps:[{'o': 0, 'why': 'A 项 1.2%：用城镇增量 1178 万除以全国网民基期（约 10.31 亿），分母用错（应用城镇基期）；命题人用“整体/部分分母”偷换设陷。'}, {'o': 2, 'why': 'C 项 2.0%：增量粗心算错（如把 3549-2371 算成约 1500 万）再除城镇基期≈2.0%；命题人用减法粗心设陷。'}, {'o': 3, 'why': 'D 项 2.4%：直接用“互联网普及率提升 2.6 个百分点”近似为城镇增速，把“百分点”与“增长率”混为一谈；命题人用百分点的单位陷阱设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料一】截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%；农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%。2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%；互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。补充：2018-2022年12月全国互联网普及率分别为59.6%、64.5%、70.4%、73%、75.6%（历年数据依解析卷补）。<div class="zl-q">以下信息中，能够从上述资料中推出的有几项？①2022年12月我国手机网民人数同比增量 ②2021年12月我国线上办公用户占网民整体的比重 ③2022年12月我国城镇地区互联网医疗用户规模</div>',opts:['0', '1', '2', '3'],ans:3,point:'综合推断（推出几项）',solve:'①可推：手机网民增量=10.67×99.8%-(10.67-0.3549)×(99.8%-0.1%)；②可推：2021线上办公用户=(5.4-0.7078)亿、2021网民=(10.67-0.3549)亿，比重可算；③可推：城镇互联网医疗=3.63-3.08×21.5%（总量减农村部分）。三项均可推出。',key:'推出类逐项判断“能否由已知量运算得到”：能算出结果即可推，不必真正算完。',traps:[{'o': 0, 'why': 'A 项 0：误以为①手机网民 2021 年占比未知无法推（实为 99.8%-0.1% 可得）；命题人用“信息是否足够”的慌张设陷。'}, {'o': 1, 'why': 'B 项 1：漏算②（线上办公 2021 年人数=5.4-0.7078 可推）或③（城镇互联网医疗=总量-农村部分可推）；命题人用“分城乡数据缺失”表象设陷。'}, {'o': 2, 'why': 'C 项 2：漏算③——误以为“农村互联网医疗占比”无法换算城镇部分（实为 3.63-3.08×21.5%）；命题人测试是否用总量减部分的技巧。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料一】截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%；农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%。2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%；互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。补充：2018-2022年12月全国互联网普及率分别为59.6%、64.5%、70.4%、73%、75.6%（历年数据依解析卷补）。<div class="zl-q">以下柱状图中，最能准确反映2019年12月-2022年12月全国互联网普及率同比增量变化趋势的是（横轴位置代表增量为0）：</div>',opts:['<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="display:flex;gap:4px;align-items:flex-end;height:34px"><div style="width:14px;height:26px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:22px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:11px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:5px;background:#4a7fc1;border-radius:2px"></div></div><div style="font-size:11px;margin-top:3px">逐年下降</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="display:flex;gap:4px;align-items:flex-end;height:34px"><div style="width:14px;height:11px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:22px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:26px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:11px;background:#4a7fc1;border-radius:2px"></div></div><div style="font-size:11px;margin-top:3px">升-降-升-降</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="display:flex;gap:4px;align-items:flex-end;height:34px"><div style="width:14px;height:22px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:26px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:11px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:11px;background:#4a7fc1;border-radius:2px"></div></div><div style="font-size:11px;margin-top:3px">4.9 5.9 2.6 2.6</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="display:flex;gap:4px;align-items:flex-end;height:34px"><div style="width:14px;height:9px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:16px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:20px;background:#4a7fc1;border-radius:2px"></div><div style="width:14px;height:26px;background:#4a7fc1;border-radius:2px"></div></div><div style="font-size:11px;margin-top:3px">逐年上升</div></div></div>'],ans:2,point:'增长量比较',solve:'各年同比增量=当年普及率-上年：2019年=64.5%-59.6%=4.9%，2020年=70.4%-64.5%=5.9%，2021年=73%-70.4%=2.6%，2022年=75.6%-73%=2.6%。趋势为“升→降→平”，即 C 选项（4.9、5.9、2.6、2.6）。',key:'同比增量=现期-基期，先算四值再对照柱状趋势；注意“横轴为0”表示可低于0。',traps:[{'o': 0, 'why': 'A 项“逐年下降”：按“普及率增速放缓”的直觉构造，实际 2019→2020 增量从 4.9% 升到 5.9%；命题人用“增量逐年递减”的惯性思维设陷。'}, {'o': 1, 'why': 'B 项“升-降-升-降”：用 2018 年当起点或把 2021/2022 的 2.6、2.6 误读为先降再升；命题人用期数错位设陷。'}, {'o': 3, 'why': 'D 项“逐年上升”：直接用普及率本身（59.6→64.5→70.4→73→75.6 逐年升）当增量趋势，混淆“水平”与“增量”；命题人用现期量替代增量设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，历年普及率数据依华图解析卷补，答案经华图解析核对'},
{q:'【材料二】2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。<table class="zl-tb"><tr><th>中国锂电池分类型出货量(GWh)</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th></tr><tr><td>储能</td><td>9.5</td><td>16.2</td><td>47.7</td><td>130</td></tr><tr><td>数码</td><td>36.5</td><td>46.2</td><td>53.5</td><td>48</td></tr><tr><td>动力</td><td>71</td><td>80</td><td>226</td><td>480</td></tr></table>全球锂电池出货量(GWh)：2019年218、2020年294.5、2021年562.4、2022年957.7；中国新能源汽车产量(万辆)：2019年119、2020年146、2021年368、2022年722（图表数据依解析卷重建）。<div class="zl-q">2019-2022年，中国锂电池年出货量超过全球锂电池年出货量一半的年份有几个？</div>',opts:['1', '2', '3', '4'],ans:2,point:'比重比较',solve:'中国出货量=储能+数码+动力：2019年=9.5+36.5+71=117，117×2=234>218（全球）✓；2020年=16.2+46.2+80=142.4，142.4×2=284.8<294.5 ✗；2021年=47.7+53.5+226=327.2，327.2×2>562.4 ✓；2022年=658，658×2>957.7 ✓。共3个年份。',key:'超过全球一半 ⇔ 中国出货量×2>全球出货量；先求中国历年合计再两两比较。',traps:[{'o': 0, 'why': 'A 项 1：只算 2022 年或只算 2021 年，漏掉 2019 年；命题人用“只看最近年份”的惯性设陷。'}, {'o': 1, 'why': 'B 项 2：漏掉 2021 年（327.2×2=654.4>562.4 较明显）或 2019 年；命题人用部分年份计算粗心设陷。'}, {'o': 3, 'why': 'D 项 4：把 2020 年也算入——142.4×2=284.8<294.5，差约 10GWh 未达标；命题人用“接近一半”的近似误判设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，分类型出货量表依华图解析卷重建，答案经华图解析核对'},
{q:'【材料二】2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。<table class="zl-tb"><tr><th>中国锂电池分类型出货量(GWh)</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th></tr><tr><td>储能</td><td>9.5</td><td>16.2</td><td>47.7</td><td>130</td></tr><tr><td>数码</td><td>36.5</td><td>46.2</td><td>53.5</td><td>48</td></tr><tr><td>动力</td><td>71</td><td>80</td><td>226</td><td>480</td></tr></table>全球锂电池出货量(GWh)：2019年218、2020年294.5、2021年562.4、2022年957.7；中国新能源汽车产量(万辆)：2019年119、2020年146、2021年368、2022年722（图表数据依解析卷重建）。<div class="zl-q">以下锂电池出货量指标中同比增速最快的是：</div>',opts:['2021年储能锂电池出货量', '2021年动力锂电池出货量', '2022年储能锂电池出货量', '2022年动力锂电池出货量'],ans:0,point:'增长率比较',solve:'增速比较可转化为现期÷基期：2021储能=47.7/16.2≈2.94；2021动力=226/80=2.83；2022储能=130/47.7≈2.73；2022动力=480/226≈2.12。最大的是2021年储能。',key:'增速比较用“现期÷基期”即可；基期小、倍数高者增速最快。',traps:[{'o': 1, 'why': 'B 项 2021 动力：动力出货量绝对值大（226）易误以为增速也最大；命题人用“量大增速快”的直觉设陷。'}, {'o': 2, 'why': 'C 项 2022 储能：倍比 2.73 与 2.83 接近，考生计算略粗即误判；命题人用“接近值”制造区分度。'}, {'o': 3, 'why': 'D 项 2022 动力：增量（480-226=254）最大，考生用“增量”替代“增速”比较；命题人用增量/增速概念偷换设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，数据依华图解析卷重建，答案经华图解析核对'},
{q:'【材料二】2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。<table class="zl-tb"><tr><th>中国锂电池分类型出货量(GWh)</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th></tr><tr><td>储能</td><td>9.5</td><td>16.2</td><td>47.7</td><td>130</td></tr><tr><td>数码</td><td>36.5</td><td>46.2</td><td>53.5</td><td>48</td></tr><tr><td>动力</td><td>71</td><td>80</td><td>226</td><td>480</td></tr></table>全球锂电池出货量(GWh)：2019年218、2020年294.5、2021年562.4、2022年957.7；中国新能源汽车产量(万辆)：2019年119、2020年146、2021年368、2022年722（图表数据依解析卷重建）。<div class="zl-q">2021年，全球动力锂电池装车量约为多少GWh？</div>',opts:['271.5', '295.6', '301.4', '323.6'],ans:2,point:'基期量计算',solve:'2022年全球装车量=294.6÷56.9%≈518GWh；全球2022年增速=90.7%-18.9%=71.8%；2021年全球装车量=518÷(1+71.8%)≈518÷1.718≈301GWh，选C。',key:'两步走：由比重求全球现期，再由增速求基期。注意“高于全球同比增速18.9个百分点”要先减。',traps:[{'o': 0, 'why': 'A 项 271.5：用中国增速 90.7% 替代全球增速计算（518÷1.907≈272）；命题人用“中国增速替代全球增速”设陷。'}, {'o': 1, 'why': 'B 项 295.6：把 294.6 直接当 2022 全球装车量少算一步，或比重换算错误；命题人用“局部当整体”设陷。'}, {'o': 3, 'why': 'D 项 323.6：把全球增速算错（71.8% 误算为 60%）或 294.6÷56.9% 后用中国增速 90.7% 修正；命题人用增速引用错误设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料二】2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。<table class="zl-tb"><tr><th>中国锂电池分类型出货量(GWh)</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th></tr><tr><td>储能</td><td>9.5</td><td>16.2</td><td>47.7</td><td>130</td></tr><tr><td>数码</td><td>36.5</td><td>46.2</td><td>53.5</td><td>48</td></tr><tr><td>动力</td><td>71</td><td>80</td><td>226</td><td>480</td></tr></table>全球锂电池出货量(GWh)：2019年218、2020年294.5、2021年562.4、2022年957.7；中国新能源汽车产量(万辆)：2019年119、2020年146、2021年368、2022年722（图表数据依解析卷重建）。<div class="zl-q">在以下信息中，能够从上述资料中推出的有几项？①2019-2022年，中国储能锂电池出货量年均增速为3类锂电池中最快 ②2019-2022年，中国锂电池出货量逐年增加 ③2019-2022年，中国数码锂电池年出货量同比增速逐年下降 ④2022年，中国新能源汽车产量同比增速慢于2021年水平</div>',opts:['1', '2', '3', '4'],ans:2,point:'综合推断（推出几项）',solve:'①末期/初期：储能130/9.5>10，数码48/36.5<2，动力480/71<7，储能最快 ✓；②历年合计117、142.4、327.2、658，逐年增加 ✓；③数码 2020年 46.2/36.5=1.27、2021年 53.5/46.2=1.16、2022年 48/53.5=0.90——但 2019 年增速需要 2018 年数据，材料未给，无法判断“逐年下降”③ ✗；④新能源车 2021年 368/146≈2.52>2022年 722/368≈1.96，2022 慢于 2021 ✓。共3项。',key:'年均增速比较看末期/初期；判断“逐年”需完整序列首年增速（缺 2018 数据即不可推）。',traps:[{'o': 0, 'why': 'A 项 1：只推出④，漏算①②；命题人用“最易验算的④”诱导停止。'}, {'o': 1, 'why': 'B 项 2：把③算作正确（未注意 2019 年增速因缺 2018 年数据无法计算）或漏算①；命题人用“逐年下降直观”设陷。'}, {'o': 3, 'why': 'D 项 4：把③误判为正确——数码出货量 2020-2022 确实逐年降，但题干问“同比增速逐年下降”需从 2019 起算，2018 数据缺失；命题人用“数据够用”错觉设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，数据依华图解析卷重建，答案经华图解析核对'},
{q:'【材料二】2022年中国锂电池出货量658GWh，同比增长101.1%。2022年中国动力锂电池装车量达294.6GWh，同比增长90.7%，高于全球同比增速18.9个百分点，占全球动力锂电池装车量的56.9%。<table class="zl-tb"><tr><th>中国锂电池分类型出货量(GWh)</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th></tr><tr><td>储能</td><td>9.5</td><td>16.2</td><td>47.7</td><td>130</td></tr><tr><td>数码</td><td>36.5</td><td>46.2</td><td>53.5</td><td>48</td></tr><tr><td>动力</td><td>71</td><td>80</td><td>226</td><td>480</td></tr></table>全球锂电池出货量(GWh)：2019年218、2020年294.5、2021年562.4、2022年957.7；中国新能源汽车产量(万辆)：2019年119、2020年146、2021年368、2022年722（图表数据依解析卷重建）。<div class="zl-q">以下饼图中，最能准确反映2022年中国锂电池出货量中，储能锂电池、数码锂电池和动力锂电池占比关系的是：（黑色：储能锂电池\u3000白色：数码锂电池\u3000斜杠：动力锂电池）</div>',opts:['<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#555 0 60%,#eee 0 80%,#f5f5f5 0 100%);border:1px solid #bbb"></div><div style="font-size:11px;margin-top:4px">数码≈储能</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#555 0 65%,#eee 0 82.5%,#f5f5f5 0 100.0%);border:1px solid #bbb"></div><div style="font-size:11px;margin-top:4px">储能≈数码</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#555 0 82%,#eee 0 92%,#f5f5f5 0 100%);border:1px solid #bbb"></div><div style="font-size:11px;margin-top:4px">储能+数码<1/4</div></div></div>', '<div style="text-align:center"><div style="display:inline-flex;flex-direction:column;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#555 0 73%,#eee 0 92.8%,#f5f5f5 0 100.0%);border:1px solid #bbb"></div><div style="font-size:11px;margin-top:4px">数码最小<储能一半</div></div></div>'],ans:3,point:'现期比重',solve:'2022年三类占比：动力480/658≈73%，储能130/658≈19.8%，数码48/658≈7.3%。数码占比最小且不足储能一半（7.3%<9.9%）；储能+数码≈27%>1/4。D 图符合。',key:'先算占比锁定“最小项”与“最小项<最大项一半”两个特征再对照图。',traps:[{'o': 0, 'why': 'A 项：数码占约 20% 与储能相当，明显高于实际 7.3%；命题人用“三分类均分感”设陷。'}, {'o': 1, 'why': 'B 项：储能与数码接近（各约 17.5%），而实际数码不足储能一半；命题人用“两小类相当”错觉设陷。'}, {'o': 2, 'why': 'C 项：储能+数码合计约 18%<1/4，实际约 27%；命题人用“动力占绝对主导”夸大设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，数据依华图解析卷重建，答案经华图解析核对'},
{q:'【材料三】2023年前5个月，天津口岸出口汽车约17.2万辆，同比增长29.5%，总价值约100.1亿元人民币，同比增长40.2%。汽车出口占同期天津口岸出口商品总值的2.2%，较上年同期提升0.3个百分点。1~5月民营企业出口活力明显，民营企业出口约10.6万辆，同比增长64.3%，占同期天津口岸汽车出口总量的61.6%，占比较上年同期提升13个百分点。新能源汽车出口成为新的增长点，出口约11万辆，同比增长50.2%。<table class="zl-tb"><tr><th>2023年1-5月天津口岸月度出口</th><th>数量(辆)</th><th>数量增速</th><th>金额(万元)</th><th>金额增速</th></tr><tr><td>1月</td><td>29105</td><td>20.1%</td><td>151198.7</td><td>44.0%</td></tr><tr><td>2月</td><td>22785</td><td>50.1%</td><td>161250.2</td><td>97.3%</td></tr><tr><td>3月</td><td>43361</td><td>73.4%</td><td>—</td><td>—</td></tr><tr><td>4月</td><td>40437</td><td>49.6%</td><td>—</td><td>53.2%</td></tr><tr><td>5月</td><td>36519</td><td>-12.1%</td><td>—</td><td>0.9%</td></tr></table>（月度表依解析卷重建）<div class="zl-q">2023年1-5月，天津口岸出口汽车均价同比上涨为：</div>',opts:['8%', '12%', '16%', '20%'],ans:0,point:'平均数增长率',solve:'均价=金额÷数量，均价增速=(金额增速-数量增速)÷(1+数量增速)=(40.2%-29.5%)÷(1+29.5%)=10.7%÷1.295≈8.3%，选A。',key:'平均数增长率公式：(a-b)/(1+b)，a 为分子增速（金额）、b 为分母增速（数量）。',traps:[{'o': 1, 'why': 'B 项 12%：直接把 40.2%-29.5%=10.7% 当答案后凭“接近”改选 12%，漏除（1+b）；命题人用“公式缺分母”设陷。'}, {'o': 2, 'why': 'C 项 16%：分母误用（1-29.5%）=0.705，10.7%÷0.705≈15.2%；命题人用“加减号颠倒”设陷。'}, {'o': 3, 'why': 'D 项 20%：直接用出口金额增速 40.2% 减数量增速 29.5% 后近似放大，或把“金额增速”当“均价增速”；命题人用“增速差=均价增速”的错误直觉设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料三】2023年前5个月，天津口岸出口汽车约17.2万辆，同比增长29.5%，总价值约100.1亿元人民币，同比增长40.2%。汽车出口占同期天津口岸出口商品总值的2.2%，较上年同期提升0.3个百分点。1~5月民营企业出口活力明显，民营企业出口约10.6万辆，同比增长64.3%，占同期天津口岸汽车出口总量的61.6%，占比较上年同期提升13个百分点。新能源汽车出口成为新的增长点，出口约11万辆，同比增长50.2%。<table class="zl-tb"><tr><th>2023年1-5月天津口岸月度出口</th><th>数量(辆)</th><th>数量增速</th><th>金额(万元)</th><th>金额增速</th></tr><tr><td>1月</td><td>29105</td><td>20.1%</td><td>151198.7</td><td>44.0%</td></tr><tr><td>2月</td><td>22785</td><td>50.1%</td><td>161250.2</td><td>97.3%</td></tr><tr><td>3月</td><td>43361</td><td>73.4%</td><td>—</td><td>—</td></tr><tr><td>4月</td><td>40437</td><td>49.6%</td><td>—</td><td>53.2%</td></tr><tr><td>5月</td><td>36519</td><td>-12.1%</td><td>—</td><td>0.9%</td></tr></table>（月度表依解析卷重建）<div class="zl-q">2023年1~5月，民营企业出口汽车同比约增加了多少万辆？</div>',opts:['3', '4', '5', '6'],ans:1,point:'增长量计算',solve:'增长量=现期÷(1+r)×r=10.6÷(1+64.3%)×64.3%。64.3%≈1/1.6，用 n+1 原则：10.6÷(1.6+1)=10.6÷2.6≈4.08 万辆，选B。',key:'增长量 n+1 原则：r≈1/n 时，增长量=现期÷(n+1)。',traps:[{'o': 0, 'why': 'A 项 3：把公式错用为 10.6×(1-64.3%)≈3.8，或除以（1+64.3%）后忘记乘 r；命题人用“公式变形错误”设陷。'}, {'o': 2, 'why': 'C 项 5：把 64.3%≈1/1.6 后现期除成 10.6÷1.6≈6.6 再估 5，或把 n+1 记成 n；命题人用“n 与 n+1”混淆设陷。'}, {'o': 3, 'why': 'D 项 6：直接用现期×增速=10.6×64.3%≈6.8，漏除（1+r）——把“增长量”算成“增量现值”；命题人用“现期×增速”的最常见错误设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料三】2023年前5个月，天津口岸出口汽车约17.2万辆，同比增长29.5%，总价值约100.1亿元人民币，同比增长40.2%。汽车出口占同期天津口岸出口商品总值的2.2%，较上年同期提升0.3个百分点。1~5月民营企业出口活力明显，民营企业出口约10.6万辆，同比增长64.3%，占同期天津口岸汽车出口总量的61.6%，占比较上年同期提升13个百分点。新能源汽车出口成为新的增长点，出口约11万辆，同比增长50.2%。<table class="zl-tb"><tr><th>2023年1-5月天津口岸月度出口</th><th>数量(辆)</th><th>数量增速</th><th>金额(万元)</th><th>金额增速</th></tr><tr><td>1月</td><td>29105</td><td>20.1%</td><td>151198.7</td><td>44.0%</td></tr><tr><td>2月</td><td>22785</td><td>50.1%</td><td>161250.2</td><td>97.3%</td></tr><tr><td>3月</td><td>43361</td><td>73.4%</td><td>—</td><td>—</td></tr><tr><td>4月</td><td>40437</td><td>49.6%</td><td>—</td><td>53.2%</td></tr><tr><td>5月</td><td>36519</td><td>-12.1%</td><td>—</td><td>0.9%</td></tr></table>（月度表依解析卷重建）<div class="zl-q">2022年1~5月，天津口岸出口新能源汽车约占天津口岸出口汽车的：</div>',opts:['46%', '50%', '55%', '64%'],ans:2,point:'基期比重',solve:'基期比重=现期比重×(1+总量增速)÷(1+部分增速)=(11/17.2)×(1+29.5%)/(1+50.2%)≈64%×(1.295/1.502)≈64%×0.86≈55%，选C。',key:'基期比重公式：(A/B)×(1+b)/(1+a)，a 为部分（新能源）增速 50.2%。',traps:[{'o': 0, 'why': 'A 项 46%：把增速差 50.2%-29.5%=20.7% 从现期比重 64% 中按 1:1 扣减，低估了实际降幅；命题人用“相减直觉”设陷。'}, {'o': 1, 'why': 'B 项 50%：介于 46 与 55 之间的“凭感觉下调”，考生算出部分增速快于总量就随意降幅；命题人用“方向对但幅度糊”设陷。'}, {'o': 3, 'why': 'D 项 64%：直接用 11÷17.2=64% 当答案，忽略“部分增速(50.2%)快于整体(29.5%)→基期比重应更低”；命题人用现期比重当基期比重设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对'},
{q:'【材料三】2023年前5个月，天津口岸出口汽车约17.2万辆，同比增长29.5%，总价值约100.1亿元人民币，同比增长40.2%。汽车出口占同期天津口岸出口商品总值的2.2%，较上年同期提升0.3个百分点。1~5月民营企业出口活力明显，民营企业出口约10.6万辆，同比增长64.3%，占同期天津口岸汽车出口总量的61.6%，占比较上年同期提升13个百分点。新能源汽车出口成为新的增长点，出口约11万辆，同比增长50.2%。<table class="zl-tb"><tr><th>2023年1-5月天津口岸月度出口</th><th>数量(辆)</th><th>数量增速</th><th>金额(万元)</th><th>金额增速</th></tr><tr><td>1月</td><td>29105</td><td>20.1%</td><td>151198.7</td><td>44.0%</td></tr><tr><td>2月</td><td>22785</td><td>50.1%</td><td>161250.2</td><td>97.3%</td></tr><tr><td>3月</td><td>43361</td><td>73.4%</td><td>—</td><td>—</td></tr><tr><td>4月</td><td>40437</td><td>49.6%</td><td>—</td><td>53.2%</td></tr><tr><td>5月</td><td>36519</td><td>-12.1%</td><td>—</td><td>0.9%</td></tr></table>（月度表依解析卷重建）<div class="zl-q">2023年1~5月，天津口岸出口汽车平均单价同比增长率最大的月份是：</div>',opts:['1月', '2月', '4月', '5月'],ans:1,point:'平均数增长率',solve:'均价增速=(金额增速-数量增速)÷(1+数量增速)：1月=(44.0%-20.1%)/1.201≈19.9%；2月=(97.3%-50.1%)/1.501≈31.4%；4月=(53.2%-49.6%)/1.496≈2.4%；5月=(0.9%+12.1%)/0.879≈14.8%。最大为2月。',key:'逐月套平均数增长率公式；5月数量负增长使分母<1，增速被放大但仍小于2月。',traps:[{'o': 0, 'why': 'A 项 1月：1月 19.9% 与 2月 31.4% 接近，考生计算略粗即误判；命题人用接近值设陷。'}, {'o': 2, 'why': 'C 项 4月：直接用“金额增速-数量增速”的差值（53.2-49.6=3.6 反而最小）或误认为 4 月差值大；命题人用差值替代比率设陷。'}, {'o': 3, 'why': 'D 项 5月：5月是唯一数量负增长（-12.1%）月份，考生误以为“量降价升”必是均价涨最多；命题人用“负增长=涨幅大”的直觉设陷（实际 14.8%<31.4%）。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，月度表依华图解析卷重建，答案经华图解析核对'},
{q:'【材料三】2023年前5个月，天津口岸出口汽车约17.2万辆，同比增长29.5%，总价值约100.1亿元人民币，同比增长40.2%。汽车出口占同期天津口岸出口商品总值的2.2%，较上年同期提升0.3个百分点。1~5月民营企业出口活力明显，民营企业出口约10.6万辆，同比增长64.3%，占同期天津口岸汽车出口总量的61.6%，占比较上年同期提升13个百分点。新能源汽车出口成为新的增长点，出口约11万辆，同比增长50.2%。<table class="zl-tb"><tr><th>2023年1-5月天津口岸月度出口</th><th>数量(辆)</th><th>数量增速</th><th>金额(万元)</th><th>金额增速</th></tr><tr><td>1月</td><td>29105</td><td>20.1%</td><td>151198.7</td><td>44.0%</td></tr><tr><td>2月</td><td>22785</td><td>50.1%</td><td>161250.2</td><td>97.3%</td></tr><tr><td>3月</td><td>43361</td><td>73.4%</td><td>—</td><td>—</td></tr><tr><td>4月</td><td>40437</td><td>49.6%</td><td>—</td><td>53.2%</td></tr><tr><td>5月</td><td>36519</td><td>-12.1%</td><td>—</td><td>0.9%</td></tr></table>（月度表依解析卷重建）<div class="zl-q">在以下信息中，能够从上述资料中推出的有几项？①2022年1~5月，天津口岸汽车出口量最大的是3月 ②2023年1~5月，民营企业月均通过天津口岸出口汽车2万辆以上 ③2023年2月，天津口岸出口汽车平均单价高于1月水平 ④2022年1~5月，汽车出口总价值占天津口岸出口商品总值的2%以下</div>',opts:['1', '2', '3', '4'],ans:2,point:'综合推断（推出几项）',solve:'①基期量=现期÷(1+r)：1月29105/1.201≈24234、2月22785/1.501≈15180、3月43361/1.734≈25006、4月40437/1.496≈27030、5月36519/0.879≈41546——最大是5月，①错；②10.6÷5=2.12万辆>2万 ✓；③1月单价=151198.7/29105≈5.19万元/辆、2月=161250.2/22785≈7.08万元/辆，2月更高 ✓；④2.2%-0.3%=1.9%<2% ✓。共3项。',key:'①需先求各月基期量再比较；④百分点相减得 1.9%（注意“2%以下”含 1.9%）。',traps:[{'o': 0, 'why': 'A 项 1：只推出②，放弃验算其余；命题人用“计算量大”劝退设陷。'}, {'o': 1, 'why': 'B 项 2：把①算作正确——3月基期 25006 看似大，但 5 月基期 41546 更大（量降反使基期放大）；命题人用“现期量大基期也大”的错觉设陷。'}, {'o': 3, 'why': 'D 项 4：把①误判为正确且漏算②；命题人用“3月现期量最大”的直接印象设陷。'}],src:'2024河南省考·行测·资料分析',yr:2024,srcType:0,orig:'2024河南省考《行测》真题（粉笔网友回忆版）题干，月度表依华图解析卷重建，答案经华图解析核对'},

{q:'【材料】2025年12月，我国新能源汽车产销量分别为171.8万辆和171万辆，同比分别增长12.3%和7.2%，环比分别下降8.6%和6.2%。其中，纯电动车销量110.8万辆，同比增长13.8%，环比下降5.3%；插电式混动销量59.9万辆，同比下降3.7%，环比下降8.1%。2025年新能源汽车产销量分别为1662.6万辆和1649万辆，同比分别增长29%和28.2%。其中，纯电动车销量1062.2万辆，同比增长37.6%；插电式混动销量586.1万辆，同比增长14%。2025年新能源汽车渗透率（新能源汽车销量占汽车销量比重）47.9%，同比上升7个百分点；12月新能源汽车渗透率52.3%，环比下降0.9个百分点。2025年新能源汽车出口261.5万辆，同比增长1倍；12月新能源汽车出口30万辆，同比增长1.2倍，环比下降0.1%。2025年12月，我国动力和储能电池产量201.7GWh（1GWh=100万千瓦时），环比增长14.4%，同比增长62.1%；销量199.3GWh，环比增长11.1%，同比增长57.5%。其中，动力电池销量143.8GWh，环比增长7.3%，同比增长49.2%。出口方面：12月我国动力和储能电池出口32.6GWh。其中，动力电池出口量19GWh，环比减少10.4%，同比增长47.1%，储能电池出口量13.6GWh，环比增长23.9%，同比增长52.2%。装车量方面：12月国内动力电池装车量（生产的新能源汽车上安装的所有动力电池的总能量）98.1GWh，环比增长4.9%，同比增长35.1%。<div class="zl-q">2025年11月，我国动力电池出口量约是储能电池出口量的多少倍？</div>',opts:['1.3', '1.6', '1.9', '2.2'],ans:2,point:'基期量计算',solve:'11月动力电池出口=19÷(1-10.4%)=19÷0.896≈21.2GWh；11月储能电池出口=13.6÷(1+23.9%)=13.6÷1.239≈11.0GWh。倍数=21.2÷11.0≈1.93，最接近1.9。',key:'求基期（11月）做比：先由“环比增速”反推各基期量，再相除；注意动力是环比减少10.4%（除0.896）。',traps:[{'o': 0, 'why': 'A 项 1.3：直接用现期比19÷13.6≈1.4 附近错估或增速方向用反；命题人用现期量直接相除设陷。'}, {'o': 1, 'why': 'B 项 1.6：只对储能做基期修正（19÷11≈1.7 附近）、动力未修正；命题人用“只修正一半”设陷。'}, {'o': 3, 'why': 'D 项 2.2：把“环比减少10.4%”误作“环比增长10.4%”或两个基期都按增算；命题人用增减号颠倒设陷。'}],src:'2026河南省考·行测·资料分析',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'【材料】2025年12月，我国新能源汽车产销量分别为171.8万辆和171万辆，同比分别增长12.3%和7.2%，环比分别下降8.6%和6.2%。其中，纯电动车销量110.8万辆，同比增长13.8%，环比下降5.3%；插电式混动销量59.9万辆，同比下降3.7%，环比下降8.1%。2025年新能源汽车产销量分别为1662.6万辆和1649万辆，同比分别增长29%和28.2%。其中，纯电动车销量1062.2万辆，同比增长37.6%；插电式混动销量586.1万辆，同比增长14%。2025年新能源汽车渗透率（新能源汽车销量占汽车销量比重）47.9%，同比上升7个百分点；12月新能源汽车渗透率52.3%，环比下降0.9个百分点。2025年新能源汽车出口261.5万辆，同比增长1倍；12月新能源汽车出口30万辆，同比增长1.2倍，环比下降0.1%。2025年12月，我国动力和储能电池产量201.7GWh（1GWh=100万千瓦时），环比增长14.4%，同比增长62.1%；销量199.3GWh，环比增长11.1%，同比增长57.5%。其中，动力电池销量143.8GWh，环比增长7.3%，同比增长49.2%。出口方面：12月我国动力和储能电池出口32.6GWh。其中，动力电池出口量19GWh，环比减少10.4%，同比增长47.1%，储能电池出口量13.6GWh，环比增长23.9%，同比增长52.2%。装车量方面：12月国内动力电池装车量（生产的新能源汽车上安装的所有动力电池的总能量）98.1GWh，环比增长4.9%，同比增长35.1%。<div class="zl-q">2025年12月国内平均每生产1辆新能源汽车安装的动力电池能量比上月：</div>',opts:['低不到10千瓦时', '低10千瓦时以上', '高不到10千瓦时', '高10千瓦时以上'],ans:2,point:'平均数增长率',solve:'12月每辆装车量=98.1GWh÷171.8万辆≈571Wh/辆（57.1千瓦时）；11月装车量=98.1÷1.049≈93.5GWh，11月产量=171.8÷0.914≈188万辆，每辆≈497Wh（49.7千瓦时）。12月比11月高约7.4千瓦时，不到10千瓦时。',key:'平均数比较：装车量÷产量；11月数据用环比增速反推，比较差值落到区间。',traps:[{'o': 0, 'why': 'A 项低不到10：方向判断反（11月装车量低、12月高），或把分子分母用销量错配；命题人用方向颠倒设陷。'}, {'o': 1, 'why': 'B 项低10以上：同时犯方向与量级错误，或用“装车量环比+4.9%<产量环比-8.6%”的直觉倒推；命题人用环比直觉设陷。'}, {'o': 3, 'why': 'D 项高10以上：用销量（171万辆）替代产量做分母、或11月产量未修正，差值被放大；命题人用产销口径偷换设陷。'}],src:'2026河南省考·行测·资料分析',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'【材料】2025年12月，我国新能源汽车产销量分别为171.8万辆和171万辆，同比分别增长12.3%和7.2%，环比分别下降8.6%和6.2%。其中，纯电动车销量110.8万辆，同比增长13.8%，环比下降5.3%；插电式混动销量59.9万辆，同比下降3.7%，环比下降8.1%。2025年新能源汽车产销量分别为1662.6万辆和1649万辆，同比分别增长29%和28.2%。其中，纯电动车销量1062.2万辆，同比增长37.6%；插电式混动销量586.1万辆，同比增长14%。2025年新能源汽车渗透率（新能源汽车销量占汽车销量比重）47.9%，同比上升7个百分点；12月新能源汽车渗透率52.3%，环比下降0.9个百分点。2025年新能源汽车出口261.5万辆，同比增长1倍；12月新能源汽车出口30万辆，同比增长1.2倍，环比下降0.1%。2025年12月，我国动力和储能电池产量201.7GWh（1GWh=100万千瓦时），环比增长14.4%，同比增长62.1%；销量199.3GWh，环比增长11.1%，同比增长57.5%。其中，动力电池销量143.8GWh，环比增长7.3%，同比增长49.2%。出口方面：12月我国动力和储能电池出口32.6GWh。其中，动力电池出口量19GWh，环比减少10.4%，同比增长47.1%，储能电池出口量13.6GWh，环比增长23.9%，同比增长52.2%。装车量方面：12月国内动力电池装车量（生产的新能源汽车上安装的所有动力电池的总能量）98.1GWh，环比增长4.9%，同比增长35.1%。<div class="zl-q">2025年11月，我国动力和储能电池产量比销量：</div>',opts:['高4%以上', '低4%以上', '高不到4%', '低不到4%'],ans:3,point:'增长率计算',solve:'11月产量=201.7÷1.144≈176.3GWh；11月销量=199.3÷1.111≈179.4GWh。产量低于销量，(179.4-176.3)÷179.4≈1.7%，即低不到4%。',key:'基期量做差比较：产量/销量都按环比增速反推11月，产量-销量后除以销量得差距百分比。',traps:[{'o': 0, 'why': 'A 项高4%以上：把“产量比销量高”方向搞反（实际产量低于销量），或用现期值直接比；命题人用方向颠倒设陷。'}, {'o': 1, 'why': 'B 项低4%以上：计算差距时基数用错（如(179.4-176.3)÷176.3≈1.8%仍不到4%，需放大误算）；命题人用基数错配设陷。'}, {'o': 2, 'why': 'C 项高不到4%：方向错误——产量实际低于销量，误判为高；命题人用“产量增速高于销量”的错觉设陷。'}],src:'2026河南省考·行测·资料分析',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'【材料】2025年12月，我国新能源汽车产销量分别为171.8万辆和171万辆，同比分别增长12.3%和7.2%，环比分别下降8.6%和6.2%。其中，纯电动车销量110.8万辆，同比增长13.8%，环比下降5.3%；插电式混动销量59.9万辆，同比下降3.7%，环比下降8.1%。2025年新能源汽车产销量分别为1662.6万辆和1649万辆，同比分别增长29%和28.2%。其中，纯电动车销量1062.2万辆，同比增长37.6%；插电式混动销量586.1万辆，同比增长14%。2025年新能源汽车渗透率（新能源汽车销量占汽车销量比重）47.9%，同比上升7个百分点；12月新能源汽车渗透率52.3%，环比下降0.9个百分点。2025年新能源汽车出口261.5万辆，同比增长1倍；12月新能源汽车出口30万辆，同比增长1.2倍，环比下降0.1%。2025年12月，我国动力和储能电池产量201.7GWh（1GWh=100万千瓦时），环比增长14.4%，同比增长62.1%；销量199.3GWh，环比增长11.1%，同比增长57.5%。其中，动力电池销量143.8GWh，环比增长7.3%，同比增长49.2%。出口方面：12月我国动力和储能电池出口32.6GWh。其中，动力电池出口量19GWh，环比减少10.4%，同比增长47.1%，储能电池出口量13.6GWh，环比增长23.9%，同比增长52.2%。装车量方面：12月国内动力电池装车量（生产的新能源汽车上安装的所有动力电池的总能量）98.1GWh，环比增长4.9%，同比增长35.1%。<div class="zl-q">2025年12月，我国除纯电动和插电式混动之外的新能源汽车销量占汽车总销量的：</div>',opts:['不到0.1%', '0.1%～0.3%', '0.3%～0.6%', '0.6%以上'],ans:0,point:'现期比重',solve:'其他新能源销量=171-110.8-59.9=0.3万辆；汽车总销量=171÷52.3%≈327万辆（12月渗透率52.3%）。比重=0.3÷327≈0.09%，不到0.1%。',key:'由渗透率反推汽车总销量（新能源汽车销量÷渗透率），再做差与比重计算。',traps:[{'o': 1, 'why': 'B 项 0.1%~0.3%：比重基数误用新能源汽车销量（0.3÷171≈0.18%）而非汽车总销量；命题人用整体口径偷换设陷。'}, {'o': 2, 'why': 'C 项 0.3%~0.6%：把0.3万辆误当3万辆或渗透率用全年47.9%反推；命题人用单位错位设陷。'}, {'o': 3, 'why': 'D 项 0.6%以上：漏减插混（171-110.8=60.2万辆当作“其他”）再除总销量；命题人用漏项设陷。'}],src:'2026河南省考·行测·资料分析',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},

1,"point":"基期量","solve":"【公式】基期量 = 现期量 ÷ (1 + 增长率)<br>75187.1÷(1+21%)=75187.1÷1.21≈62138亿元，选B。","key":"基期=现期÷(1+r)，21%对应除以1.21；别用1.14或1.30这类近似分母。","traps":[{"o":2,"why":"把21%当成“扣减14%左右”（75187÷1.14≈65954），除以错误分母。"},{"o":3,"why":"估算偏高（如只扣10%），落在70000。"},{"o":0,"why":"扣减过头（如除以1.30），低估到58000。"}],"src":"真题改编（2018年联考间隔增长真题素材）","yr":2017,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题改编（2018年联考间隔增长真题素材）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年1—12月，S市实际使用外资金额239.6亿美元，比去年同期增长0.4%。其中，第三产业实际使用外资230.7亿美元，同比增长1.0%。</p><div class=\"zl-q\">2022年1—12月，S市非第三产业实际使用外资同比（ ）</div>","opts":["增长1%以内","下降不足10%","下降10%—15%","下降15%左右"],"ans":3,"point":"混合增长率","solve":"【公式】整体增速介于两部分增速之间且偏向基期量大的一方；线段法：量之比 = 距离的反比<br>整体0.4%介于三产1%与非三产r之间，且整体量239.6远大于非三产量8.9（239.6−230.7），故整体增速应更靠近三产1%一侧，r必远小于0.4%且为负。定量：(0.4%−r)÷(1%−0.4%) = 三产基期÷非三产基期 ≈ 230.7÷8.9≈25.9，得0.4%−r≈15.5%，r≈−15.1%，选D。","key":"混合增长率“居中且偏向基期量大的一方”定性排除A；定量用线段法“部分量之比=增速距离反比”。","traps":[{"o":0,"why":"A 项增长1%以内：命题人用“定性截断”设陷——考生判断出“非三产增速低于总量 0.4%”便停手，误以为幅度接近总量、方向仍为小幅增长；实际按权重反推，非三产为负增长且降幅达 15% 左右，A 项是“方向+幅度”双缺失陷阱。"},{"o":1,"why":"B 项下降不足10%：命题人用“体量与降幅的反直觉关系”设陷——非三产仅 8.9 亿美元（占 3.7%），考生直觉“小部分不影响大局”便低估其降幅；实际按线段法，8.9 亿要扛起三产高出总量 0.6 个百分点的缺口，降幅必然远超 10%，测试是否坚持定量而拒绝“占比小≈降幅小”的直觉。"},{"o":2,"why":"C 项下降10%—15%：命题人用“截位近似”设陷——若把权重粗算为 96:4、距离按 0.6 个百分点目测配比，解得降幅约 12%—14% 即落该区间；精确按 230.7:8.9≈25.9:1 的量距反比计算得 15.2%，测试考生是否用“权重×距离”精确配比而非目测比例。"}],"src":"真题化训练（十字交叉法经典结构）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（十字交叉法经典结构）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年1—12月，S市实际使用外资金额239.6亿美元，比去年同期增长0.4%。其中，第三产业实际使用外资230.7亿美元，同比增长1.0%。</p><div class=\"zl-q\">2022年，S市第三产业实际使用外资占全市实际使用外资的比重，与上年相比（ ）</div>","opts":["上升","下降","不变","无法判断"],"ans":0,"point":"比重变化判断","solve":"【公式】部分增速 ＞ 整体增速 ⇒ 比重上升；反之下降<br>第三产业增速1.0%＞全市整体增速0.4%，部分跑得比整体快，比重上升，选A。","key":"比重升降只取决于“部分增速 vs 整体增速”，与数值大小无关。","traps":[{"o":1,"why":"B 项下降：命题人用“方向反转”设陷——考生误以为“整体在增长则部分占比下降”（忽略第三产业增速1.0%＞整体0.4%），即把上升判成下降；测试比重变化判断是否直接比较部分增速与整体增速。"},{"o":3,"why":"以为需要具体数值才能判断，实际只需比较两个增速符号。"},{"o":2,"why":"把“增速接近”误当“比重不变”，忽视了1.0%与0.4%仍有大小之差。"}],"src":"真题化训练（十字交叉法经典结构）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（十字交叉法经典结构）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年1—12月，S市实际使用外资金额239.6亿美元，比去年同期增长0.4%。其中，第三产业实际使用外资230.7亿美元，同比增长1.0%。</p><div class=\"zl-q\">2022年，S市第三产业实际使用外资占全市实际使用外资的比重约为（ ）</div>","opts":["92%","94%","96%","98%"],"ans":2,"point":"现期比重","solve":"【公式】比重 = 第三产业额 ÷ 全市总额<br>230.7÷239.6≈96.3%，选C。","key":"比重=230.7/239.6≈96.3%；注意全市239.6中三产占绝对大头，占比接近96%。","traps":[{"o":3,"why":"估算偏高（如把239.6按232计），抬到98%。"},{"o":1,"why":"把分子看错（如230.7按225）或分母放大，落在94%。"},{"o":0,"why":"估算偏低或数据混入非三产业务（230.7÷250.6≈92%）。"}],"src":"真题化训练（十字交叉法经典结构）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（十字交叉法经典结构）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2021年，N市规模以上工业增加值8100亿元，同比增长9.0%。其中，装备制造业增加值同比增长12.8%，2020年装备制造业增加值为6200亿元，装备制造业对全市规模以上工业增加值增长的贡献率为45.0%。</p><div class=\"zl-q\">2021年，装备制造业拉动N市规模以上工业增加值增长（ ）个百分点</div>","opts":["3.2","4.05","4.5","5.8"],"ans":1,"point":"拉动增长与贡献率","solve":"【公式】拉动增长 = 贡献率 × 整体增速（百分点）<br>拉动百分点=45.0%×9.0%=4.05个百分点，选B。","key":"拉动(百分点)=贡献率×整体增速；贡献率是“增量占比”，拉动是“对整体增速的贡献点”。","traps":[{"o":3,"why":"D 项5.8：命题人用“公式串用”设陷——把拉动增长错用为“部分增速×贡献率”（12.8%×45%≈5.76），实为贡献率×整体增速（45%×9%=4.05）；测试拉动增长公式=贡献率×整体增速。"},{"o":2,"why":"C 项4.5：命题人用“截位取整”设陷——贡献率45% 若按50%粗算（9%×0.5=4.5）即落C；测试是否精确使用45%。"},{"o":0,"why":"A 项3.2：命题人用“增速差替代”设陷——12.8%−9.0%=3.8% 附近取3.2，考生用部分与整体增速差替代“贡献率×整体增速”；测试公式口径。"}],"src":"真题化训练（拉动增长·增长贡献率专项）","yr":2021,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（拉动增长·增长贡献率专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2021年，N市规模以上工业增加值8100亿元，同比增长9.0%。其中，装备制造业增加值同比增长12.8%，2020年装备制造业增加值为6200亿元，装备制造业对全市规模以上工业增加值增长的贡献率为45.0%。</p><div class=\"zl-q\">2021年，N市装备制造业增加值同比增量约为（ ）亿元</div>","opts":["700","794","850","900"],"ans":1,"point":"增长量","solve":"【公式】增长量 = 基期量 × 增长率<br>6200×12.8%=793.6亿元，选B。","key":"增长量=基期×r；百化分时注意12.8%≈1/7.8（而非1/8），精确到793.6。","traps":[{"o":0,"why":"用百化分时把12.8%≈1/8.9，6200÷8.9≈697，取整后误选700（正确应1/7.8）。"},{"o":2,"why":"把12.8%放大估算为13.7%或6200×13.7%≈849。"},{"o":3,"why":"把增速高估到14.5%左右，得到约900。"}],"src":"真题化训练（拉动增长·增长贡献率专项）","yr":2021,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（拉动增长·增长贡献率专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2021年，N市规模以上工业增加值8100亿元，同比增长9.0%。其中，装备制造业增加值同比增长12.8%，2020年装备制造业增加值为6200亿元，装备制造业对全市规模以上工业增加值增长的贡献率为45.0%。</p><div class=\"zl-q\">2020年，N市规模以上工业增加值约为（ ）亿元</div>","opts":["7200","7300","7430","7600"],"ans":2,"point":"基期量","solve":"【公式】基期量 = 现期量 ÷ (1 + 增长率)<br>8100÷(1+9.0%)=8100÷1.09≈7431亿元，选C。","key":"基期=现期÷(1+r)，9%对应除以1.09，别用1.1或1.125。","traps":[{"o":3,"why":"化除为乘方向反：8100×(1+9%)≈8829不对——此处陷阱为8100×0.94≈7614，扣减不足。"},{"o":0,"why":"除过头（如按8100÷1.125≈7200），把9%当成12.5%。"},{"o":1,"why":"估算偏差（如8100÷1.11≈7297），落在7300。"}],"src":"真题化训练（拉动增长·增长贡献率专项）","yr":2021,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（拉动增长·增长贡献率专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2021年，N市规模以上工业增加值8100亿元，同比增长9.0%。其中，装备制造业增加值同比增长12.8%，2020年装备制造业增加值为6200亿元，装备制造业对全市规模以上工业增加值增长的贡献率为45.0%。</p><div class=\"zl-q\">2021年，N市装备制造业增加值占规模以上工业增加值的比重约为（ ）</div>","opts":["79%","83%","86%","89%"],"ans":2,"point":"现期比重","solve":"【公式】比重 = 装备制造业现期增加值 ÷ 规上工业增加值<br>2021年装备制造业增加值=6200×(1+12.8%)=6200×1.128≈6993.6亿元；比重=6993.6÷8100≈86.3%，选C。","key":"比重分子要用“2021年现值”6993.6，不能拿2020年基期6200直接除。","traps":[{"o":0,"why":"直接用2020年装备增加值6200÷8100≈76.5%，忘了把装备值也折到2021年（现期）。"},{"o":1,"why":"装备现值估算偏低（如6200×1.1=6820→84.2%附近），落在83%。"},{"o":3,"why":"装备现值估算偏高（如6200×1.15=7130→88%），落在89%。"}],"src":"真题化训练（拉动增长·增长贡献率专项）","yr":2021,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（拉动增长·增长贡献率专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，M市粮食播种面积1450万亩，比上年增长2.0%；粮食总产量610万吨，比上年增长6.0%。其中，夏粮产量250万吨，同比增长3.0%；秋粮产量360万吨，同比增长7.5%。</p><div class=\"zl-q\">2022年，M市粮食亩均产量同比增长约（ ）</div>","opts":["2.0%","3.9%","4.0%","6.0%"],"ans":1,"point":"平均数增长率","solve":"【公式】平均数增长率 = (总量增速a − 份数增速b) ÷ (1 + 份数增速b)<br>亩均产量=总产量÷播种面积；a=6.0%，b=2.0%。平均数增长率=(6%−2%)÷(1+2%)=4%÷1.02≈3.9%，选B。","key":"平均数增长率≠两增速之差，必须再除以(1+份数增速)。","traps":[{"o":2,"why":"直接相减6%−2%=4%，漏除以(1+2%)——这是平均数增长率题型的头号陷阱。"},{"o":0,"why":"把播种面积增速2%当成亩均产量增速。"},{"o":3,"why":"把总产量增速6%当成亩均产量增速（分子分母概念混淆）。"}],"src":"真题化训练（平均数·倍数专项）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（平均数·倍数专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，M市粮食播种面积1450万亩，比上年增长2.0%；粮食总产量610万吨，比上年增长6.0%。其中，夏粮产量250万吨，同比增长3.0%；秋粮产量360万吨，同比增长7.5%。</p><div class=\"zl-q\">2022年，M市粮食亩均产量约为（ ）公斤</div>","opts":["400","421","450","480"],"ans":1,"point":"现期平均数","solve":"【公式】亩均产量 = 总产量 ÷ 播种面积；1吨 = 1000公斤<br>610万吨÷1450万亩=610÷1450吨/亩≈0.4207吨/亩≈420.7公斤/亩，选B。","key":"先算610/1450≈0.42吨/亩，再×1000换算公斤；注意单位。","traps":[{"o":0,"why":"估算偏低（如把610当成600、1450当成1525），压到400附近。"},{"o":2,"why":"分母估算偏小（如1450按1350），抬到450。"},{"o":3,"why":"单位换算或分母误差叠加，高估到480。"}],"src":"真题化训练（平均数·倍数专项）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（平均数·倍数专项）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，M市粮食播种面积1450万亩，比上年增长2.0%；粮食总产量610万吨，比上年增长6.0%。其中，夏粮产量250万吨，同比增长3.0%；秋粮产量360万吨，同比增长7.5%。</p><div class=\"zl-q\">2021年，M市粮食亩均产量约为（ ）公斤</div>","opts":["400","405","421","440"],"ans":1,"point":"基期平均数","solve":"【公式】基期平均数 = 基期总量 ÷ 基期份数；或 现期平均数 ÷ (1+平均数增长率)<br>2021年产量=610÷1.06≈575.5万吨；2021年面积=1450÷1.02≈1421.6万亩；亩均=575.5÷1421.6≈0.405吨/亩≈405公斤。（也可用421.6÷1.0392≈405.8。）选B。","key":"基期平均数要“分子分母都折回基期”；或直接用现期平均数除以(1+平均数增长率)。","traps":[{"o":2,"why":"直接用现期亩均产量421公斤，没做基期折算。"},{"o":0,"why":"只把产量折回基期、面积未折（575.5÷1450≈397公斤），低估。"},{"o":3,"why":"面积折回但产量未折或方向算反，高估到440。"}],"src":"真题化训练（平均数·倍数专项）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化训练（ 4%；分母用总额18000，别拿“城镇+乡村”以外的数。","traps":[{"o":2,"why":"估算偏高（如把分母按14700计），抬到17%。"},{"o":0,"why":"把2500误当2000或分母取大，偏到11%。"},{"o":3,"why":"分子、分母同时取错方向，虚高到20%。"}],"src":"真题化设计（按国考命题风格）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化设计（按国考命题风格）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，P市社会消费品零售总额18000亿元，同比下降2.5%。其中，城镇消费品零售额15500亿元，同比下降3.0%；乡村消费品零售额2500亿元。</p><div class=\"zl-q\">2022年，P市城镇消费品零售额同比下降约（ ）亿元</div>","opts":["430","450","480","510"],"ans":2,"point":"增长量","solve":"【公式】下降量 = 基期量 − 现期量；基期量 = 现期量 ÷ (1−r)<br>城镇基期=15500÷0.97≈15979亿元；下降量=15979−15500≈479亿元，选C。","key":"下降量=基期−现期，先除以(1−3%)还原基期；D选项是“现期直接乘”干扰。","traps":[{"o":3,"why":"直接用现期15500×3%≈465取510，未先还原基期再作差。"},{"o":1,"why":"基期还原后估算偏低（如按15900−15500=400→450），落在B。"},{"o":0,"why":"把城镇误当整体（18000×2.5%≈450）或截位误差，明显偏低。"}],"src":"真题化设计（按国考命题风格）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化设计（按国考命题风格）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，P市社会消费品零售总额18000亿元，同比下降2.5%。其中，城镇消费品零售额15500亿元，同比下降3.0%；乡村消费品零售额2500亿元。</p><div class=\"zl-q\">2022年，P市乡村消费品零售额占零售总额的比重，与上年相比（ ）</div>","opts":["上升","下降","不变","无法判断"],"ans":0,"point":"混合增长率","solve":"【公式】混合增长率介于两部分增速之间；整体增速 −2.5% 介于城镇 −3.0% 与乡村增速之间 ⇒ 乡村增速 ＞ −2.5%<br>整体−2.5%介于城镇−3.0%与乡村r之间，且−3.0%＜−2.5%，故乡村增速r＞−2.5%（下降更慢甚至可能增长）。乡村跑得比整体快，占比上升，选A。","key":"混合增长率定性：整体增速必然夹在城镇与乡村之间，乡村r＞−2.5%＞城镇，故乡村占比升。","traps":[{"o":1,"why":"B 项下降：命题人用“整体印象”设陷——考生见整体−2.5%、城镇−3.0% 均为负便判“乡村占比下降”，忽略混合增长率居中原理（乡村增速＞−2.5%）；测试是否用混合增长率定位部分增速区间。"},{"o":3,"why":"D 项无法判断：命题人用“信息恐慌”设陷——考生以为缺乡村具体增速就无法判断，实则混合增长率“介于两部分增速之间”即可定性；测试是否掌握居中原理。"},{"o":2,"why":"C 项不变：命题人用“增速混同”设陷——把整体−2.5% 误当城镇−3.0% 与乡村等速的中间值，判“占比不变”；实际乡村降速慢于城镇、占比上升；测试是否比较部分与整体增速。"}],"src":"真题化设计（按国考命题风格）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化设计（按国考命题风格）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"},{"q":"<p style=\"margin:5px 0;line-height:1.7\">2022年，P市社会消费品零售总额18000亿元，同比下降2.5%。其中，城镇消费品零售额15500亿元，同比下降3.0%；乡村消费品零售额2500亿元。</p><div class=\"zl-q\">2021年，P市城镇消费品零售额约是乡村消费品零售额的（ ）倍</div>","opts":["5.8","6.1","6.4","6.7"],"ans":2,"point":"基期倍数","solve":"【公式】基期倍数 = 城镇基期量 ÷ 乡村基期量<br>城镇基期=15500÷0.97≈15979亿元；乡村基期=整体基期−城镇基期=18462−15979≈2483亿元；15979÷2483≈6.4倍，选C。","key":"基期倍数要求城镇、乡村都还原到2021年；乡村基期用“整体−城镇”间接求得。","traps":[{"o":0,"why":"A 项5.8：命题人用“现期倍数当基期”设陷——15500÷2500=6.2 为现期倍数，考生未做基期还原又截位偏低即得5.8；测试基期倍数需分别还原两年基期再相除。"},{"o":3,"why":"D 项6.7：命题人用“基期估算偏差”设陷——城镇基期（15979）若估高、乡村基期（约2483）若取小，倍数即被抬至6.7；测试两步基期还原是否精确。"},{"o":1,"why":"B 项6.1：命题人用“分母取大”设陷——乡村基期约2483，考生若按2600 计，15979÷2600≈6.1；测试乡村基期=整体基期−城镇基期是否算对。"}],"src":"真题化设计（按国考命题风格）","yr":2022,"srcType":2,"orig":"真题化训练题库转存（ziliao-fenxi-practice）：来源 真题化设计（按国考命题风格）；数据经校订自洽可独立验算，答案由题库原始解析逐题核对。"}
