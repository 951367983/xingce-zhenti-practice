const QB4=[{"q": "<div class=\"zl-q\">推进公交专用车道的开放共享，不等于废除公交专用通道，更不等于在城市交通治理中不再坚持“公交先行”的理念。理想状况下的公交专用通道共享，应该是在不影响公交通行效率的前提下，方便社会车辆的通行，从而在整体上提升道路交通的通行效率，而并非____。</div>", "opts": ["不分彼此", "厚此薄彼", "顾此失彼", "此消彼长"], "ans": 2, "point": "语境对应·关键词定位", "solve": "横线前“在不影响公交通行效率的前提下方便社会车辆通行”即“二者兼顾”，由“而并非”引出反面，应选“顾此失彼”（顾了这个丢了那个）。注意：横线对应的是“我们采取的举措”本身，而非措施导致的结果。", "key": "对应定位第一：横线对应“我们采取的举措”（兼顾双方），而非对应结果；“而并非”是反义提示，前文“二者兼顾”直接锁定“顾此失彼”。", "traps": [{"o": 0, "why": "不分彼此形容关系亲密不分你我，主语应是双方关系而非“举措”，且与“兼顾”的反面无关——用近义迷惑却搭配错位。"}, {"o": 1, "why": "厚此薄彼=重视一方轻视另一方，含主观偏向色彩；文段讨论的是“兼顾”的客观目标，方向相反——命题人用“此/彼”字面同构做干扰。"}, {"o": 3, "why": "此消彼长=一方上升另一方下降，暗示零和不可兼得，与文段“可以兼顾、提升整体效率”的立场直接冲突——用常识中的资源竞争联想诱错。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">所谓环境影响评价，是指对规划和建设项目实施后可能造成的环境影响进行分析、预测和评估，提出预防或减轻不良环境影响的对策和措施，进行跟踪监测的方法与制度。可以说，环境影响评价是控制环境风险的“____”，也是在发展中守住绿水青山的第一道防线，对协同推进经济高质量发展和生态环境高水平保护发挥着重要作用。</div>", "opts": ["预警机", "安全阀", "试金石", "缓冲器"], "ans": 1, "point": "语境对应·关键词定位", "solve": "第一道防线”提示该制度起“保安全”作用；“安全阀”语义宽泛，只要为了保安全一般都能对应。注意环评的核心动作是“提出对策和措施”，措施无法“预警”。", "key": "对应的是“制度/措施”本身而非结果：提出对策措施无法对应预警、缓冲；“第一道防线”→保安全→安全阀。", "traps": [{"o": 0, "why": "预警机=提前发现信号。环评的动作是“提出对策措施”，对策措施无法起到预警作用——命题人用“分析预测评估”字眼诱导选预警。"}, {"o": 2, "why": "试金石=检验真假的标准。环评是预防性防控制度，不是检验真伪的标尺，与“第一道防线”定位错位。"}, {"o": 3, "why": "缓冲器=减缓冲击。环评重在事前预防而非事后缓冲，且“对策措施”无法对应缓冲作用。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">世界航天大国都在积极开展空间碎片清除技术研究，提出了各自的清除方案。总的来看有两大类：一类是接触式，如机械臂抓捕、安装离轨装置等；第二类是非接触式，如用激光或离子束等进行推移。两类清除方式____，都是要让碎片离开当前轨道，进入大气层烧毁。</div>", "opts": ["如出一辙", "殊途同归", "双管齐下", "各有千秋"], "ans": 1, "point": "成语辨析·拆分对应", "solve": "接触式/非接触式”两类方式不同=殊途；“都是要让碎片离开当前轨道进入大气层烧毁”=同归。“殊途同归”是完美的成语拆分对应。", "key": "成语拆分对应法：把“殊途同归”拆开——殊途（两类方式不同）+同归（都让碎片离轨烧毁），词素逐一对上即秒杀。", "traps": [{"o": 0, "why": "如出一辙=两件事非常相像。两类方式原理完全不同（机械臂 vs 激光），强调相似恰与文意相反。"}, {"o": 2, "why": "双管齐下=两方面同时进行。文段说的是两种方式达到同一结果，不是“同时用两种手段”，且主语应是措施而非方式。"}, {"o": 3, "why": "各有千秋=各有各的长处。强调优劣特色差异，与后文“都是要让碎片离轨”的结果一致性无关。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">全面从严治党和鼓励担当作为是内在统一的，不是彼此对立的。严并不是要把大家管死，使人瞻前顾后、畏首畏尾，搞成暮气沉沉、____的一潭死水，而是要通过明方向、____、正风气、强免疫，形成风清气正的党内政治生态，营造有利于干事创业的良好环境，进一步调动全党的积极性、主动性、创造性。</div>", "opts": ["浑浑噩噩 讲原则", "唯唯诺诺 严法纪", "无所事事 守底线", "无所作为 立规矩"], "ans": 3, "point": "主体视角·角色对应", "solve": "第一空与“暮气沉沉”顿号并列，都形容没有活力→“无所作为”。第二空“明方向、正风气、强免疫”是并列的治理动作，横线前后无明显对应时回到全文中心——全面从严治党→“立规矩”（治理者视角的主动建设）。", "key": "中心对应法：横线前后无明显对应时，回到全文中心/中心句——全面从严治党是治理话题，第二空应为治理动作“立规矩”，而非守底线/讲原则。", "traps": [{"o": 0, "why": "浑浑噩噩=糊里糊涂混日子，与“暮气沉沉”的侧重点不同（一个是昏聩一个是无生气）；“讲原则”是防御姿态，与“明方向、正风气、强免疫”的主动建设动作不成系列。"}, {"o": 1, "why": "唯唯诺诺=一味顺从，是“把人管死”的表现之一而非“一潭死水”本身的特征；“严法纪”与“严”字重复，且非“明方向”同列的建设性动词。"}, {"o": 2, "why": "无所事事=无事可做，与“暮气沉沉”并列时语义偏轻；“守底线”是被动守住下限，与“立规矩”的主动建章立制相比缺治理者视角。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">公正司法是维护社会公平正义的最后一道防线。在社会关系调节和纠纷解决中，司法具有____作用。党的十八大以来，我们着力深化司法体制改革，加快建设公正高效权威的社会主义司法制度。让人民群众与司法“零距离”，使公平正义更加可见、可感、可____。</div>", "opts": ["强制性 信任", "预防性 贴近", "指导性 实现", "终局性 触及"], "ans": 3, "point": "语境对应·关键词定位", "solve": "最后一道防线”→司法是纠纷解决的终局环节→“终局性”；第二空“可见、可感、可触及”是感官排比（看/感受/接触）。", "key": "严谨的逻辑对应：“最后一道防线”→终局性；“可见、可感、可触及”排比锁第二空。", "traps": [{"o": 0, "why": "强制性是司法的属性之一，但“最后一道防线”对应的是“终局性”而非强制；第二空“信任”无法与“可见、可感”构成感官排比。"}, {"o": 1, "why": "预防性对应的是“第一道防线”，与“最后一道防线”正好相反——命题人用“防线”字面做反向干扰。"}, {"o": 2, "why": "指导性非本题要点，且“实现”与“可见、可感”的感官动词排比不协调——公平正义是“触及”而非“实现”。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">北极地区常年漂浮着体积巨大、厚薄不一的海冰。面对这些海冰，绝大部分战舰只能____，唯有破冰船和冰面下的潜艇敢于一试身手。当前，世界上力量最强的破冰船，排水量可达3.3万吨，能够____地破开近3米厚的坚冰，堪称北极航线上的开路先锋。</div>", "opts": ["望而却步 轻而易举", "束手无策 易如反掌", "退避三舍 游刃有余", "裹足不前 长驱直入"], "ans": 0, "point": "成语辨析·本义区分", "solve": "第一空“面对海冰”+“唯有…敢于一试身手”→不敢尝试→“望而却步”；第二空“破开近3米厚坚冰”→“轻而易举”。", "key": "成语本义辨析：退避三舍=主动退让九十里，无害怕义→排除；“面对”+“望而却步”搭配不重复（面对的是客观障碍，却步是主观畏惧）。", "traps": [{"o": 1, "why": "束手无策=一点办法都没有，语义过重——战舰只是“不敢试”，并非毫无办法；“易如反掌”强调极容易，与“3.3万吨破冰船破3米冰”的作业语境略过。"}, {"o": 2, "why": "退避三舍=主动退让、回避冲突，并无“不敢、害怕”的意思——命题人用“退让”偷换“畏惧”，是本题最强陷阱。"}, {"o": 3, "why": "裹足不前=犹豫徘徊不敢前进，第一空近义可留；但“长驱直入”形容进军迅猛直达，主语应是“进”的一方，与破冰船“破开坚冰”的作业动作不搭。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">从长远看，保护个人信息，并不是把信息数据与互联网经济____开来，而是应当探讨如何在必要、合理、合规的基础上，实现信息保护与利用的共赢。在大数据、信息化时代，如何在海量个人信息中____敏感信息、利用好其他可用信息，对发展信息产业、平衡数据应用与用户权益之间的关系，都具有重要意义。</div>", "opts": ["独立 屏蔽", "分离 甄别", "区别 剔除", "隔绝 剥离"], "ans": 3, "point": "高频复现词统计", "solve": "第一空“不是…而是…共赢”→不是完全分开→“隔绝”；第二空把“敏感信息”从海量信息中分离出来→“剥离”（融合事物中分离出某事物）。", "key": "高频统计+本义：“剥离”在国省考及事业联考中共出现8次、7次为正确答案；剥离=从融合的事物中分离出某事物（剥离业务、职能）。“不是…而是”反义并列，首空要“完全分开”→隔绝。", "traps": [{"o": 0, "why": "“独立开来”搭配不当（独立是形容词，不接“开来”）；第二空“屏蔽”是把信息挡住不显示，与“利用好其他可用信息”的分离处理不同。"}, {"o": 1, "why": "“分离开来”语法可通，但第二空“甄别”是辨别真假优劣，文中“敏感/可用”是按性质分离而非鉴别；且“隔绝”比“分离”更贴合“不是完全割裂”的反面。"}, {"o": 2, "why": "“区别开来”是认识上的分辨，不是物理分离动作；“剔除”是把坏的去掉，敏感信息只是需专门保护处理，并非清除。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">“木刻分水”是哈尼族在长期梯田农耕活动中形成的____分配水源的制度，具体做法是：根据沟渠所能灌溉的梯田面积，经过集体协商，确定每份梯田应得水量，刻在横木上，作为分配水源的尺子。哈尼人用其量水、分水，取之有度，用之有节，既体现出对大自然的崇敬，也实现了对水资源的____。</div>", "opts": ["公平 精打细算", "便捷 物尽其用", "科学 量入为出", "精确 开源节流"], "ans": 0, "point": "实词辨析·语义侧重", "solve": "作为分配水源的尺子”→公平（尺子=衡量标准）；“取之有度，用之有节”→精打细算。", "key": "尺子→公平，关键词直接锁第一空；量入为出=根据收入决定支出，文段无“收入”→排除 C 第二空。", "traps": [{"o": 1, "why": "便捷是方便快捷，而制度核心是“按面积公平分配”；“物尽其用”侧重充分发挥物品作用，与“有度、有节”的节制节约侧重点不同。"}, {"o": 2, "why": "“尺子”直接对应“公平”而非科学；量入为出=根据收入决定支出，文段并未体现“收入”——命题人用家庭理财概念偷换语境。"}, {"o": 3, "why": "分配依据是“面积”而非精确数值；“开源节流”指广开财源节省支出，文中无“开源”含义——用经济学术语做干扰。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">“潜”是“显”的基础，“显”是“潜”的结果。对于事关长远、事关基础的任务，“一口吃不成个胖子”，就要扎扎实实、稳步有序推进。这些工作并不____，政绩也并非____，但有助于各项事业全面发展、长足进步，是真正对党、对人民、对历史负责的体现。</div>", "opts": ["声势浩大 家喻户晓", "惊天动地 有目共睹", "显山露水 一目了然", "轰轰烈烈 引人注目"], "ans": 2, "point": "语境对应·中心话题", "solve": "全文中心词是“潜”与“显”：工作“不显山露水”（不显露）、政绩“并非一目了然”（不明显），首尾照应。", "key": "中心对应：抓全文中心“潜/显”二字，两空都围绕“不显露、不明显”→显山露水+一目了然。", "traps": [{"o": 0, "why": "声势浩大形容声威气势，与“扎扎实实稳步推进”的低调语境相悖；“家喻户晓”侧重知名度，与“政绩”搭配弱。"}, {"o": 1, "why": "惊天动地程度过重，且与“潜”的积累语境冲突；“有目共睹”人人可见，恰与“并不显山露水”的隐性特点相反。"}, {"o": 3, "why": "轰轰烈烈同“声势浩大”一样偏张扬，与“潜”对立；“引人注目”是吸引注意，与“政绩”的可见性对应不足。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">史书是古人写就的，有些内容可能会因有人随意取舍、记忆有误或者心存故意而____历史真实。运用基因等高科技手段的考古研究是科学，它以客观而非主观的科学事实和科学数据得出结论。科学可以检验，可以用重复操作检验此前的研究成果是否准确、正确，从而____了人为造假的可能。</div>", "opts": ["违背 化解", "掩盖 规避", "虚构 杜绝", "偏离 降低"], "ans": 3, "point": "多对一·全匹配验证", "solve": "第一空“随意取舍、记忆有误、心存故意”三个诱因必须都能对应：随意取舍→偏离（不是虚构、违背、掩盖）。第二空“重复操作检验”只是二次核验→“降低”造假可能（不至于杜绝、规避）。", "key": "多对一全匹配：三个诱因（随意取舍/记忆有误/心存故意）须全部对应“偏离”；程度轻重：二次检验→降低（不至于杜绝/规避）。", "traps": [{"o": 0, "why": "“记忆有误”导致的不是“违背”历史真实（违背是主动违反）；“化解”搭配“可能”不当，化解的是矛盾不是可能。"}, {"o": 1, "why": "“随意取舍”可掩盖事实，但“记忆有误”无法对应“掩盖”——多对一要求三个诱因全匹配；“规避”是主动躲开，检验是事后核实，无法规避造假。"}, {"o": 2, "why": "“记忆有误”不是主动虚构；“杜绝”程度过重——仅仅是检验手段，不能保证绝无造假。命题人用“造假”字眼诱导选杜绝。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">推进乡村振兴必须规避两种倾向：一是“只见树木、不见森林”，打造“样板村”，并将资源或政策向其倾斜；二是“____、平均用力”，即将单一发展方式套用到所有农村，或将资源进行简单分解。只有尊重农村发展实际和市场规律，____实施振兴政策，才能使广大农民得到实惠。</div>", "opts": ["一视同仁 脚踏实地", "等量齐观 因地制宜", "面面俱到 坚定不移", "不偏不倚 步步为营"], "ans": 1, "point": "标点/符号提示", "solve": "第一空后紧跟顿号“____、平均用力”，顿号表并列→横线应与“平均用力”构成同义并列（把不同事物同等看待）→“等量齐观”；第二空“尊重农村发展实际”→“因地制宜”。标点定位：顿号=同义并列互证。", "key": "标点定位：顿号=同义并列，横线与“平均用力”互证→等量齐观（不分区别同等看待）；第二空由“尊重农村实际”锁定因地制宜。", "traps": [{"o": 0, "why": "一视同仁是不分厚薄同等对待，偏正面色彩且多用于对人的态度，与“平均用力”的否定语境及“发展方式”的搭配均不符。"}, {"o": 2, "why": "面面俱到是各方面都照顾到，侧重“全”而非“平均”，与“平均用力”的并列对应不准。"}, {"o": 3, "why": "不偏不倚是公正不偏向，偏正面；“步步为营”是稳扎稳打，与“尊重农村实际”的因地制宜错位。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">马克思主义理论必须随着实践发展而发展，必须中国化才能____、本土化才能深入人心。马克思主义中国化的进程是中国共产党人解放思想、统一思想的过程。解放思想不是脱离国情的____，也不是闭门造车的主观想象，而是要求我们一切从实际出发。</div>", "opts": ["薪火相传 高谈阔论", "枝繁叶茂 空穴来风", "落地生根 异想天开", "生生不息 海市蜃楼"], "ans": 2, "point": "逻辑关联·并列对应", "solve": "第一空“中国化…本土化”扎根语境→“落地生根”；第二空“解放思想不是…也不是闭门造车的主观想象”→思想层面的“异想天开”。", "key": "并列对应：解放思想、异想天开、主观想象均为思想层面内容，海市蜃楼不是→排除 D；“中国化/本土化”→落地生根。", "traps": [{"o": 0, "why": "薪火相传=学问技艺代代相传，与“中国化/本土化”的扎根语境不对应；高谈阔论可搭，但第一空已错。"}, {"o": 1, "why": "枝繁叶茂是繁荣茂盛，无法对应“本土化才能深入人心”的落地；“空穴来风”本义是消息有根据（常被误用），与解放思想语境混乱。"}, {"o": 3, "why": "生生不息侧重持续生长，与扎根落地弱；“海市蜃楼”是虚幻景象，不属于思想层面的内容，与“解放思想、主观想象”的并列对应错位——命题人用“虚幻”联想设陷。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">区块链技术使得消费者可以放心“买全球”。当货物从海外运往中国时，物流数据已经开始在区块链上运行。每个进口商品都获得____的“身份证”，手机扫一扫，就能看到生产、物流全环节，所有信息不可____，海淘又多了一分保障。</div>", "opts": ["简明扼要 变更", "独一无二 篡改", "一成不变 复制", "与众不同 撤销"], "ans": 1, "point": "常识/背景对应", "solve": "身份证”的特点→独一无二；“区块链…信息不可篡改”→固定搭配。", "key": "常识对应：身份证→独一无二；不可篡改是区块链固定搭配，直接锁定。", "traps": [{"o": 0, "why": "简明扼要是表达方式的特点，而身份证的核心特点是唯一性；“变更”与“不可篡改”相比弱且非区块链专用搭配。"}, {"o": 2, "why": "一成不变形容不变，与“身份证”要强调的“唯一”不符——命题人用“不可变”字面设陷。"}, {"o": 3, "why": "与众不同=与他人不同，力度弱于“独一无二”，无法体现“一物一码”的唯一性本质；“撤销”与区块链不可变特性不匹配。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">许多老大难问题之所以长期无解，重要原因是调查研究流于形式，导致情况吃得不透、病根找得不准。有的是“盲人摸象”式调研，眼中只有一个个孤立的“盆景”，得出的结论往往是____；有的是“刻舟求剑”式调研，对新情况多凭主观判断下结论，导致出台的政策____不强。</div>", "opts": ["以偏概全 针对性", "老生常谈 科学性", "一孔之见 时效性", "闭门造车 可行性"], "ans": 0, "point": "逻辑关联·并列对应", "solve": "盲人摸象”→以偏概全（只摸到局部就当整体）；“刻舟求剑”（忽视变化）→政策“针对性”不强。成语与填空一一并列对应。", "key": "并列对应并列：盲人摸象→以偏概全；刻舟求剑（忽视变化）→针对性。", "traps": [{"o": 1, "why": "老生常谈=陈旧话题反复说，与“盲人摸象”的“只看局部”不对应；科学性对应的是“是否符合规律”，与刻舟求剑的“忽视变化”错位。"}, {"o": 2, "why": "一孔之见与盲人摸象近义可暂留，但“时效性”对应的是“时间”，刻舟求剑要对应“变化/针对性”，且“政策时效性不强”搭配弱于“针对性不强”。"}, {"o": 3, "why": "闭门造车=脱离实际凭空造，与“只见局部”的盲人摸象视角不同；可行性对应“能否执行”，与刻舟求剑的语境无关。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">守正是创新的前提，创新是守正的路径。守正不是____、循规蹈矩，而是守住本和源、根和魂；创新也不是凭空幻想、____，而是在把握事物发展规律的基础上充分发挥主观能动性。只有守正，才能恪守正道、____；只有创新，才能与时俱进、推陈出新。</div>", "opts": ["陈陈相因 纸上谈兵 正本清源", "抱残守缺 天马行空 返璞归真", "食古不化 向壁虚造 拨乱反正", "墨守成规 恣意妄为 固本强基"], "ans": 3, "point": "成语辨析·本义区分", "solve": "第一空与“循规蹈矩”并列（守正的反面：保守不变）→墨守成规（守着老规矩不肯改变）；第二空与“凭空幻想”并列（不切实际的错误作为）→恣意妄为；第三空呼应“守住本和源”→固本强基（加固根本、强化基础）。原文出处即“守正不是墨守成规、循规蹈矩，而是守住本和源、根和魂，恪守正道、固本强基”。", "key": "原文出处锁定：该句完整表述即“守正不是墨守成规、循规蹈矩……恪守正道、固本强基”——第三空“固本强基”直接呼应“守住本和源”。", "traps": [{"o": 0, "why": "“纸上谈兵”=空谈理论不能解决实际问题，文段未体现“空谈理论”，“凭空幻想”侧重不切实际的想象——命题人用“空谈”字面诱导；第三空“正本清源”偏“治理乱象”，与“恪守正道”并列弱于“固本强基”。"}, {"o": 1, "why": "本题最强干扰：前两空“抱残守缺（并列循规蹈矩）、天马行空（并列凭空幻想）”均成立，但第三空“返璞归真”=恢复质朴本性，与“守住本和源”不符——命题人把三个“半对”的词组进 B 项。"}, {"o": 2, "why": "食古不化=学了古代知识不会运用，与“守正”（保守不变）话题半对但侧重“食古”；“向壁虚造”=凭空捏造，与“凭空幻想”语义重复堆叠；“拨乱反正”=消除混乱恢复正常，文段未体现“从乱到治”。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "答案依求是网原文核实：官方论述原文即“守正不是墨守成规、循规蹈矩，而是守住本和源、根和魂，恪守正道、固本强基”"}, {"q": "<div class=\"zl-q\">读书学习的过程，实际上是一个不断思考认知的过程。思考是阅读的____，是认知的必然，是把书读活的关键。如果只是机械地阅读、被动地接受、____地浏览，没有思考，____，再好的知识也难以吸收和消化。</div>", "opts": ["延伸 浮泛 敷衍了事", "升华 肤浅 走马观花", "深化 简单 人云亦云", "转化 消极 挂一漏万"], "ans": 2, "point": "选项呼应·自洽性", "solve": "第一空“思考是阅读的深化”；第二空“机械地、被动地、简单地”并列；第三空“没有思考，人云亦云”。注意 B 是陷阱：若选“肤浅地浏览→走马观花”，二者都有浅显之意，同义重复导致逻辑颠倒。", "key": "选项呼应：如果选 B，“肤浅地浏览→走马观花”，二者都有浅显的意思，导致这句话逻辑颠倒；正确答案 C 三项各自独立对应。", "traps": [{"o": 0, "why": "“延伸”是把阅读外延扩大，思考是向内“深化”不是延伸；“敷衍了事”是态度问题，与“没有思考”的认知问题层级错位。"}, {"o": 1, "why": "本题最强陷阱：若选 B，“肤浅地浏览”与“走马观花”都含“浅”义，同义重复使句子逻辑颠倒——命题人故意让 B 两个词自洽重复。"}, {"o": 3, "why": "“转化”与“思考”搭配不符；“挂一漏万”是列举不全遗漏很多，与“没有思考”的因果对应错位。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">量子理论描述了微观粒子的诸多反直觉行为，广义相对论描述了引力的本质，并做出许多____的预言，比如黑洞、引力波、引力透镜等。这两种理论在各自领域都运作得非常好，却无法以一种____的方式结合起来。因此，寻找能将这两种理论统一起来的量子引力理论，是物理学家最大的____之一。</div>", "opts": ["奇特 完美 目标", "著名 直观 难题", "大胆 简便 挑战", "神秘 合理 困惑"], "ans": 0, "point": "逻辑关联·反义对应", "solve": "第一空“黑洞、引力波、引力透镜”→奇特的预言；第二空“各自领域运作得非常好，却无法…结合”→完美（非常好→完美，反义递进）；第三空“寻找…是最大的目标”。", "key": "反义对应：“运作得非常好”→非常好=完美；“却无法以完美的方式结合”；反直觉→奇特预言。", "traps": [{"o": 1, "why": "“著名”可修饰预言，但“直观”与文首“反直觉行为”直接矛盾——理论描述的是反直觉内容，不可能直观结合。"}, {"o": 2, "why": "“大胆”可修饰预言，“简便”无法对应“运作得非常好却无法结合”的缺憾——缺的不是简便，是完美。"}, {"o": 3, "why": "“神秘”弱于“奇特”，“合理”无法体现“运作得好却无法结合”的悖论感；“困惑”是情绪词，缺少“目标”的行动指向。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">未成年人网络游戏防沉迷机制是否有效，不只取决于平台管控是否严格，也取决于是否存在其他____。对此，为绕开防沉迷机制而设计出来的种种方法，都应予以____清理和整治。对于落实未成年人保护责任，运营商唯有诚心正意而非____，才能真正完善未成年人网络游戏防沉迷机制。</div>", "opts": ["干扰 全面 口是心非", "短板 严厉 漫不经心", "盲区 彻底 虚张声势", "漏洞 系统 虚与委蛇"], "ans": 3, "point": "逻辑关联·反义对应", "solve": "第一空“绕开防沉迷机制的方法”→机制存在“漏洞”；第二空“清理和整治”→系统；第三空“诚心正意而非虚与委蛇”（反义并列：真心实意 vs 表面应付）。", "key": "①绕开防沉迷机制的种种方法→存在“漏洞”（不叫干扰）；②反义并列：诚心正意→虚与委蛇。", "traps": [{"o": 0, "why": "“干扰”是外部因素，而“绕开机制的方法”利用的是机制自身缺陷→漏洞，不叫干扰；“口是心非”是言行不一，与“诚心正意”的反义并列中“虚与委蛇”（表面敷衍）更贴切。"}, {"o": 1, "why": "“短板”是单点不足，绕开机制对应的是系统性缺陷；“漫不经心”是疏忽大意，与诚心正意的反义弱于虚与委蛇。"}, {"o": 2, "why": "“盲区”是看不见的领域，防沉迷机制知道问题却被“绕开”→漏洞；“虚张声势”是装腔作势，与诚心正意（真心）的反义错位——反义是敷衍应付。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">创造和享受艺术是区别人类与其他生物的重要标志之一。基于当下的限定条件，通过算法进行模仿是AI绘画的____。这些成品的构图、配色和细节可能极其____，在审美上与人类的经验高度一致。但从整个创作过程来看，并不能体现人类在艺术创作里的情感追求，与传统艺术创作理念也____。</div>", "opts": ["本质 妥帖 相去甚远", "核心 精致 大相径庭", "前提 丰富 背道而驰", "基础 高妙 水火不容"], "ans": 1, "point": "逻辑关联·反义对应", "solve": "第一空“通过算法进行模仿是AI绘画的核心”；第二空“构图配色细节极其精致”（AI 给人第一感觉就是过分精致）；第三空“与传统艺术创作理念大相径庭”（转折）。", "key": "转折会消失论：二空若选“妥帖”，作者就不会转折；日常逻辑：AI 给人第一感觉就是过分精致→核心+精致+大相径庭。", "traps": [{"o": 0, "why": "转折会消失论：若第二空选“妥帖”（妥当合适），作者就不会再转折批评了；“本质”过重，AI 绘画的本质未必是模仿。"}, {"o": 2, "why": "“前提”是必要条件，模仿是 AI 绘画的实现方式而非前提；“背道而驰”程度过重——两者理念不同不等于完全相反。"}, {"o": 3, "why": "“高妙”是褒义且程度过强，AI 绘画只是与人类经验“高度一致”谈不上高妙；“水火不容”程度过重。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">基层工作____，调研起来难免千头万绪。调查研究要从“小切口”入题，从民生实事选题定向。同时，调研要坚持“一根竿子插到底”，____直面“真问题”，克服认知盲区和思维局限，秉持更加开阔的视野，方能____基层“最后一公里”的症结。</div>", "opts": ["盘根错节 高屋建瓴 治理", "错综复杂 追根溯源 洞见", "包罗万象 抽丝剥茧 破解", "任重道远 实事求是 缓解"], "ans": 2, "point": "目的/结果/措施区分", "solve": "第一空“千头万绪”→包罗万象（事物复杂多样）；第二空“一根竿子插到底”→抽丝剥茧（都有深入）；第三空“直面真问题…方能…症结”→破解。", "key": "①“一根竿子插到底”→抽丝剥茧（都有深入）；②横线前已“直面真问题”，横线处体现目的→破解（不可能还是洞见）。", "traps": [{"o": 0, "why": "盘根错节形容关系复杂，与“千头万绪”的“头绪多”侧重不同；高屋建瓴是居高临下之势，与“一根竿子插到底”的深入意相反；“治理症结”搭配弱于“破解症结”。"}, {"o": 1, "why": "追根溯源是追究根源，与“直面真问题”的深入不匹配；第三空“洞见”是洞察，横线前已“直面真问题”，此处应表目的——破解，不可能还是“洞见”。"}, {"o": 3, "why": "任重道远侧重责任重路途远，与“千头万绪”的纷杂不对应；实事求是是态度词，与“一根竿子插到底”的深入比喻不匹配；“缓解”程度轻于“破解”。"}], "src": "2024国考·地市级（行政执法类）", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">传统的作业管理，有明确的管理主体、管理内容和管理手段，其弊端也显而易见——眼中有作业、有分数，但唯独没有人，没有学生。这样的作业管理，实质上是____：只重分数，轻视育人；只看结果，不看过程；只抓学业，忽略成长。</div>", "opts": ["缘木求鱼", "徒有其表", "本末倒置", "揠苗助长"], "ans": 2, "point": "标点/符号提示", "solve": "破折号引出弊端（眼中有作业、有分数，唯独没有人），冒号后的“只重分数，轻视育人；只看结果，不看过程；只抓学业，忽略成长”三组“只…不…”分号排比，直接解释横线=把分数与育人主次颠倒→“本末倒置”。标点定位：冒号后内容即横线释义。", "key": "标点定位：冒号=解释说明，横线后三个分号排比“只…不…”锁定“本末倒置”（颠倒了事物的轻重主次）。", "traps": [{"o": 0, "why": "缘木求鱼=方法不对必将劳而无功，文段不是“方法错”而是“主次颠倒”，语义不符。"}, {"o": 1, "why": "徒有其表=有名无实，文段强调轻重倒置而非空有其表。"}, {"o": 3, "why": "揠苗助长=违反规律急于求成，文段非“急”而是“搞反了”。"}], "src": "2023国考·行政执法类", "yr": 2023, "srcType": 2, "orig": "按2023国考原卷原文收录（副省级/行政执法类），答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险。可以说，人造血的发展将有效提升血液的____。当然，考虑到人造血液制造成本较高，血液来源以标准化生产流程采集为主。</div>", "opts": ["安全性", "可靠性", "规范性", "稳定性"], "ans": 0, "point": "语境对应·解释说明", "solve": "不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险”→强调“安全性”（无危险、不受威胁）。", "key": "解释说明直接对应：“降低输血相关传染病风险”→安全性。", "traps": [{"o": 1, "why": "可靠性=可以信赖依靠，仅凭“标准化生产流程”不足以确保人造血可被信赖，语义过重。"}, {"o": 2, "why": "规范性=符合标准，不能精准体现“无风险”之意。"}, {"o": 3, "why": "稳定性=稳固不变，与“降低传染病风险”的安全性无关。"}], "src": "2023国考·行政执法类", "yr": 2023, "srcType": 2, "orig": "按2023国考原卷原文收录（副省级/行政执法类），答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外，红树林大多分布在沉积型海岸河口，由上游河流和海洋潮汐共同作用带来大量外源性碳，这就形成了____的局面：红树林既“节流”了自身碳的释放，又“开源”了外源性碳的输入。</div>", "opts": ["标本兼治", "一举两得", "取长补短", "开源节流"], "ans": 3, "point": "标点/符号提示", "solve": "冒号后的“既‘节流’了自身碳的释放，又‘开源’了外源性碳的输入”是对横线“局面”的直接解释——两个分句用“既…又…”并列，分别对应“节流+开源”→横线为“开源节流”。标点定位：冒号后内容即横线释义。", "key": "标点定位：冒号=解释说明，“既…又…”并列结构对应“开源+节流”两词素。", "traps": [{"o": 0, "why": "标本兼治=查处问题与防止问题同时进行，语境中的两方面不是“标/本”关系。"}, {"o": 1, "why": "一举两得=做一件事得两方面好处，语境是红树林自身的两个特点，不是“做一件事”。"}, {"o": 2, "why": "取长补短=取他人之长补自己之短，语境没有“长短之别”。"}], "src": "2023国考·市地级（行政执法类）", "yr": 2023, "srcType": 2, "orig": "按2023国考原卷原文收录（副省级/行政执法类），答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">与其他全球导航系统相比，北斗导航系统在多个方面具有鲜明特色，可谓____。例如在短报文通信方面，北斗系统开创了通信导航一体化的独特服务模式，信息发送能力从一次120个汉字提升到一次1200个汉字，遇到特殊情况时无需____，足以将具体情况一次性说清楚。</div>", "opts": ["遥遥领先 删繁就简", "迎难而上 惜墨如金", "与众不同 言简意赅", "独树一帜 字斟句酌"], "ans": 3, "point": "实词辨析·语义侧重", "solve": "第一空“首创”“开创”提示开创性+与众不同→“独树一帜”（独创一格、自成一家）；第二空“从120个汉字提升到1200个汉字，无需…足以一次性说清楚”→无需“字斟句酌”（一字一句推敲）。", "key": "中心对应：“首创”“开创”→独树一帜（有开创性）；字数从120到1200→无需“字斟句酌”。", "traps": [{"o": 0, "why": "遥遥领先强调领先优势，未体现“首创/开创”的独创性；删繁就简是删掉繁杂留简要，语境是“字数充裕无需斟酌”，侧重不同。"}, {"o": 1, "why": "迎难而上=不惧困难，文段无困难语境；惜墨如金=惜字如金，与“字数充裕”语境相反。"}, {"o": 2, "why": "与众不同只能表示不一样，无法体现开创性；“言简意赅”是言语精炼，与“无需推敲哪个字”的语义不符。"}], "src": "2023国考·市地级（行政执法类）", "yr": 2023, "srcType": 2, "orig": "按2023国考原卷原文收录（副省级/行政执法类），答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">推动长江经济带发展，必须加快新旧动能转换。这既需要有破的勇气，敢于“____”，破除旧的落后产能；也要有立的智慧，善于“腾笼换鸟”，培养新的绿色产能。破除旧动能与培育新动能____、相辅相成。只有____破除无效产能，才能给新产业发展创造条件，增加有效供给。</div>", "opts": ["脱胎换骨 齐头并进 果断", "破釜沉舟 互为表里 直接", "另起炉灶 双管齐下 彻底", "壮士断腕 并行不悖 坚决"], "ans": 3, "point": "实词辨析·程度与范围", "solve": "第一空“破的勇气+破除旧的落后产能”→壮士断腕（牺牲局部保全整体）；第二空“破除旧动能与培育新动能…相辅相成”→并行不悖（可同时进行而不冲突）；第三空“只有…才能…创造条件”→坚决破除。", "key": "比喻还原：破除落后产能=为整体主动舍弃局部→壮士断腕；破与立相互支持不冲突→并行不悖；配“破的勇气”→坚决。", "traps": [{"o": 0, "why": "脱胎换骨=根本改变，未突出“为整体舍弃局部”的取舍结构；齐头并进=不分先后一起前进，弱于“并行不悖”的兼容义。"}, {"o": 1, "why": "破釜沉舟强调断绝退路，原文无“取消所有退路”设定；互为表里是内外相依，不是“互助不冲突”的关系；直接是路径词，不是态度词。"}, {"o": 2, "why": "另起炉灶=另建一套体系，而文段是“淘汰旧部分”；双管齐下=同时用两种手段，非“两项工作的关系”概括；彻底是完成程度，与“勇气”呼应弱于坚决。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "按2023国考原卷原文收录（副省级/行政执法类），答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">安装监控补光灯的目的在于更好地识别车辆信息，从而提高执法效率，存留违法车辆的有效证据。然而，交通执法的根本目的在于维护道路交通安全，如果执法手段本身对交通安全构成了隐患，甚至不幸导致事故，那么无疑是____。</div>", "opts": ["本末倒置", "得不偿失", "背道而驰", "因小失大"], "ans": 0, "point": "语境对应·解释说明", "solve": "根本目的在于维护道路交通安全”（本），而“执法手段本身构成隐患”（末）→主次颠倒→“本末倒置”。注意补光灯本身有识别车辆之功用，不是“完全没有作用”。", "key": "本末定位：“本”=根本目的（安全），“末”=执法手段（补光灯）——手段反噬目的→本末倒置。", "traps": [{"o": 1, "why": "得不偿失=所得抵不上所失。文段中的补光灯并无“所得”收益，产生的都是隐患，语义不符——命题人用“损失”字眼设陷。"}, {"o": 2, "why": "背道而驰=方向、目标完全相反。补光灯虽有隐患但仍有识别车辆之效，未到“完全相反”的程度，语义过重。"}, {"o": 3, "why": "因小失大=为小利失大利。文段未提及“大小利益”的取舍关系，是“根本目的”与“手段”的轻重颠倒。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">文创产品能否经受检验、笑到最后，关键在于是否蕴含了深厚的文化价值与审美价值。在专注其实用价值的同时，更要看到它们所承载的文化意涵，所具有的文化表达功能。如果对传统文化____，盲目引入商业化流程，反而会贬损传统文化的价值。</div>", "opts": ["敬而远之", "不求甚解", "不以为然", "浅尝辄止"], "ans": 1, "point": "实词辨析·语义侧重", "solve": "盲目引入商业化流程，反而会贬损”→对文化的“意涵、表达功能”不了解不深入→“不求甚解”（读书不深入，不认真领会）。", "key": "搭配与侧重：浅尝辄止须配动作性词语；对文化的“意涵”不了解→不求甚解。", "traps": [{"o": 0, "why": "敬而远之=尊敬却有所顾虑不愿接近，是态度上的回避，不是“不了解”，与“盲目引入”的因果关系不符。"}, {"o": 2, "why": "不以为然=不认为是对的，表示否定，语义完全不符——命题人用“然”字做近形干扰。"}, {"o": 3, "why": "浅尝辄止=略微尝试就停下来，一般用于“做某事”（如“研究传统文化浅尝辄止”），此处“对传统文化浅尝辄止”用法不成立，且侧重“停止”而非“不了解”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">思政课教师要有正确的党史观和过硬的党史知识，只有自己观点正确、史料丰富，才能准确无误地给学生指引方向、有力有理有据地反驳错误观点、____地选择恰当的教学方式，推动党史教育入脑入心、开花结果。</div>", "opts": ["信手拈来", "游刃有余", "轻而易举", "随心所欲"], "ans": 1, "point": "成语辨析·感情色彩", "solve": "观点正确、史料丰富→准确无误指引、有力有理有据反驳”→教师能力强、处理教学轻松自如→“游刃有余”（做事熟练、解决问题轻松利落，偏积极）。", "key": "主客区分：轻而易举说“事容易”，游刃有余说“人能力强”——主语是教师的能力→游刃有余。", "traps": [{"o": 0, "why": "信手拈来=随手拿来，多形容词汇、材料丰富不假思索写出文章，不修饰“选择教学方式”，搭配对象错位。"}, {"o": 2, "why": "轻而易举=事情容易做。文段强调的不是“事情本身容易”，而是“教师能力强”——命题人用“事情容易”偷换“能力高”。"}, {"o": 3, "why": "随心所欲=一切由着自己心意，倾向偏贬义，与“准确无误、有理有据”的严谨语境不符。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">解剖是认识动物体内形态特征的重要方式，但对于罕见或稀有物种而言，解剖无疑会破坏珍贵的样本，其损失____。近年来，无损检测已开始应用于文物鉴定等多种领域，____相关技术的应用经验，研发出一套专门针对珍稀动物样本无损检测的方法，必将大有可为。</div>", "opts": ["难以估量 拓展", "触目惊心 参考", "毋庸置疑 模仿", "不言而喻 借鉴"], "ans": 3, "point": "实词辨析·语义侧重", "solve": "第一空“解剖破坏珍贵样本，损失不言而喻”（不用说明也明白）；第二空“相关技术的应用经验→借鉴”（把别人经验当镜子对照自己）。", "key": "固定搭配：“借鉴经验”；“触目惊心”必须“看见”，抽象损失不适用。", "traps": [{"o": 0, "why": "“难以估量”搭配损失可，但第二空“拓展经验”搭配不当（拓展是在原有基础上增加新东西，经验是“借鉴”的）；且“不言而喻”更呼应“无疑”的确定语气。"}, {"o": 1, "why": "触目惊心=看见严重情况内心震惊。“损失”是抽象概念，无法“看见”，搭配不当——命题人用强烈动词诱导。"}, {"o": 2, "why": "“毋庸置疑”=不必怀疑（强调可信），与“损失大”语境不合；模仿的对象是“做法、行为”，不是“经验”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">如今，网络文艺评论受到大众欢迎，但在花样繁多的内容背后经常____着商业目的，无论是无端批评，还是一味吹捧，都会对观众造成误导，给影视创作带来伤害。互联网的普及让我们既为网络文艺评论生态的蓬勃生长感到惊喜，也为其____的状况感到忧虑。</div>", "opts": ["夹杂 乌烟瘴气", "潜藏 泥沙俱下", "渗透 鱼龙混杂", "裹挟 杂乱无章"], "ans": 1, "point": "实词辨析·语义侧重", "solve": "第一空“内容背后”→商业目的“潜藏”（隐藏在显露的外表之下，具隐蔽性）；第二空“无端批评、一味吹捧并存”→泥沙俱下（好坏混杂）。", "key": "关键词“背后”→潜藏（隐藏）；泥沙俱下=好坏混杂，呼应“无端批评与一味吹捧并存”。", "traps": [{"o": 0, "why": "夹杂=混杂其中，没有“隐蔽”义，与“背后”呼应弱；乌烟瘴气形容环境污浊嘈杂，偏口语且程度重。"}, {"o": 2, "why": "渗透=逐渐进入，与“背后经常”搭配不自然；鱼龙混杂多形容人（好人和坏人混在一起），形容“状况”搭配弱。"}, {"o": 3, "why": "裹挟=被潮流卷着走，主语多为人或被裹挟的群体，商业目的是“藏”在背后而非“裹挟”内容。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">基层是国家治理体系的末梢，但这末梢并非____的边角毫末，而是治理现代化总体方略的关键词，也是人民群众日常生活获得感的中转站。基层治理要满足群众的殷切期望，因此，需要____重心下移的治理体系，增添治理资源、激发治理活力，如此基层才能“发声呐喊”。</div>", "opts": ["无足轻重 构建", "可有可无 规范", "默默无闻 打造", "微乎其微 补充"], "ans": 0, "point": "实词辨析·语义侧重", "solve": "第一空与“关键词”反义对应→“无足轻重”（无关紧要）；第二空与“增添、激发”构成排比（都表增加、建立）→“构建”。", "key": "反义+排比：“关键词”↔无足轻重；“构建、增添、激发”同为“增加建立”义。", "traps": [{"o": 1, "why": "可有可无=有没有都无关紧要，与“无足轻重”近义可留，但第二空“规范”没有“增加”义，与“增添、激发”排比不成立。"}, {"o": 2, "why": "默默无闻=没有名气不为人知，是“无名”而非“不重要”，与“关键词”的反义错位。"}, {"o": 3, "why": "微乎其微侧重“少/小”，不是“不重要”；“补充”是锦上添花，弱于“构建”的从无到有。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">在宇宙过去130多亿年里，暗物质扮演了十分重要的角色。由于在物质的质量比例上占据____地位，暗物质决定了宇宙物质在大尺度上的分布——宇宙大尺度结构。现代超级计算机模拟更是向我们揭示，宇宙中暗物质的空间分布可以再现观测到的星系分布，暗示了星系和暗物质之间的关系____。</div>", "opts": ["关键 盘根错节", "核心 唇齿相依", "主导 千丝万缕", "优势 如影随形"], "ans": 2, "point": "实词辨析·搭配对象", "solve": "第一空“在质量比例上占据主导地位”（“比例”只能搭配主导/优势，不搭关键/核心）；第二空“星系和暗物质关系密切”→千丝万缕（关系十分密切）。", "key": "搭配对象：“占据…比例地位”→主导；“关系…”→千丝万缕。", "traps": [{"o": 0, "why": "“关键/核心”不能搭配“比例”（占比只能用主导/优势表达）；盘根错节侧重关系复杂纠缠，与“决定分布”的单方主导不符。"}, {"o": 1, "why": "唇齿相依=互相依存、缺一不可。文中暗物质“决定”分布，是单方主导而非互相依存。"}, {"o": 3, "why": "如影随形形容可见的形影相随；星系与暗物质数量众多、有直接间接联系，用“千丝万缕”更贴切。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">人体肠道内生物的多样性令人惊讶，除细菌外，还____着数十万种被称为噬菌体的病毒，这些噬菌体可以感染细菌。众所周知，肠道微生物组不平衡会引发各种疾病，如炎症性肠病、过敏和肥胖，但我们对肠道细菌及噬菌体在人类健康和疾病方面起何种作用却____。</div>", "opts": ["潜伏 知之甚少", "分布 浑然不觉", "活跃 束手无策", "充斥 一知半解"], "ans": 0, "point": "实词辨析·语义侧重", "solve": "第一空“除细菌外还…着数十万种病毒”（长期未被关注、隐藏其中）→“潜伏”；第二空“对…起何种作用却知之甚少”（知道得很少）。", "key": "“除细菌外还…着”→隐藏其中→潜伏；“对…作用却…”→知之甚少。", "traps": [{"o": 1, "why": "分布是中性词，无“隐蔽”义；浑然不觉=完全没有察觉，主语应是人（我们浑然不觉），与“对…作用”的搭配不当。"}, {"o": 2, "why": "活跃=积极活动，病毒未被关注谈不上“活跃”；束手无策=毫无办法，是“没办法应对”，与“不了解”不同。"}, {"o": 3, "why": "充斥=塞满，含贬义且程度重；一知半解=知道得不全面，主语应是人，与“对作用”搭配弱于“知之甚少”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">近400年来，人类在探索宇宙方面取得了长足的进步。我们知道了地球上再壮观的烟火表演与超新星爆发相比，都____；一颗方糖大小的中子星就有数亿吨重；宇宙中充满着____的物质，包括难以捉摸的黑洞、暗物质、引力波等。</div>", "opts": ["相形见绌 林林总总", "不值一提 莫名其妙", "大相径庭 千奇百怪", "黯然失色 不可思议"], "ans": 3, "point": "成语辨析·感情色彩", "solve": "第一空“再壮观的烟火表演与超新星爆发相比”→比不上→“黯然失色”（相比之下暗淡无光）；第二空“难以捉摸的黑洞、暗物质”→不可思议（无法想象难以理解）。", "key": "感情色彩+对应：“再壮观也…”→黯然失色；“难以捉摸”→不可思议。", "traps": [{"o": 0, "why": "相形见绌也可表比不上，但第二空“林林总总”=事物繁多，与“难以捉摸”的“难理解”不对应。"}, {"o": 1, "why": "不值一提=没有价值，烟火表演本身有价值，只是比不上超新星；“莫名其妙”侧重奇怪且偏消极，与“难以捉摸”的程度不符。"}, {"o": 2, "why": "大相径庭=差别很大，未体现“比不上”的比较关系；千奇百怪侧重奇异多样，非“难以理解”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">透光摄影、多光谱成像、三维病害模型……这些听起来更像是医疗或化工业的技术，如今在文物修复圈成为____的“神器”。正是这些现代科技手段对文物的“问诊”与“体检”，弥补了用肉眼无法看到、用手无法摸到“病情”的缺陷，从而使修复人员可以“____”。</div>", "opts": ["举足轻重 有的放矢", "必不可少 对症下药", "崭露头角 药到病除", "交口称赞 妙手回春"], "ans": 1, "point": "比喻/修辞对应", "solve": "第一空“弥补了用肉眼无法看到的缺陷”→必不可少；第二空“问诊、体检、病情”的医学比喻链条→对症下药（针对实际情况采取措施）。", "key": "比喻链条贯通：“问诊、体检、病情”→对症下药；医学比喻要全程对应。", "traps": [{"o": 0, "why": "举足轻重=地位重要（多用于地位、影响），形容“神器”用“必不可少”更贴；有的放矢=目标明确，与“病情”的医学比喻不如对症下药贯通。"}, {"o": 2, "why": "崭露头角=初露锋芒，技术已“成为神器”非“初露”；药到病除=疗效神速，修复文物不是“治病”，比喻错位。"}, {"o": 3, "why": "交口称赞=众人异口同声称赞，是“评价”不是“属性”；妙手回春=医术高明，对象是“医生”而非“方法”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">太阳能、风能是产生电力的主要可再生能源，但都具有随机性、____、波动性等特点。太阳能光板在晴天、白天时能发电，阴天、夜晚时就“罢工”了，风能发电也跟风力和天气息息相关。因此，目前迫切需要大规模储能装置，将富余的电能储存起来，在发电不足的时间用，以保证电力的____供给。</div>", "opts": ["地域性 持续", "阶段性 弹性", "间歇性 平稳", "周期性 高效"], "ans": 2, "point": "实词辨析·语义侧重", "solve": "第一空“晴天白天能发、阴天夜晚罢工”→间歇性（时断时续）；第二空“储能装置把富余电能储存起来在不足时用”→保证“平稳”供给。", "key": "“阴天夜晚罢工”→间歇性；储能→削峰填谷→平稳供给。", "traps": [{"o": 0, "why": "地域性对应“地点”，文段是时间上的时有时无；“持续供给”与储能目的矛盾——储能正是为应对间歇。"}, {"o": 1, "why": "阶段性=按较长周期分阶段，阴晴变化是短周期“间歇”，非“阶段”；弹性供给≠平稳。"}, {"o": 3, "why": "周期性=有规律地循环，晴阴变化不规律；“高效”不是储能的核心目的（核心是削峰填谷保平稳）。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">实施传统胸外按压心肺复苏，常会发生肋骨或胸骨骨折，导致肺、胸膜及心脏损伤，影响心肺复苏的成功率。急救专家由此探索出“胸路不通走腹路”的新途径，腹部提压心肺复苏技术____。与传统心肺复苏技术相比，该技术____，利用腹部提压心肺复苏仪达到起腹心动、起腹呼吸的目的。</div>", "opts": ["异军突起 推陈出新", "横空出世 一举两得", "应运而生 另辟蹊径", "粉墨登场 扬长避短"], "ans": 2, "point": "逻辑关联·因果关系", "solve": "第一空“由此探索出…新途径”→应运而生（顺应时机需要而产生）；第二空“胸路不通走腹路”→另辟蹊径（另开辟一条新路）。", "key": "“由此探索出”=因需而生→应运而生；“胸路不通走腹路”=另辟蹊径。", "traps": [{"o": 0, "why": "异军突起=新生力量突然崛起，技术是“因需而生”不是“突然崛起”；推陈出新=去掉旧的创造新的，新途径不是从旧技术推出的。"}, {"o": 1, "why": "横空出世=突然出现，无“因需要而产生”的因果义；一举两得=做一件事得两方面好处，文段是“换路径”而非“一箭双雕”。"}, {"o": 3, "why": "粉墨登场=贬义（坏人登台），与技术的正面语境不符；扬长避短=发挥长处回避短处，与“换路径”不同。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">商标是产品跨入市场的敲门砖，在行业竞争激烈的市场上，市场主体为了在竞争者中____，往往倾向于选择能够彰显个性、标新立异的标识作为商标。然而，如果一味追求个性、博公众眼球，效果可能____。一旦触碰公共秩序和良善风俗底线，就会遭遇商标注册申请被驳回的尴尬境遇。</div>", "opts": ["一马当先 大打折扣", "一鸣惊人 事与愿违", "拔得头筹 过犹不及", "独树一帜 适得其反"], "ans": 3, "point": "逻辑关联·反义对应", "solve": "第一空“彰显个性、标新立异”→独树一帜（独创一格、自成一家）；第二空“然而…一味追求个性…效果可能适得其反”（恰恰得到与愿望相反的结果）。", "key": "转折对照：“追求个性博眼球”→“效果适得其反”（结果与初衷相反）；“标新立异”→独树一帜。", "traps": [{"o": 0, "why": "一马当先=工作走在前面积极带头，不体现“标新立异”；大打折扣=降低程度，与“追求个性反而坏结果”的转折不对应。"}, {"o": 1, "why": "一鸣惊人=平时默默无闻突然做出惊人成绩，与“在竞争者中突出”不同；事与愿违近义可留，但第一空已错。"}, {"o": 2, "why": "拔得头筹=取得第一名，无“独特个性”义；过犹不及=做过头如同不够，未体现“结果与愿望相反”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">当前，我国发展面临着前所未有的风险挑战，既有国内的也有国际的，既有政治、经济、文化、社会等领域的也有来自自然界的，既有传统的也有非传统的，“黑天鹅”“灰犀牛”还会____。要更好应对前进道路上各种可以预见和难以预见的风险挑战，我们必须从历史中获得启迪，从历史经验中提炼出____的法宝。</div>", "opts": ["不期而至 克敌制胜", "有机可乘 战无不克", "纷至沓来 所向披靡", "不请自来 攻坚克难"], "ans": 0, "point": "成语辨析·感情色彩", "solve": "第一空“黑天鹅、灰犀牛”（难以预见的风险意外到来）→不期而至（没有约定而意外到来）；第二空“提炼出…的法宝”→克敌制胜（战胜敌人，与“法宝”固定搭配）。", "key": "“难以预见的风险”→不期而至；“克敌制胜的法宝”固定搭配。", "traps": [{"o": 1, "why": "有机可乘=有空子可钻，贬义（风险不是主动钻空子）；战无不克=每战必胜，与“提炼法宝”搭配不当。"}, {"o": 2, "why": "纷至沓来=连续不断到来，侧重“多”且常搭配人群游客；黑天鹅灰犀牛是单个事件而非“多”；所向披靡=所向无敌。"}, {"o": 3, "why": "不请自来=不速之客，偏指人且无法对应“难以预见”；攻坚克难=克服困难，与“法宝”搭配弱于克敌制胜。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">当下，传播媒介的____为文化传播不断创造新符号。其中，短视频平台跨越专业内容生产门槛，____海量用户，进行日常生活的自我呈现，体现了传播的视觉转向和影像化特点。而虚拟现实、增强现实、混合现实则在视觉、听觉、触觉等多模态符号中____人类感官，建构受众的认知和体验。</div>", "opts": ["创新 吸引 挑战", "更迭 聚集 延伸", "涌现 引导 丰富", "升级 融合 重塑"], "ans": 1, "point": "实词辨析·搭配对象", "solve": "第一空“传播媒介的更迭”（更新换代）；第二空“平台跨越门槛、聚集海量用户”；第三空“多模态符号中延伸人类感官”。", "key": "搭配链条：媒介→更迭；平台→聚集用户；多模态符号→延伸感官。", "traps": [{"o": 0, "why": "“创新”创造符号可，但“吸引海量用户”是单向吸引，平台是“聚集”聚合用户；“挑战感官”搭配不当。"}, {"o": 2, "why": "涌现=大量出现，主语应是事物而非“媒介的…”，媒介用“更迭”更准；丰富感官可，但前两空已错。"}, {"o": 3, "why": "“升级”搭配媒介可，但“融合”弱于“聚集”的聚合义；“重塑感官”程度过重，感官是“延伸”而非重塑。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">早期的电影多是全景式的“纪录视角”，这是由于摄影机无法移动，只能____传统戏剧我演你看的观演关系。随着各种摄影新技术和剪辑新手法的出现，电影依靠独特的镜头语言，逐渐脱离戏剧的束缚，____。完全依据戏剧思维，使用单一固定的场景所打造的电影虽有佳作，但____。</div>", "opts": ["照搬 自立门户 屈指可数", "保持 另起炉灶 凤毛麟角", "沿袭 独当一面 差强人意", "复制 革故鼎新 寥寥无几"], "ans": 0, "point": "成语辨析·语义轻重", "solve": "第一空“摄影机无法移动，只能照搬传统戏剧观演关系”（被动沿用现成方式）；第二空“逐渐脱离戏剧束缚→自立门户”（离开原有集体自成一派）；第三空“虽有佳作，但屈指可数”（数量很少，中性）。", "key": "语义轻重+感情色彩：“虽有佳作，但屈指可数”（中性表少）优于“凤毛麟角”（褒义珍贵）。", "traps": [{"o": 1, "why": "“保持”=维持原状，早期电影是“照搬”现成模式而非主动“保持”；另起炉灶=抛开原有体系另立，电影是“逐渐脱离”而非彻底另立；凤毛麟角=珍贵稀少，含褒义，与“虽有佳作但少”的客观贬损语境不符。"}, {"o": 2, "why": "沿袭=沿旧例行事（可），但“独当一面”=单独担当一方面任务，与“脱离束缚”的独立不是一回事；差强人意=大体上令人满意，与“佳作少”不符。"}, {"o": 3, "why": "复制可，但“革故鼎新”=去掉旧的建立新的，侧重完全抛弃旧体系，电影是“逐渐脱离”；寥寥无几=非常稀少（可），但前两空错。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">如果历史观错误，不仅达不到学习教育的目的，反倒会____、走入误区。现在，一些错误倾向要引起警惕：有的____党史上的失误和曲折，肆意抹黑歪曲党的历史、攻击党的领导；有的将党史事件同现实问题刻意勾连、恶意炒作；有的不信正史信野史，将党史庸俗化、娱乐化，热衷传播八卦轶闻，对非法境外出版物____。</div>", "opts": ["轻重倒置 渲染 青睐有加", "南辕北辙 夸大 津津乐道", "缘木求鱼 聚焦 趋之若鹜", "断章取义 曲解 如数家珍"], "ans": 1, "point": "逻辑关联·递进关系", "solve": "第一空“不仅达不到目的，反倒会…”（反向递进）→南辕北辙（行动与目的相反）；第二空“肆意抹黑歪曲”并列→夸大；第三空“热衷传播八卦轶闻”→津津乐道（很有兴味地谈论）。", "key": "“不仅…反倒会”反向递进→南辕北辙（不仅没达到还走上相反道路）；“热衷传播”→津津乐道。", "traps": [{"o": 0, "why": "轻重倒置=把重要的与不重要的弄颠倒了，文段未提及孰轻孰重；“渲染”与“肆意抹黑”并列时力度弱于“夸大”；青睐有加偏正面。"}, {"o": 2, "why": "缘木求鱼=方法方向不对必无收获，与前文“达不到目的”语意重复，构不成“反倒会”的递进；聚焦=中性，无“夸大”义；趋之若鹜=争相追逐（贬义但侧重追从，与“谈论”不同）。"}, {"o": 3, "why": "断章取义=孤立截取片段，是错误“手段”而非“走入误区”的结果；“曲解”可并列但第一空错；如数家珍=非常熟悉（褒义）。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">病毒变异每时每刻都在发生，随机性极大，突变率高、变异速度快，这意味着它们更有机会形成适应环境的____。然而，并非每种变异都能让病毒存活并发展下去。同一时期，病毒的变异株可能有很多种，但“____”，只有那些能更有效____免疫系统侦测且传播能力强的毒株才能最终成为优势株。</div>", "opts": ["特质 优胜劣汰 突破", "机能 胜者为王 迷惑", "性状 适者生存 躲避", "表征 此消彼长 逃脱"], "ans": 2, "point": "逻辑关联·条件关系", "solve": "第一空“形成适应环境的性状”（形态特征）；第二空“只有…能存活发展”→适者生存；第三空“更有效躲避免疫系统侦测”。", "key": "“只有…才”条件句→适者生存；“免疫系统侦测”→躲避。", "traps": [{"o": 0, "why": "“形成特质”搭配不当（特质是固有属性，性状更准确）；优胜劣汰同时强调失败方被淘汰，文段只强调胜利株存活；突破搭配“侦测技术”而非“侦测”。"}, {"o": 1, "why": "“形成机能”搭配弱；胜者为王侧重胜负权势，非“适应环境”；迷惑与“侦测”搭配不当。"}, {"o": 3, "why": "表征=表面现象，词义过窄（变异涉及内在性状）；此消彼长=一方升一方降，侧重两主体升降；逃脱程度轻于“躲避侦测”。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">对武器装备来说，没有永远的“明星”，只有彼此的“克星”。站在对手的角度，选准新装备的“克星”，才能让我们进一步____，抢在对手之前探寻更先进武器装备的制胜机理，打造出____未来战场的坚甲利器。从这个意义上说，一个强劲的对手，既是改进武器的“____”，也是研发武器的“催化剂”。</div>", "opts": ["知己知彼 适应 磨刀石", "攻其不备 颠覆 指向标", "以逸待劳 引领 助推器", "战无不胜 胜任 源动力"], "ans": 0, "point": "语境对应·关键词定位", "solve": "第一空“站在对手的角度，选准克星”→知己知彼（对敌我双方了解透彻）；第二空“打造出适应未来战场的坚甲利器”；第三空“强劲的对手既是改进武器的磨刀石，也是催化剂”（比喻并列）。", "key": "“站在对手的角度”→知己知彼；“既是改进武器的磨刀石，也是研发武器的催化剂”（比喻并列照应）。", "traps": [{"o": 1, "why": "攻其不备=趁对方无防备时进攻，文段无“进攻”意且未提防备；“颠覆”与“未来战场”搭配不当；指向标=指导方向，与“改进武器的磨砺作用”不同。"}, {"o": 2, "why": "以逸待劳=采取守势养精蓄锐待敌疲惫，文段无守势语境；“引领”与“打造坚甲利器”搭配弱；助推器=推动促进（与催化剂近义，但前两空错）。"}, {"o": 3, "why": "战无不胜=每战必胜，程度过重（尚在制造武器阶段未开战）；胜任=能力足以担任，与“未来战场”搭配不当；源动力=动力来源。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">近年来出现的《我在故宫修文物》等以国宝为题材的纪录片，提供了认识历史的新____。这些纪录片以具体的文物为线索，又不____于文物，而是描绘物品所处时代的精神世界，以此引导当代观众与传统文化发生碰撞，引导情感参与，开拓历史视野。这些节目如同荧屏上的博物馆，让观众____。</div>", "opts": ["方向 受制 大开眼界", "视角 拘泥 流连忘返", "境界 局限 身临其境", "途径 止步 叹为观止"], "ans": 1, "point": "实词辨析·搭配对象", "solve": "第一空“认识历史的新视角”（观察角度）；第二空“又不拘泥于文物，而是描绘精神世界”（反向并列：不只局限于文物）；第三空“如同荧屏上的博物馆→流连忘返”（留恋不愿离开）。", "key": "反向并列“不是…而是”→不拘泥于文物；“荧屏上的博物馆”喻体→流连忘返。", "traps": [{"o": 0, "why": "方向=道路（人们认识历史的方向并未改变，变的是角度）；受制=受控制（纪录片谈不上受文物控制）；大开眼界=开阔视野，与“认识历史的新…”搭配弱于“视角”。"}, {"o": 2, "why": "境界=达到的程度，与“提供”搭配不当；局限=限制在一定范围（“不局限”可），但第一空已错；身临其境=亲临其境，观众是“参观”荧屏博物馆，不是“身临”其中。"}, {"o": 3, "why": "途径=门路、道路，未体现“新角度”；止步=停止（“不止步于文物”暗示继续向前发展，语境未提）；叹为观止=赞叹精妙至极，程度过重。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">发展扶贫产业不能眉毛胡子一把抓，必须立足当地自然禀赋，挖掘地方特色资源，按照“宜种则种、宜养则养”的原则，注重发展山地农业、生态农业、观光农业等特色农业，学会“靠山吃山唱山歌，靠海吃海念海经”，谨防产业“____”。应该看到，适合的才是最好的。</div>", "opts": ["急功近利", "水土不服", "削足适履", "千篇一律"], "ans": 1, "point": "语境对应·解释说明", "solve": "适合的才是最好的”是对横线的解释说明——产业要“适合”当地水土，谨防“水土不服”（不适应本地的水土气候环境）。", "key": "解释说明定位：“适合的才是最好的”→产业不适应本地→水土不服。", "traps": [{"o": 0, "why": "急功近利=急于求成贪图眼前利益，是“做法”层面，与“适不适合”的结果层面无关。"}, {"o": 2, "why": "削足适履=不合理地迁就现成条件，是主体“主动将就”的错误做法；而文中是被动“不适应”的结果——命题人用“适应”话题近义设陷。"}, {"o": 3, "why": "千篇一律=文章公式化无变化，侧重“雷同”，而“靠山吃山靠海吃海”的语境强调的是“适应本地”而非“不雷同”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">“人民城市人民建”。搭建民意“直通车”、公众“议事厅”，有事好商量，大家来出力，很多工作就能做到____。比如上海能在短短一年内迅速形成垃圾分类的新风尚，靠的就是人民群众的主动性、积极性与创造性。</div>", "opts": ["立竿见影", "事半功倍", "万无一失", "尽善尽美"], "ans": 1, "point": "语境对应·解释说明", "solve": "大家来出力，靠的就是人民群众的主动性”+“短短一年内迅速形成”→投入少而收效大→“事半功倍”。", "key": "对应“大家来出力”→费小力收大效→事半功倍（出力少、效果好）。", "traps": [{"o": 0, "why": "立竿见影=立刻见效。文中虽有“短短一年”，但“大家来出力”强调的是费力小收效大，不是单纯的“见效快”。"}, {"o": 2, "why": "万无一失=绝对不会出差错，绝对化表述，与“很多工作就能做到”的成效语境不符。"}, {"o": 3, "why": "尽善尽美=完美无缺，绝对化且与“出力少成效大”的核心不对应。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">在芯片、操作系统等很多方面，我们需要下定决心，攻坚克难，自力更生。因为一旦核心技术受制于人，就有被“____”的威胁。所以，我们要有“宝剑锋从磨砺出，梅花香自苦寒来”的定力，逐渐形成一批拥有自主知识产权的核心技术和产业，把发展的主动权牢牢掌握在自己手中。</div>", "opts": ["过河拆桥", "落井下石", "一网打尽", "釜底抽薪"], "ans": 3, "point": "成语辨析·本义区分", "solve": "核心技术是发展的“根本”，受制于人=随时可能被从根上断绝→“釜底抽薪”（抽去锅底柴火，比喻从根本上解决问题）。", "key": "本义还原：釜底抽薪=抽掉锅底柴火（断绝根本）——核心技术是根本，被断供即釜底抽薪。", "traps": [{"o": 0, "why": "过河拆桥=达到目的后把帮助自己的人踢开，含忘恩负义义，与“核心技术”语境无关——用“拆/断”字面设陷。"}, {"o": 1, "why": "落井下石=趁人危难加以陷害，属人际攻讦，不适用于产业技术语境。"}, {"o": 2, "why": "一网打尽=全部捕获无一漏网，核心技术是“被断绝来源”而非“被捕获”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">中国道路的成功开创不仅创造了中国奇迹，而且创造了中国经验。中国经验无疑是中国智慧的结晶，具有鲜明的____。但是，中国经验作为中国道路的积极成果，也是在遵循历史发展和现代化发展规律、吸收世界发展经验教训的基础上形成的，它是对人类文明发展进行探索的重要产物，反映了人类文明进步的规律，因而又具有一定的____。</div>", "opts": ["地域性 国际性", "实践性 理论性", "特殊性 普遍性", "先进性 创新性"], "ans": 2, "point": "逻辑关联·反义对应", "solve": "第一空“中国智慧的结晶”→特殊性；第二空“但是…遵循规律、吸收世界经验…反映人类文明进步的规律”→普遍性。转折+因果链（但是…因而…）。", "key": "转折逻辑链：“中国智慧结晶”→特殊；转折后“遵循普遍规律”→普遍——特殊性与普遍性是一对标准逻辑对照。", "traps": [{"o": 0, "why": "地域性只讲空间范围，而“中国智慧的结晶”强调的是“独有、与他国不同”；国际性与“反映普遍规律”不能精确对应（规律是“普遍性”不是“国际性”）。"}, {"o": 1, "why": "实践性可对应“中国实践”，但第二空“理论性”是抽象概括，而文段强调“反映人类文明进步的规律”→普遍性。"}, {"o": 3, "why": "先进性、创新性都无“转折+因而”的逻辑支撑——第一空要有“独特”义，第二空要有“共通”义，只有“特殊/普遍”成对。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">“为调研而调研”等现象的出现，很大程度上就在于调研不深入、不具体。现实中，有人了解情况习惯于大而化之、____；有人调研习惯于走设计路线，____。这些心中不揣问题、脚下不沾泥土的错误做法，导致调研不深、不实、不细、不准，最终也会无效。</div>", "opts": ["粗枝大叶 按部就班", "走马观花 表里不一", "轻描淡写 循规蹈矩", "避重就轻 按图索骥"], "ans": 0, "point": "逻辑关联·并列对应", "solve": "第一空与“大而化之”（做事不细致）并列→粗枝大叶；第二空“走设计路线”（照既定流程走）→按部就班。", "key": "并列对应：顿号并列要同义场——大而化之（粗）↔粗枝大叶；“走设计路线”↔按部就班。", "traps": [{"o": 1, "why": "走马观花与“大而化之”近义可留，但“表里不一”与“走设计路线”不对应——走设计路线是机械照流程，不是表里不一。"}, {"o": 2, "why": "轻描淡写侧重“说得轻描淡写”，与“了解情况不细致”的并列对应不准；循规蹈矩偏中性褒义，无法体现对“走设计路线”的批评。"}, {"o": 3, "why": "避重就轻=避开重要谈次要，与“大而化之”的并列不对应；按图索骥虽近“机械照搬”，但第一空已错。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">探索和形成一个好的制度不容易，关键是毫不动摇地坚持和巩固、与时俱进地完善和发展、____地遵守和执行。这要求我们要把制度像种子一样种在头脑里，如红线一般____于工作中。这样才能推动中国特色社会主义制度更加成熟、更加定型，将制度优势转化为强大的治理效能，通达“中国之治”的新天地。</div>", "opts": ["坚定不移 渗透", "一丝不苟 应用", "不折不扣 贯穿", "矢志不渝 根植"], "ans": 2, "point": "逻辑关联·并列对应", "solve": "第一空与“毫不动摇地坚持、与时俱进地完善”排比→不折不扣（完全彻底）；第二空“如红线一般…于工作中”→贯穿（从始至终穿过）。", "key": "排比结构：坚持、完善、遵守执行三动作并列→“不折不扣”；比喻“红线”→贯穿。", "traps": [{"o": 0, "why": "坚定不移与“毫不动摇”语义重复（同义堆叠），排比不成立；渗透是逐渐渗入，红线是“贯穿”而非“渗透”。"}, {"o": 1, "why": "一丝不苟=认真细致，与“坚持、完善”的动作排比不对应；应用=使用，红线“应用”搭配不当。"}, {"o": 3, "why": "矢志不渝=志向坚定不改变，侧重“志向”而非“执行”；根植=扎根（比喻义可），但“红线根植于工作中”不如“贯穿”符合红线意象。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">一根网线、一部手机，把偏远的贫困地区链接进了广阔的大市场。电商扶贫，不是____地把农产品搬到网上，更是在深层次地倒逼农业产业转型升级，进而扩展到其他相关领域，创建出中国式扶贫的新____。</div>", "opts": ["简单 范本", "盲目 方向", "机械 蓝图", "被动 模式"], "ans": 0, "point": "逻辑关联·递进关系", "solve": "第一空“不是简单地把农产品搬到网上，更是深层次地倒逼转型”→“简单”与“深层次”递进对比；第二空“创建出中国式扶贫的新范本”。", "key": "递进对仗：“不是简单…更是深层次…”→简单（表层动作）与深层次（深层变革）对照；“创建…范本”固定搭配。", "traps": [{"o": 1, "why": "“盲目”=无目的乱来，与后文“深层次倒逼”的递进关系不成立（不是盲目与否的问题）；创建“方向”搭配不当。"}, {"o": 2, "why": "机械=死板照搬，第一空近义可留，但官方“简单”与“深层次”对仗最工整；创建“蓝图”搭配弱于“范本”。"}, {"o": 3, "why": "被动=不主动，第一空勉强；创建“模式”可，但“中国式扶贫的新模式”与“范本”（供参照学习的榜样）相比，“范本”更能体现可复制推广的示范性。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">在实际应用中，专网通常服务于政府、军队、公安、能源、消防、轨道交通等部门或领域，大部分情况下被用来进行应急通信、调度指挥。性能可靠、低成本、定制化的特点，使其在行业应用中具备____的优势。即便5G时代呼啸而来，专网依旧能够找到____。</div>", "opts": ["独具一格 立足之地", "众所周知 一席之地", "不可替代 用武之地", "显而易见 立锥之地"], "ans": 2, "point": "实词辨析·语义侧重", "solve": "第一空“性能可靠、低成本、定制化”→不可替代（无法被取代）；第二空“即便5G时代呼啸而来，专网依旧能够找到用武之地”（发挥作用的地方）。", "key": "语义侧重：可靠+低成本+定制化→“不可替代”的优势；专网继续“有用武之地”（发挥作用）而非“容身”。", "traps": [{"o": 0, "why": "独具一格=风格独特，形容“风格”而非“优势”；立足之地=容身之地，专网不是“容身”而是“发挥作用”。"}, {"o": 1, "why": "众所周知=大家都知道，与“优势”搭配不通（优势是“具备”的不是“众所周知”的）；一席之地=一个席位，偏“占有一席”的被动性。"}, {"o": 3, "why": "显而易见=明显，与“优势”搭配弱于“不可替代”（可靠性+低成本+定制化构成的是“无法替代”）；立锥之地=极小的地方，与专网的行业地位不符。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">信息匮乏的年代，决策水平与信息量成正相关，但当信息从匮乏走向过载甚至爆炸时，决策质量与信息量间的函数曲线便开始下滑，利用繁杂信息形成____判断变得难上加难，此时，智能化就可以大显身手。计算智能未必能在逻辑能力上逾越人类，但其强大的处理速度却恰好使信息过载带来的决策困境____。</div>", "opts": ["理性 烟消云散", "准确 迎刃而解", "科学 不复存在", "有效 无影无踪"], "ans": 1, "point": "实词辨析·语义侧重", "solve": "第一空“利用繁杂信息形成准确判断”；第二空“强大的处理速度使决策困境迎刃而解”（主要问题得到解决）。", "key": "程度把握：处理速度解决“决策困境”→迎刃而解；干扰项“消失/不复存在”绝对化过重。", "traps": [{"o": 0, "why": "理性可对应“判断”，但“烟消云散”=事物消失，困境是“被解决”不是“消失”，且绝对化。"}, {"o": 2, "why": "科学可对应，但“不复存在”绝对化——智能化只是辅助，决策困境不会完全消失。"}, {"o": 3, "why": "有效可对应，“无影无踪”=完全不见，绝对化且夸张。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">一些国家在实现自身现代化过程中选错了参照系，将发达国家有什么、做什么作为实现自身现代化的____，导致在向市场经济转型过程中经济停滞、崩溃、危机不断。而中国能够根据自己的要素禀赋条件，发挥政府在市场经济中的作用，把自己能做好的产业做大做强，将比较优势变成竞争优势，从而推动经济长期稳定快速发展。</div>", "opts": ["目标 因势利导", "原则 总揽全局", "模本 穿针引线", "途径 保驾护航"], "ans": 0, "point": "实词辨析·语义侧重", "solve": "第一空“选错了参照系，将发达国家有什么做什么作为…目标”→目标（想要达到的境地或标准，照应“参照系”）；第二空“根据自己的要素禀赋条件”→因势利导（顺着事物发展趋势加以引导）。", "key": "对应定位：第一空照应“参照系”→目标（参照的目标）；第二空照应“要素禀赋条件”→因势利导。", "traps": [{"o": 1, "why": "发达国家“有什么、做什么”不是行事“原则”；总揽全局=统揽整体，政府在市场经济中是“顺势引导”而非“总揽”。"}, {"o": 2, "why": "模本=供临摹的底本，表面近义（把发达国家当模本照搬）极具迷惑性，但官方解析第一空应“目标”照应“参照系”；穿针引线=从中联系撮合，政府在市场经济中的作用是“引导”而非“撮合各方”。"}, {"o": 3, "why": "发达国家“有什么做什么”不是“途径”；保驾护航=保护、帮助，政府作用是“引导”不是“保护”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">每个民族都有自己独特的民俗文化，然而，一些人分不清具体的民族文化和民俗文化，加之有人为了短时间内推出本民族民俗文化，盲目迎合当下的流行需要，反而使自己的民俗文化变得____，出现雷同化传播现象，使大众对不同区域的特色民俗文化认知较为____，影响大众对民俗文化的了解和兴趣，甚至影响了少数民族地区的经济发展。</div>", "opts": ["支离破碎 肤浅", "不伦不类 模糊", "名存实亡 混乱", "面目全非 狭隘"], "ans": 1, "point": "逻辑关联·因果关系", "solve": "第一空“盲目迎合流行需要”→民俗文化变得“不伦不类”（既不像本民族的，也不像流行的）；第二空“雷同化传播…分不清”→认知“模糊”。", "key": "因果链：“迎合流行”→不伦不类（既不像自己也不像别人）；“雷同化→分不清”→认知模糊。", "traps": [{"o": 0, "why": "支离破碎=零散不完整，迎合流行不会使文化“破碎”；肤浅=浅薄，与“分不清”的认知状态不同。"}, {"o": 2, "why": "名存实亡=名义上存在实际已消亡，程度过重；混乱=杂乱无秩序，认知“模糊”（界限不清）比“混乱”准确。"}, {"o": 3, "why": "面目全非=样子完全改变，迎合流行不至于彻底变样；狭隘=狭窄片面，认知“模糊”对应“分不清”而非“狭隘”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">近代以来，怎样处理中国传统文化与西方文化的关系，成为很多学者关注的重要问题。有人主张全盘西化，也有人主张全面恢复传统。这些____的观点当然受到了当时历史环境的影响，但也暴露出一些人在思维模式上的局限，即用____的思维来看待复杂的文化现象。这种思维模式在今天的研究中依然不同程度的存在。</div>", "opts": ["荒谬 泾渭分明", "偏颇 非此即彼", "片面 针锋相对", "极端 水火不容"], "ans": 1, "point": "语境对应·解释说明", "solve": "第一空“全盘西化/全面恢复传统”都是走极端的观点→偏颇（不公正、偏于一端）；第二空“用非此即彼的思维看复杂文化现象”（全盘西化或全面恢复=非此即彼的二元对立）。", "key": "解释说明还原：全盘西化或全面恢复传统=“非此即彼”的二元思维；观点“偏颇”即偏于一端。", "traps": [{"o": 0, "why": "荒谬=荒唐错误，观点极端不等于荒谬；泾渭分明=界限清楚，是“黑白分明”的清晰而非“二元对立”。"}, {"o": 2, "why": "片面可近义，但“针锋相对”=观点尖锐对立，指的是两个观点对立，而文中是“用非此即彼的思维模式看复杂现象”。"}, {"o": 3, "why": "极端可近义，但“水火不容”=互相对立不可调和，形容的是文化之间的关系，不是“思维模式”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">从生态学角度来讲，人工种群和野外种群是完全不同的概念。大型哺乳动物行为复杂，其生活技巧人类难以传授，又难以“无师自通”。如果将其放归野外，结局很有可能是死亡。就算可以放归野外，也必须为他们找到____的栖息地。</div>", "opts": ["贸然 合适", "直接 天然", "草率 理想", "随意 安全"], "ans": 0, "point": "实词辨析·语义侧重", "solve": "第一空“如果将其放归野外，结局很可能是死亡”→不能“贸然”放归（轻率、冒失地）；第二空“就算可以放归，也必须找到合适的栖息地”。", "key": "语义轻重：“贸然”=轻率冒进（对应放归的严重后果）；“合适”是恰到好处，比“理想/安全”更准。", "traps": [{"o": 1, "why": "直接=径直做，无“轻率冒失”的贬义；天然=自然形成，天然栖息地不必然“合适”。"}, {"o": 2, "why": "草率=马虎不慎重，可近义，但“理想”=完美，程度过重——放归条件找“合适”而非“理想”。"}, {"o": 3, "why": "随意=任意的，贬义可；但“安全”只涵盖安全一项，栖息地还需要食物、空间等多方面“合适”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">噬菌体是一种侵袭细菌的病毒，虽然他们很早就被发现，但由于一次只能攻击一种特定的细菌而未受关注。然而，曾经不那么受欢迎的____，如今却成了它们最大的吸引力。由于过度使用抗生素，人类无意中____了目前最强大、最具耐药性的超级细菌，而噬菌体无疑是对付它们的潜在有效武器。</div>", "opts": ["敏感性 培育", "特异性 催生", "单一性 激活", "局限性 发现"], "ans": 1, "point": "逻辑关联·反义对应", "solve": "第一空“一次只能攻击一种特定的细菌”→“特异性”（专门针对特定对象）；第二空“过度使用抗生素…无意中催生了超级细菌”（催生=使事物产生）。", "key": "转折对照：“不受欢迎的特异性，如今成了最大的吸引力”；抗生素滥用“催生”（产生）超级细菌，与“无意中”呼应。", "traps": [{"o": 0, "why": "敏感性=对刺激反应灵敏，与“一次只能攻击一种细菌”不对应；培育=有意识地培养，与“无意中”直接矛盾。"}, {"o": 2, "why": "单一性=只有一种，看似对应“一次只能攻击一种”，但“特异性”=专门针对特定对象，更贴合“攻击特定细菌”的指向性；激活=使从休眠变活跃，超级细菌是被“催生”（产生）出来的，不是被“激活”的。"}, {"o": 3, "why": "局限性=限制、短处，可近义；发现=找到（无意中“发现”还是“催生”？超级细菌因抗生素滥用而“产生”→催生）。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">现代社会获取盐分轻而易举，以至于人们认为吃盐是____的事情。而事实上，由于盐在地理上的分布不均以及交通不畅等原因，其在古代一直都属于____之物。在人类历史上的绝大部分时间里，人们都在寻找盐，甚至令盐业成为了历史上第一个由国家垄断的产业。可以说，盐贯穿着整个人类历史，并在人类文明的发展中起到了____的作用。</div>", "opts": ["稀松平常 必需 举足轻重", "理所当然 稀缺 至关重要", "天经地义 关键 承上启下", "手到擒来 珍贵 一以贯之"], "ans": 1, "point": "逻辑关联·反义对应", "solve": "第一空“轻而易举→认为吃盐是理所当然的事”；第二空“而事实上…分布不均、交通不畅”→古代盐是“稀缺”之物（转折）；第三空“盐贯穿人类历史…第一个国家垄断产业”→至关重要。", "key": "转折对比：现在“轻而易举”vs 古代“稀缺”；第三空“贯穿历史、国家垄断”→至关重要。", "traps": [{"o": 0, "why": "稀松平常可近义；但第二空“必需”无法体现“分布不均交通不畅”的稀缺性——转折对比的是“容易获得 vs 稀缺”；举足轻重侧重“地位”而非“作用”，与“贯穿历史”的至关重要相比略偏。"}, {"o": 2, "why": "天经地义=理所当然可近义；“关键之物”错位——转折要的是“稀缺”（不易获得），不是“关键”（重要性）；承上启下=连接上下，与“文明发展中的作用”无关。"}, {"o": 3, "why": "手到擒来=轻易取得，可近义；珍贵可近义；“一以贯之”=始终如一，与“作用”搭配不当——是“贯穿历史”不是“一以贯之的作用”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">亲近百姓、接近生活是曲艺这门艺术的生命力所在。当然，任何人都不可能____生活的全部，所以创作者才有了“采风”一说。采风从来不是去____生活，而是深入其中，体会其中的乐与悲。然而，现在许多曲艺工作者没有耐心去深入百姓生活，于是只能写自己熟悉的生活，创作能力无疑也受到了____。</div>", "opts": ["描摹 评判 质疑", "洞察 记录 束缚", "掌握 体验 削弱", "了解 审视 限制"], "ans": 3, "point": "实词辨析·语义侧重", "solve": "第一空“不可能了解生活的全部”；第二空“采风不是去审视生活，而是深入其中体会”（审视=旁观细看，与“深入体会”反义）；第三空“只能写自己熟悉的生活”→创作能力受到“限制”。", "key": "反义对照：“不是去审视生活，而是深入其中体会”——审视（旁观）vs 深入；能力“受限”比“削弱”更贴。", "traps": [{"o": 0, "why": "描摹=照着样子描绘，“了解全部”≠描摹；评判=评价，采风不是评判；“质疑”与“创作能力”搭配不当。"}, {"o": 1, "why": "洞察=看透，“洞察生活的全部”程度过重；记录=记载，采风不是记录；“束缚”近义可留，但第一二空已错。"}, {"o": 2, "why": "掌握=全面了解，第一空可近义；但“采风不是去体验生活”与后文“深入其中体会”直接矛盾——官方第二空“审视”（旁观评判，与“深入体会”对照）；削弱=减弱，“创作能力受到削弱”搭配弱于“限制”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">上世纪八十年代初，SCI 作为一种____的、相对公平的量化指标被引进中国，这是建立科学、公平、公正的高校科研评价体系的初步尝试，在当时是一种进步。但如果启用先进的考核举措而长期____，甚至演变成“至上”的法宝和单一的指挥棒，最终都会____，弊大于利。</div>", "opts": ["详细 奉为圭臬 画地为牢", "稳定 唯命是从 作茧自缚", "客观 一成不变 物极必反", "中立 墨守成规 贻笑大方"], "ans": 2, "point": "逻辑关联·条件关系", "solve": "第一空“相对公平的量化指标”→客观；第二空“长期一成不变”（与“至上法宝、单一指挥棒”并列的僵化表现）；第三空“弊大于利”→物极必反（事物发展到极点会向相反方向转化）。", "key": "条件演变链：“如果…长期一成不变…最终都会物极必反，弊大于利”；客观对应“相对公平”。", "traps": [{"o": 0, "why": "指标是“客观”而非“详细”；奉为圭臬=把…当作准则，与“长期”搭配不当（“长期奉为圭臬”语义怪）；画地为牢=局限在圈内，与“最终弊大于利”的演变结果对应弱。"}, {"o": 1, "why": "稳定可近义，但“唯命是从”=完全服从命令，SCI 是“指标”不是“命令”；作茧自缚=自己束缚自己，第三空近义可，但前两空错。"}, {"o": 3, "why": "中立=不偏不倚，“相对公平”对应“客观”更准；墨守成规=守旧不变，近义可；贻笑大方=让内行笑话，“弊大于利”不是“被笑话”，语义过轻。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">医生和患者在沟通时最容易出现的____其实是，患者不同意或没听懂医生的建议，又因为不想被说教或觉得尴尬而没有如实反馈意见，而医生也大多没有意识到这一点。这显然会大大影响临床诊疗的____。此外，患者还会由于不想被说教而不承认一些不良生活行为。越是健康状况差的患者，越是容易____一些信息，而他们恰恰是最需要高质量医疗服务的人。</div>", "opts": ["难点 结果 遗漏", "盲区 效率 隐瞒", "障碍 判断 虚构", "瓶颈 目的 回避"], "ans": 1, "point": "实词辨析·语义侧重", "solve": "第一空“医生也大多没有意识到这一点”→沟通的“盲区”（认识不到的领域）；第二空“没听懂又没如实反馈”→影响诊疗“效率”；第三空“不承认不良生活行为”→隐瞒信息。", "key": "对应定位：“医生没意识到”→盲区（看不见）；“没反馈→影响效率”；“不承认不良行为”→隐瞒。", "traps": [{"o": 0, "why": "难点=困难点，与“医生没意识到”的核心不对应（重点是“看不见”的盲区）；结果=诊疗结果，“影响结果”弱于“影响效率”；遗漏=疏忽漏掉，患者是“隐瞒”不是“遗漏”。"}, {"o": 2, "why": "障碍=阻碍，第一空可近义；判断=诊断判断，第二空官方“效率”（沟通不畅直接影响诊疗效率）；虚构=编造，患者“不承认不良行为”是隐瞒事实不是虚构。"}, {"o": 3, "why": "瓶颈=阻碍发展的环节，可近义；目的与文意无关；回避=躲开，“回避信息”搭配不当——信息是“隐瞒”。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">内太阳系的岩石行星与外太阳系的气态行星最初的物质构成____。科学家此前认为，由于木星质量大、引力强，可以在一些物质到达内太阳系之前将其____，阻止了内外太阳系物质的混合。但研究表明，木星的成长速度不足以阻止外太阳系物质源源不断流入内太阳系，这意味着内外太阳系行星将拥有____的成分。</div>", "opts": ["大同小异 阻拦 共同", "相去甚远 消灭 全新", "千姿百态 捕获 独特", "大相径庭 吞噬 类似"], "ans": 3, "point": "逻辑关联·反义对应", "solve": "第一空“岩石行星 vs 气态行星”→最初的物质构成“大相径庭”（差别很大）；第二空“木星引力将物质吞噬”（吞没）；第三空“但…源源不断流入”→内外行星将拥有“类似”的成分（转折：原以为不同，实际会趋同）。", "key": "转折逻辑：原以为木星拦截→内外不同；研究表明拦不住→成分“类似”；“吞噬”呼应木星引力强大。", "traps": [{"o": 0, "why": "大同小异=大体相同，岩石vs气态差异极大，首空即排除；共同与“源源不断流入”后的“类似”相比，逻辑不成立（流入是混合趋同，不是本来就共同）。"}, {"o": 1, "why": "相去甚远首空可近义；但“消灭”程度过重，木星只是拦截一部分；“全新”与“流入混合”的转折结果矛盾。"}, {"o": 2, "why": "千姿百态=姿态多样，形容“物质构成”不当；捕获可近义；“独特”与转折后“源源不断流入”矛盾——流入后成分应趋同（类似）。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">随着各种侦察手段的不断演进，可视侦察、红外侦察、雷达侦察等“____”，现代坦克在战场上越来越难以藏身。对此，现代坦克当然不会“____”。在讲求“发现即摧毁”的现代战场上，坦克必须实现对侦查手段的“免疫”，见招拆招，____，让对手对自己庞大的身躯“视若无睹”。</div>", "opts": ["齐头并进 束手就擒 对症下药", "大显身手 自暴自弃 见机行事", "虎视眈眈 坐以待毙 有的放矢", "明察秋毫 知难而退 多管齐下"], "ans": 2, "point": "语境对应·关键词定位", "solve": "第一空“各种侦察手段不断演进→坦克难以藏身”→侦察手段“虎视眈眈”（贪婪凶狠地注视，含威胁）；第二空“不会坐以待毙”（等着被消灭）；第三空“见招拆招，有的放矢”（针对具体侦察手段采取针对性措施）。", "key": "关键词串联：“发现即摧毁”→侦察如虎视眈眈；坦克“见招拆招”→有的放矢（一招对一法）。", "traps": [{"o": 0, "why": "齐头并进=不分先后一起前进，侦察手段是“演进”不是“齐头并进”；束手就擒、对症下药后两空近义，但首空错。"}, {"o": 1, "why": "大显身手=充分施展本领，侦察是“威胁注视”而非“施展”；自暴自弃=自甘堕落，程度过重；见机行事=看情况行动，与“见招拆招”的针对性不同。"}, {"o": 3, "why": "明察秋毫=目光敏锐，主语应是人而非“侦察手段”；知难而退=见困难退缩，坦克是主动“免疫”应对而非退却；多管齐下=多方面同时进行，与“有的放矢”的针对性对照弱。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">依托数字文化资源进行新文旅业态和产品的开发，是文物古迹焕发新活力、增强吸引力的重要手段。但科技应用应有边界，即____。一旦两者有冲突，理应遵循保护优先原则。打造沉浸式场景，要借助声电光影，意在将静态的、单一的遗产地场景，转化为多维、立体、丰富的体验场景，其目的无可非议。但沉浸式场景的构建多会涉及器材、设施、设备的导入和搭建，即使只存在小概率风险，也须慎重。鉴于此，文化遗产地的沉浸式游览，可考虑在遗产地保护范围之外，打造不依托文物本体的沉浸式体验项目。</div>", "opts": ["需坚持适度开发和可持续性发展策略", "要把握好真实性和娱乐性之间的尺度", "不能过度强调沉浸式体验而忽略文化内涵", "不能对资源本身及其价值造成破坏或产生不良影响"], "ans": 3, "point": "语句衔接·承上启下", "solve": "横线前“科技应用应有边界”，横线后“一旦两者有冲突，理应遵循保护优先原则”（两者=开发利用与资源保护）→边界即“不能对资源本身及其价值造成破坏”，承上启下（解释“边界”并衔接“保护优先”）。", "key": "衔接逻辑：横线解释“边界”→必须是后文“保护优先”的直接原因→不能对资源本身及其价值造成破坏。", "traps": [{"o": 0, "why": "“适度开发、可持续”是开发策略的“度”，未落到“保护优先”的冲突原则——边界要具体化为“不可破坏资源本体”。"}, {"o": 1, "why": "后文通篇未提“真实性与娱乐性”这对关系——命题人用另一组常见概念偷换话题。"}, {"o": 2, "why": "后文“保护优先原则”针对的是资源本体与价值，不是“文化内涵”——内涵与本体错位。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">虽然物质生产是社会生活的基础，但上层建筑也可以反作用于经济基础，生产力和生产关系、经济基础和上层建筑之间有着十分复杂的关系，有着作用和反作用的现实过程，并不是单线式的简单决定和被决定逻辑。世界上的事物总是有着这样那样的联系，不能孤立地静止地看待事物发展，正所谓“有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随”。在观察社会发展时，一定要注意这种决定和被决定、作用和反作用的有机联系。对生产力标准必须全面准确理解，不能绝对化，不能撇开生产关系、上层建筑来理解生产力标准。____</div>", "opts": ["广袤的自然界是如此，丰富的精神世界也是如此", "每一个事物各部分、要素之间都存在联系", "否则往往会出现盲人摸象、以偏概全的问题", "任何事物都与周围的其他事物相互联系着"], "ans": 2, "point": "语句衔接·承上启下", "solve": "横线在文末承接“对生产力标准必须全面准确理解，不能绝对化”→否则会陷入以偏概全（“盲人摸象”呼应“不能孤立静止地看待事物”），C 的“否则”与前文警示完美衔接。", "key": "衔接定位：横线前有明确警示（必须…不能…），横线处用“否则”引出后果→盲人摸象、以偏概全（呼应“不能孤立静止”）。", "traps": [{"o": 0, "why": "“自然界如此、精神世界如此”是平行举例，与上文“必须全面理解”的告诫语气不衔接——横线处应承接“否则”的后果而非横向展开。"}, {"o": 1, "why": "“每个事物各部分都存在联系”是上文的复述（事物总是有联系），重复而非推进；且缺“否则”的条件承接。"}, {"o": 3, "why": "“任何事物都与周围事物联系着”同上为重复观点句，与“不能绝对化”的警示不构成因果衔接。"}], "src": "2021国考·地市级", "yr": 2021, "srcType": 2, "orig": "按2021国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">①但我们必须在鼓励创业的同时，也树立起高度的风险意识。②如果说减税等鼓励创业的政策能够燃起大众创业热情的话，那么降低创业风险，及时为创业失败“止损”则能促使更多人真正迈出创业的第一步。③创业需要不断试错，只有当失败不是创业者不能承受之重时，他们才不会对失败产生畏惧，最终找到成功的道路。④创业既是推动国家经济向前发展的重要动力，也是实现个人梦想的最佳途径。将以上4个句子重新排列，语序正确的是：</div>", "opts": ["①②④③", "②④③①", "③②④①", "④①②③"], "ans": 3, "point": "语句排序·首句与捆绑", "solve": "①句以“但”开头，不作首句→排除 A；②③皆可作首句。①②含“风险”共同话题：①转折引出“风险意识”，②具体论述“降低创业风险、及时止损”承接①；④先引出话题（创业的意义）→顺序为 ④①②③。", "key": "首句判定：含转折词（但/然而）的句子不作首句；①与②“风险”话题捆绑且①在②前。", "traps": [{"o": 0, "why": "把以“但”开头的①放首句——转折句前必有被转折的内容，作首句必错，这是排序题第一判定点。"}, {"o": 1, "why": "②（具体谈“降低创业风险”）放首句，跳过④的话题引入，上来就进入细节，话题不完整。"}, {"o": 2, "why": "③（对策“不断试错”）放首句，把收尾性对策提前，缺少话题引入与转折铺垫。"}], "src": "2024国考", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">①乡村的好家风越多，乡村文明才有厚德的土壤。②同时，好家风也能为更多人创造人生出彩的机会，提升农村精神文明建设水平。③好家风是宝贵的精神财富，不仅可以让仁义忠孝、尊老爱幼的家族文化和淳朴民风代代相传，而且能有力强化乡风文明的“内核”。④传承弘扬优良家风是乡风文明建设的“牛鼻子”。⑤抓好家风传承与建设，就是抓住了乡风文明的“牛鼻子”。⑥建设文明乡风，不单是基础设施建设要跟上，更要以注重家庭家教家风、弘扬优秀传统文化为抓手，全面提升乡村文明素质。将以上6个句子重新排列，语序正确的是：</div>", "opts": ["⑥④①③②⑤", "⑥④⑤③②①", "④⑤③②①⑥", "④⑥③②①⑤"], "ans": 3, "point": "语句排序·首句与捆绑", "solve": "④引出话题“家风与乡风”并点出“牛鼻子”→适合作首句，排除 A、B；⑥承接④具体阐述建设乡风要以家风为抓手；③②①构成“好家风意义”小段（③“不仅…而且…”递进、②“同时”并列、①条件式展开）；⑤“抓好家风…就是抓住牛鼻子”回扣④作总结，构成“总—分—总”。", "key": "结构定位：首句④点题（牛鼻子）→分述⑥③②①→尾句⑤回扣总结；“同时”“不仅…而且”等关联词锁定句内捆绑。", "traps": [{"o": 0, "why": "⑥（具体建设措施）放首句，把分述性内容当总起，缺少“家风是牛鼻子”的话题引出。"}, {"o": 1, "why": "同 A 首句错误；且尾句①“好家风越多…才有土壤”是条件式展开，不适合作全段总结。"}, {"o": 2, "why": "⑤（总结句）放首句，以“总—分—总”的尾句充当开头，总结提前导致结构倒置。"}], "src": "2024国考", "yr": 2024, "srcType": 2, "orig": "2024国考真题（部分题面据考后复盘整理），答案经博主「超格莫等闲」复盘与多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">研究发现，人体存在一种细胞清洁过程，被称为分子伴侣介导的自噬（CMA）。CMA 和阿尔兹海默症之间存在动态的相互作用。CMA 的效率会随着人类年龄的增长而下降，导致人体内有害蛋白质积累成不溶性团块，形成有毒蛋白质聚集体，从而损害细胞，导致阿尔兹海默症症状的出现。而早期的阿尔兹海默症也会损害 CMA，使 CMA 活性显著降低。为此，研究人员开发出了一种新药，该药物通过提高 CMA 关键成分的受体水平来重振 CMA 效率，从而改善小鼠记忆力，显示出治疗阿尔兹海默症的潜力。根据这段文字，以下说法正确的是：</div>", "opts": ["新药物能够减缓阿尔兹海默症的发展", "阿尔兹海默症抑制了 CMA 的发生", "抑制有害蛋白质积累能够提高记忆力", "新药物的功效是通过提高 CMA 效率来实现的"], "ans": 3, "point": "细节判断·六类偷换", "solve": "原文“通过提高 CMA 关键成分的受体水平来重振 CMA 效率，从而改善小鼠记忆力”→D 项与原文完全对应（新药功效=提高 CMA 效率）。", "key": "细节判断防坑：逐项回原文定位关键词（潜力/活性/效率），警惕程度、范围、逻辑三类偷换。", "traps": [{"o": 0, "why": "程度偷换：原文只说“显示出治疗潜力”，A 项升级为“能够减缓发展”——把“可能/潜力”偷换成“确定效果”。"}, {"o": 1, "why": "范围偷换：原文“损害 CMA，使 CMA 活性显著降低”，B 项偷换为“抑制 CMA 的发生”——活性降低≠不发生。"}, {"o": 2, "why": "逻辑偷换：原文是“新药提高 CMA 效率→改善记忆力”，C 项改成“抑制有害蛋白质积累→提高记忆力”，把间接机制换成直接因果。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "按2022国考真题原卷原文收录，答案经多家机构真题解析交叉核对"}, {"q": "<div class=\"zl-q\">①除萤科于白垩纪缅甸琥珀及一些新生代地层中有化石记录外，其他类群化石此前尚未被报道过。②能够生物发光的叩甲总科物种大部分归属于萤类，包括萤科、光萤科、雌光萤科及华光叩甲科。③日前，科研人员在缅甸琥珀中发现了叩甲总科的新科——白垩光萤科。④在陆生动物中，能进行生物发光的物种大都属于鞘翅目昆虫，其中叩甲总科最多见。⑤萤类分支中除华光叩甲科，其他物种身体均较为柔软，部分类群的雌性还具有幼态持续现象，也正因此其物种很难被保存为化石。⑥这一新类群的发现，对于研究叩甲总科中生物发光的起源与演化具有重要意义。将以上6个句子重新排列，语序正确的一项是：</div>", "opts": ["③⑥④⑤②①", "③⑤④①⑥②", "④②⑤①③⑥", "④⑤①②⑥③"], "ans": 2, "point": "语句排序·首句与捆绑", "solve": "对比首句：③“日前发现了新科”是具体新发现，④“叩甲总科最多见”是背景介绍，按逻辑先背景后新发现→④在③前，排除 A、B；⑥“这一新类群”是指代词，其指代对象须在前文出现，③“新科——白垩光萤科”即“新类群”→③⑥捆绑，排除 D，锁定 C。", "key": "指代词捆绑：⑥“这一新类群”必须前接③“新科——白垩光萤科”；背景④在前、新发现③在后。", "traps": [{"o": 0, "why": "把③（新发现）放首句，跳过④的背景铺垫——科研新发现类排序，背景介绍通常先于“日前”的具体发现。"}, {"o": 1, "why": "同 A 首句错误；且⑥（“这一新类群”的指代）置于②前，前文②未出现“新类群”概念，指代落空。"}, {"o": 3, "why": "⑤（“萤类分支…很难保存为化石”）置于②前，⑤以“萤类分支”承接②的“萤类”列举，被打断；⑥指代词前无指代对象。"}], "src": "2022国考·行政执法类", "yr": 2022, "srcType": 2, "orig": "2022国考·行政执法类第50题（市地级第45题）；题干与解析来源：牛客网真题汇编、星光公考题库"}, {"q": "<div class=\"zl-q\">在银河系中，恒星形成于巨型分子云的引力塌缩，而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为“原行星盘”。在年轻恒星中，周围存在原行星盘的比例会随恒星年龄增长而下降，存在的时长中值约为200万~300万年。然而，正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型，对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星。根据这段文字，下列说法正确的是：</div>", "opts": ["恒星和原行星盘的存在时间大致相同", "原行星盘是类地行星形成中的必经阶段", "巨型分子云引力塌缩后随即形成行星和恒星", "行星在运动中不断从原行星盘中获取所需物质"], "ans": 1, "point": "细节判断·六类偷换", "solve": "原文“对于类似地球的其他行星而言，经历了原行星盘阶段……最终形成现在的类地行星”→形成类地行星须经过原行星盘阶段，B 项“必经阶段”与原文对应。", "key": "细节判断防坑：原行星盘是类地行星形成必经阶段（原文对照）；警惕“随即/不断/大致相同”等时态、范围偷换词。", "traps": [{"o": 0, "why": "范围偷换：原文只说“原行星盘存在的时长中值约200万~300万年”，并未与“恒星存在时间”比较，A 项无中生有式比较。"}, {"o": 2, "why": "逻辑+时态偷换：原文是“引力塌缩→形成恒星→残留物成盘→盘演化出行星”，是分步过程；C 项“随即形成行星和恒星”把链条压缩成同时发生。"}, {"o": 3, "why": "逻辑偷换：原文“通过原行星盘获得气体及所需物质”是行星形成期的机制，D 项改写成“行星在运动中不断获取”——把形成机制偷换成持续行为。"}], "src": "2023国考·行政执法类", "yr": 2023, "srcType": 2, "orig": "2023国考·行政执法类第2题；解析来源：华图教育真题页、星光公考题库（选项逐项原文对照）"}, {"q": "<div class=\"zl-q\">社会和文化推崇慷慨行为，但这种行为往往要求一个人为他人利益贡献自己的资源，所以这很难用一般的经济理论解释。然而，有神经科学论文指出，即使会牺牲自我利益，有些人也会对他人慷慨大方，这是因为当人表现慷慨时，会激活大脑中的特定区域，而这些区域与产生幸福感的区域相互关联。根据这段文字，下列说法正确的是：</div>", "opts": ["对牺牲自我利益去满足他人的行为不应过多推崇", "人类做出慷慨行为与产生幸福感时的大脑机制相同", "慷慨行为能增加幸福感是人们慷慨待人的原因之一", "经济学理论能够充分阐述人类利他行为的机制"], "ans": 2, "point": "细节判断·六类偷换", "solve": "原文“当人表现慷慨时，会激活大脑中的特定区域，而这些区域与产生幸福感的区域相互关联”→慷慨激活的区域与幸福感区域关联，可推出“慷慨增加幸福感是慷慨待人的原因之一”，C 项正确。", "key": "细节判断防坑：选项原文对照——“相互关联≠机制相同”“很难解释≠充分阐述”；无中生有的价值判断直接排除。", "traps": [{"o": 0, "why": "无中生有：原文只说“难以用一般经济理论解释”，并未对“应否推崇慷慨行为”表态，A 项是命题人用常识联想硬加的观点。"}, {"o": 1, "why": "程度偷换：原文是“相互关联”，B 项升级为“机制相同”——关联≠相同，程度被夸大为等同。"}, {"o": 3, "why": "反向偷换：原文明确“这很难用一般的经济理论解释”，D 项却说“能够充分阐述”，与原文方向完全相反。"}], "src": "2023国考·行政执法类", "yr": 2023, "srcType": 2, "orig": "2023国考·行政执法类第27题；解析来源：华图教育真题解析（多版本题库交叉核对）"}, {"q": "<div class=\"zl-q\">随着技术经验的积累，高空风弹道修正等技术方法能使火箭在飞行过程中有效抵抗风干扰。为了有更强的适应性，长八火箭在使用自主制导技术等成熟方法外，还增加了自动滚转减载技术，根据风的来向，会在空中主动滚动调整，使火箭用更稳定的优势面来应对高空风，用“____”的方式，通过自身的旋转抵消掉高空风的影响。填入画横线部分最恰当的一项是：</div>", "opts": ["以柔克刚", "以守为攻", "以虚为实", "以退为进"], "ans": 0, "point": "语境对应·解释说明", "solve": "文段末句“通过自身的旋转抵消掉高空风的影响”是对横线处的直接解释——不硬碰风，而是借旋转主动卸力、化劲，正合“以柔克刚”（用柔和的方式制服刚强）。", "key": "解释对应：横线后“通过自身的旋转抵消掉高空风的影响”即答案——抓住“不硬抗、借力化力”这一核心。", "traps": [{"o": 1, "why": "“以守为攻”侧重防守中伺机反击，而文段是“主动旋转抵消干扰”，并非“先守后攻”，无对应语境。"}, {"o": 2, "why": "“以虚为实”为兵法术语（把空虚伪装成充实），文段讲的是卸力化解，无“虚实转化”内容，纯属形近干扰。"}, {"o": 3, "why": "“以退为进”指表面退让实则进取，文段没有任何“退让”动作，与“旋转抵消”无关。"}], "src": "2025国考（卷别以考后复盘为准）", "yr": 2025, "srcType": 2, "orig": "据考后回忆版整理；解析思路来源：抖音“2025国考逻辑填空文字复盘”，答案与格木教育2025国考解析口径交叉核对"}, {"q": "<div class=\"zl-q\">《营造法式》刊行之后，两浙一带的建筑技术借助官方的推广，完全融入了中国古典木构建筑技术的主流。以抬梁式为梁柱结构，屋面重量通过椽、檩、梁、斗拱、柱传递至基础，形成此后中国官式建筑的发展路径。这种____的结构原则贯穿始终，可细分为殿堂式与厅堂式，满足不同礼制等级的需要。填入画横线部分最恰当的一项是：</div>", "opts": ["源远流长", "标新立异", "一枝独秀", "一以贯之"], "ans": 3, "point": "语境对应·解释说明", "solve": "横线后“贯穿始终”是直接解释——同一结构原则从头到尾延续不变，D“一以贯之”（自始至终贯穿）与之精确对应。", "key": "解释对应：“____的结构原则……贯穿始终”，横线词=贯穿始终，锁定“一以贯之”。", "traps": [{"o": 0, "why": "“源远流长”强调历史久远、渊源深长，侧重“时间跨度长”，而非“前后一致贯穿”，不能与“贯穿始终”呼应。"}, {"o": 1, "why": "“标新立异”指提出新奇主张，与文段“完全融入主流、形成固定路径”的正向延续相悖。"}, {"o": 2, "why": "“一枝独秀”强调在某方面超群出众，文段讲的是延续性而非优越性，语义方向偏离。"}], "src": "2025国考（卷别以考后复盘为准）", "yr": 2025, "srcType": 2, "orig": "据考后回忆版整理；解析思路来源：抖音“2025国考逻辑填空文字复盘”（原题选项含礼制等级提示，答案D）"}, {"q": "<div class=\"zl-q\">兔和羚羊等食草动物获取食物时动作敏捷，牛类有瘤胃，可先囤积食物，到安全环境中再慢慢消化。大熊猫既没有这样的敏捷度，也没有瘤胃结构，所以____，选择了其他动物不吃的食物种类，也出现了一些与进食、消化有关的基因突变，形成了独特的食性——将箭竹作为主食。填入画横线部分最恰当的一项是：</div>", "opts": ["扬长避短", "顺水推舟", "因陋就简", "另辟蹊径"], "ans": 3, "point": "语境对应·解释说明", "solve": "“选择了其他动物不吃的食物种类”即开辟全新路径，D“另辟蹊径”（另外开辟一条路）与之对应，后文“独特的食性”再次印证。", "key": "解释对应：“____，选择了其他动物不吃的食物种类”→开辟新路=另辟蹊径。", "traps": [{"o": 0, "why": "“扬长避短”强调发挥长处、回避短处，但文段未说大熊猫发挥什么长处，只说绕开竞争选新食源，无“长短”对应。"}, {"o": 1, "why": "“顺水推舟”指顺着情势行事，是被动顺应；而大熊猫是主动开辟新食源，方向相反。"}, {"o": 2, "why": "“因陋就简”指将就简陋条件凑合，含“将就、简陋”色彩，与“独特食性”这一积极结果不符。"}], "src": "2025国考（卷别以考后复盘为准）", "yr": 2025, "srcType": 2, "orig": "据考后回忆版整理；解析思路来源：抖音“2025国考逻辑填空文字复盘”（含大熊猫食草题，答案D）"}, {"q": "<div class=\"zl-q\">此前，司法机关获取救助线索主要靠人工摸排，这存在一定的____。为此，司法机关尝试运用大数据，主动发现救助线索，实现“应救尽救、应救即救”，同时衔接社会救助力量，构建多元帮扶机制，切实解决了一些困难群体的急难愁盼问题。依次填入画横线部分最恰当的一项是：</div>", "opts": ["片面性；一揽子", "滞后性；全方位", "偶然性；一站式", "局限性；全天候"], "ans": 1, "point": "实词辨析·语义侧重", "solve": "第一空定位“人工摸排”的弊端——“被动等待、发现不及时”，即“滞后性”；第二空定位“应救尽救、应救即救”+“多元帮扶”，强调覆盖所有需要者，即“全方位”。", "key": "对象对应：第一空由“靠人工摸排”锁定“滞后”，第二空由“应救尽救”锁定“全方位”，抓强对应点。", "traps": [{"o": 0, "why": "“片面性”指只见局部，人工摸排的问题是“不及时”而非“看一面”；“一揽子”强调打包处理，与“主动发现+多元帮扶”不贴。"}, {"o": 2, "why": "“偶然性”指随机碰运气，文段未强调“概率小”；“一站式”侧重集中办理，文段无“一处办结”语境。"}, {"o": 3, "why": "“局限性”宽泛，不如“滞后”能精确对应“人工摸排→发现不及时”；“全天候”指不分时段，文段无时间维度。"}], "src": "2025国考（卷别以考后复盘为准）", "yr": 2025, "srcType": 2, "orig": "据考后回忆版整理；解析思路来源：抖音“2025国考逻辑填空文字复盘”（原选项：片面性一揽子/滞后性全方位/偶然性一站式/局限性全天候）"}, {"q": "<div class=\"zl-q\">在技术的赋能下，检察机关办理公益诉讼案件如同有了“顺风耳”“千里眼”，不仅能看得远，也能看得清。这能有效避免那种____的线索摸排方式，确保证据客观准确、办案精准高效。填入画横线部分最恰当的一项是：</div>", "opts": ["刻舟求剑", "管中窥豹", "大海捞针", "缘木求鱼"], "ans": 2, "point": "语境对应·关键词定位", "solve": "横线修饰“技术赋能前的线索摸排方式”，与后文“精准高效”相反——线索摸排范围大、无从下手、难以精准定位，C“大海捞针”（比喻极难寻找）与之对应。", "key": "反义对应：“避免____的摸排方式”=与“精准高效”相反→大海捞针（难以精准定位）。", "traps": [{"o": 0, "why": "“刻舟求剑”比喻拘泥成例、不知变通，侧重“方法僵化”，与“摸排不精准、难找”不直接对应。"}, {"o": 1, "why": "“管中窥豹”比喻只见局部，侧重“认知片面”，文段强调的是“难找”而非“看得少”。"}, {"o": 3, "why": "“缘木求鱼”比喻方向或方法根本错误、劳而无功，文段未说摸排“方法根本错误”，程度过重。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第36题；答案与解析：格木教育2026执法卷真题解析PDF、抖音“2026国考言语真题复盘”“2026国考逻辑填空复盘”（多源一致）"}, {"q": "<div class=\"zl-q\">在太空实验中，航天员佩戴的“脑电帽”内嵌着许多微小的传感器，它们就像一群“小侦探”，能精准捕捉大脑的每一个微妙波动。填入画横线部分最恰当的一项是：</div>", "opts": ["明察秋毫", "未卜先知", "洞若观火", "随机应变"], "ans": 0, "point": "比喻/修辞对应", "solve": "“小侦探”是形象化比喻提示；“精准捕捉大脑的每一个微妙波动”要求观察极细致，A“明察秋毫”（明察最细微之物）与之对应。", "key": "比喻+解释双提示：比喻词“小侦探”+“精准捕捉微妙波动”→明察秋毫。", "traps": [{"o": 1, "why": "“未卜先知”指事先预知未来，文段是“捕捉波动”而非“预测未来”，语义方向不符。"}, {"o": 2, "why": "“洞若观火”形容看得清楚透彻，侧重“看清本质”，而文段强调的是“捕捉细微”，与“微妙波动”不贴。"}, {"o": 3, "why": "“随机应变”指灵活应对变化，无“细致观察”之义，与“小侦探”比喻无关。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第37题；答案与解析：格木2026执法卷真题解析PDF、抖音“2026国考逻辑填空复盘”（多源一致）"}, {"q": "<div class=\"zl-q\">未来战争可以通过智能辅助直接干扰或控制敌方指挥系统，篡改其指挥指令和数据，使之产生幻觉或失灵，导致敌方指挥失灵、协同失调、人员失能，最终不战而屈人之兵。这种从根本和主要方面瓦解敌方作战体系的打击方式，正是____之策。填入画横线部分最恰当的一项是：</div>", "opts": ["移花接木", "偷梁换柱", "反客为主", "釜底抽薪"], "ans": 3, "point": "成语辨析·本义区分", "solve": "横线前“从根本和主要方面瓦解敌方作战体系”是直接解释——不正面交战而从根基上使敌瘫痪，D“釜底抽薪”（从根本上解决问题）与之对应。", "key": "解释对应：横线前“从根本和主要方面瓦解”即“釜底抽薪”的释义——抓本质表述，不被“篡改”的表面手段带偏。", "traps": [{"o": 0, "why": "“移花接木”强调暗中调换、以假换真，只体现“篡改替换”这一手段，未体现“根本瓦解”的效果。"}, {"o": 1, "why": "“偷梁换柱”同“移花接木”，侧重偷换内容，与“使指挥失灵、人员失能”的整体破坏力不匹配。"}, {"o": 2, "why": "“反客为主”指变被动为主动，无“根本破坏”之义，与“导致失灵、失能”的后果无关。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第44题（题号按考后回忆版）；答案与解析：抖音“2026国考言语真题复盘”与“2026国考逻辑填空复盘”（两源均答釜底抽薪）"}, {"q": "<div class=\"zl-q\">中生代寄生虫的化石并不稀少，但其地质年代较新，常被认为难以____深层的生物演化奥秘；再者，它们形态单调、特征____，使得分类鉴定难度极高，因此相关研究仍然____。依次填入画横线部分最恰当的一项是：</div>", "opts": ["探寻；一致；凤毛麟角", "揭示；模糊；屈指可数", "阐释；雷同；寥寥无几", "蕴含；相似；少之又少"], "ans": 1, "point": "实词辨析·搭配对象", "solve": "第一空主语是“化石”，应为“化石难以揭示奥秘”（向外展示）——A“探寻”的主语须是人，搭配不当；第二空“特征模糊/相似”是因，导致“鉴定难度极高”之果；第三空“研究仍然很少”即“屈指可数”。", "key": "主宾+因果双定位：第一空看主语（化石→揭示），第二空与“鉴定难度极高”构成因果（模糊），第三空对应“很少”。", "traps": [{"o": 0, "why": "“探寻”与“化石”主宾搭配不当（探寻的主语是人）；“特征一致”反而便于鉴定，无法构成“鉴定难度极高”的因果。"}, {"o": 2, "why": "“阐释”侧重解说，主语也须是人；“雷同”含贬义且与“形态单调”语义重复。"}, {"o": 3, "why": "“蕴含”指自身含有奥秘，与“难以____奥秘”（需对外展示）方向相反；“相似”与“模糊”相比，难鉴定因“不清”而非“像”。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第46题（题号按考后回忆版）；解析思路来源：抖音“2026国考言语真题复盘”（选项组合为回忆版整理，答案依多空锁定逻辑为B）"}, {"q": "<div class=\"zl-q\">发展新质生产力与传统产业并不矛盾，不能简单认为发展前者就要____后者。传统产业有着不可替代的作用，为经济发展提供____支撑，也是新质生产力落地的重要____。依次填入画横线部分最恰当的一项是：</div>", "opts": ["取代；系统性；平台", "摒弃；基础性；载体", "淘汰；关键性；依托", "放弃；战略性；渠道"], "ans": 1, "point": "语境对应·解释说明", "solve": "第一空“发展前者≠不发展后者”→“摒弃/放弃/淘汰”；第二空“不可替代的作用”→最能体现“根基性”的是“基础性”；第三空“新质生产力落地的重要____”→承载形式即“载体”。", "key": "解释对应：第二空“不可替代→基础性”、第三空“承载形式→载体”，用强对应点锁定整组。", "traps": [{"o": 0, "why": "“取代”只表替换关系，不含“不发展后者”之意，与“并不矛盾”的逻辑冲突。"}, {"o": 2, "why": "“关键性”侧重重要环节，而“基础”才是不被替代的根基，“关键”≠“基础”。"}, {"o": 3, "why": "“战略性”侧重全局谋划，“渠道”是通路，二者都无法表达“传统产业本身作为承载形式”。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第47题（题号按考后回忆版）；解析思路来源：抖音“2026国考言语真题复盘”（选项组合为回忆版整理，答案D）"}, {"q": "<div class=\"zl-q\">敢于正视问题的反面是回避矛盾、____，个别表现在：发言提纲套用、借用、翻用，发言内容偏离主题、不及重点，____、似曾相识，剖析问题避重就轻、____，相互批评官话、套话……凡此种种，致使民主生活会的批评和自我批评有形式而无实质内容和效果。依次填入画横线部分最恰当的一项是：</div>", "opts": ["敷衍了事；老生常谈；隔靴搔痒", "虚与委蛇；长篇大论；大而化之", "畏首畏尾；陈词滥调；浮光掠影", "闪烁其词；不痛不痒；张冠李戴"], "ans": 0, "point": "多对一·全匹配验证", "solve": "三个空分别锁定：①与“回避矛盾”并列→应付差事（敷衍了事）；②与“似曾相识”并列→内容陈旧重复（老生常谈）；③与“避重就轻”并列→只触及表面（隔靴搔痒）。A 项三词精准落在“应付、陈旧重复、剖析不深”，全匹配。", "key": "多对一全匹配：三个空分别锁定“应付、陈旧重复、剖析不深”，必须整组代回验证，不能只看单个熟词。", "traps": [{"o": 1, "why": "“虚与委蛇”偏表面应酬；“长篇大论”只表篇幅长，不等于“似曾相识”（似曾相识指内容重复陈旧）。"}, {"o": 2, "why": "“畏首畏尾”是胆小怕事，与“回避矛盾”不同维；“浮光掠影”偏观察不深，与“剖析不深”程度有别，整组失配。"}, {"o": 3, "why": "“闪烁其词”指说话躲闪，与“回避矛盾”不搭；“张冠李戴”指弄错对象，与“剖析不深”无关。"}], "src": "2026国考·行政执法类", "yr": 2026, "srcType": 2, "orig": "2026国考·行政执法类第48题；题面与答案：青云培训“2026国考第48题解析”（含完整题面）；注：抖音复盘将“老生常谈”记到 B 项位置系选项顺序误记，以完整题面为准"}, {"q": "<div class=\"zl-q\">构建新发展格局的关键在于经济循环的____，就像人们讲的要调理好统摄全身阴阳气血的任督二脉，经济活动需要各种生产要素的组合在生产、分配、流通、消费各环节有机衔接，从而实现循环流转。</div>", "opts": ["行之有效", "环环相扣", "畅通无阻", "井然有序"], "ans": 2, "point": "选项呼应·自洽性", "solve": "三处提示都指向“循环流转顺畅”：“任督二脉”（打通）、“各环节有机衔接”（衔接无断点）、“实现循环流转”。“畅通无阻”指毫无阻碍地通行，正合经济循环的通畅义。“环环相扣”虽与“循环”字面呼应，但语义是“环节紧密配合”，讲的是衔接紧密而非流转顺畅，与“实现循环流转”的落脚点错位。", "key": "字面联想防坑：看见“循环”“各环节”别急着选“环环相扣”——横线核心是“流转通畅”（任督二脉打通、循环流转），不是“衔接紧密”；选词要落在最终落脚点上。", "traps": [{"o": 1, "why": "环环相扣=一环扣一环、衔接紧密。命题人用“循环→环环相扣”的字面联想设陷——看到“循环”二字就选，但文段落脚是“循环流转”的顺畅（无阻碍），不是“环节配合”的紧密，这是本题最强陷阱。"}, {"o": 0, "why": "行之有效=实行起来有成效，强调的是“方法有效果”，与“循环流转”这一状态描述无对应点，泛泛而谈。"}, {"o": 3, "why": "井然有序=次序分明、条理清楚，描述的是“秩序”维度；经济循环要的是“通畅”（无阻碍），与“有条理”是两个概念。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "2023国考·副省级第21题；题干依联创世华考生回忆版，答案与解析依32xueyuan、易晋公考多机构解析交叉核对"}, {"q": "<div class=\"zl-q\">当前背景下，宏观调控既要“防风险”又要“稳增长”。传统的逆周期调节能够较好地应对经济的短期波动，面对国内外经济的长期结构性调整则常常____。这就要求宏观调控____，而跨周期调节正是在顶层设计的宏观调控框架下，促进不同政策工具的关联匹配，因此更能满足现阶段的调控要求。</div>", "opts": ["捉襟见肘 与时俱进", "左支右绌 另辟蹊径", "有心无力 推陈出新", "难以为继 统筹兼顾"], "ans": 1, "point": "成语辨析·语义轻重", "solve": "第一空：逆周期调节只是“不能很好地应对”长期结构性调整，远未到“无法再继续下去”的地步，“难以为继”程度过重，排除 D；“有心无力”侧重主观想办而能力不足，逆周期调节是客观机制失灵，排除 C。第二空：跨周期调节是在原有政策之外增加的新调节方式，“另辟蹊径”（另外开辟一条路）恰当；“与时俱进”体现不出增加新方式。", "key": "语义轻重第一关：语境只到“应付不过来”（左支右绌），没到“无法继续”（难以为继）——程度词先筛；第二空“跨周期=原有框架之外的新方式”→另辟蹊径。", "traps": [{"o": 3, "why": "难以为继=无法再继续下去，程度过重——文段只说逆周期调节面对长期结构性调整“常常应付不过来”，并未到机制失效、无法维持的程度。命题人用“语义递进”诱导考生选重词，是本题核心陷阱。"}, {"o": 0, "why": "捉襟见肘与左支右绌近义（都表应付不过来），陷阱在第二空：与时俱进=随时代发展而前进，体现不出“在既有框架外补充跨周期调节这一新路径”的动作。"}, {"o": 2, "why": "有心无力=主观想办而能力不足，主体应是“人”；宏观调控机制谈不上“有心”；推陈出新=去其糟粕取其精华，此处是“新增方式”而非“扬弃旧法”。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "2023国考·副省级第26题；题干依联创世华考生回忆版，答案与解析依32xueyuan真题解析（解析明确“难以为继程度过重”）"}, {"q": "<div class=\"zl-q\">地方政府要以民众利益、公共利益、国家利益为重，不能只追求短期利益，只追求政绩，而做出____的事情来，对官员的政绩考核、对政府的绩效评估，更要注重民生，注重社会的长远发展。这样才能从根本上避免破坏可持续发展大局、损害民众利益等“____”现象的继续发生。</div>", "opts": ["本末倒置 抱薪救火", "饮鸩止渴 掩耳盗铃", "扬汤止沸 移花接木", "竭泽而渔 杀鸡取卵"], "ans": 3, "point": "目的/结果/措施区分", "solve": "第一空对应“只追求短期利益、只追求政绩”——为眼前利益不计长远，成语“竭泽而渔”（排干水塘抓鱼，只顾眼前不留余地）恰合；“饮鸩止渴”“扬汤止沸”都指“用错误方法解决眼前困难”，文段说的是利益取向问题而非“解决困难”的方法问题。第二空“破坏可持续发展大局、损害民众利益”是只顾眼前的必然后果→“杀鸡取卵”（为取蛋而杀鸡，损害长远）；“抱薪救火”指方法错误反致祸患扩大，方向不同。", "key": "区分“措施”与“目的取向”：饮鸩止渴/扬汤止沸是“解决困难的方法错了”；文段是“只求眼前利益”的取向错了→竭泽而渔/杀鸡取卵（为眼前利毁长远）。", "traps": [{"o": 1, "why": "饮鸩止渴=用错误方法解决眼前的困难。文段强调“只追求短期利益”的取向错误，而非“解决困难”的措施错误——命题人用“方法/措施”类成语干扰“利益取向”类语境，是本题核心区分点。"}, {"o": 0, "why": "本末倒置=颠倒了事物的轻重主次，侧重“顺序错位”；抱薪救火=方法不当反使祸患扩大，与“损害长远利益”的后果指向不符。"}, {"o": 2, "why": "扬汤止沸=办法不对头、治标不治本，同属“措施错误”；移花接木=暗中更换事物，语义完全脱离“眼前利益损害长远”的语境。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "2023国考·副省级第29题；题干依联创世华考生回忆版，答案与解析依32xueyuan真题解析"}, {"q": "<div class=\"zl-q\">在气候变暖背景下，冰川是变化最快速、最显著和最具____的地理要素之一。过去50年来，由于气候变暖，全球冰川加速消融，造成海平面上升、水循环变化、冰川灾害增加，引发人们高度关注。应用科学方法，____冰川消融、保持水资源的可持续利用，在当前区域迅速增温、冰川快速退缩的情境下，显得尤为重要。</div>", "opts": ["指示性 缓解", "直观性 避免", "动态性 干预", "通用性 防止"], "ans": 0, "point": "实词辨析·程度与范围", "solve": "第一空：冰川消融加速能“显示、指明”气候变化→“指示性”（冰川是气候变化的指示器）。第二空：“避免/防止”都表示设法使某种情形不发生，但冰川消融是客观发生的气候过程，无法被阻止，只能“缓解”（减轻程度）；“干预”指过问介入，与减缓消融速度不搭。", "key": "程度把控：遇到“避免/防止”这类绝对化动词先问“能否做到”——冰川消融不可阻止，只能“缓解”；第一空“冰川消融→指示气候变化”→指示性。", "traps": [{"o": 1, "why": "避免=设法不使某种情形发生，语义过重——冰川消融已经发生且无法阻止，科学方法只能减缓速度。命题人用“绝对化动词”诱导考生，是本题核心陷阱。"}, {"o": 3, "why": "防止与避免同理，表意过重；且“通用性”无法体现冰川“反映气候变化特征”的指示功能，第一空即可排除。"}, {"o": 2, "why": "干预=过问别人的事或强行介入，搭配“冰川消融”这一自然过程不恰当，且体现不出“减缓消融速度”的动作。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "2023国考·副省级第30题；题干依联创世华考生回忆版，答案与解析依32xueyuan真题解析（解析明确“避免/防止”均不符合）"}, {"q": "<div class=\"zl-q\">当前，我国旅游市场的需求还在持续迸发，人民的旅游诉求也在不断升级。仅靠评级就想____的想法已经过时，口碑立身，品质说话才是景区吸引客源的正道。希望景区能摒弃____的心理，为游客营造更加舒心和放心的环境，为旅游行业发展带来更多正能量。</div>", "opts": ["一本万利 浑水摸鱼", "一步到位 好高骛远", "一劳永逸 急功近利", "一鸣惊人 投机取巧"], "ans": 2, "point": "成语辨析·拆分对应", "solve": "第一空拆字对应：“一劳永逸”=劳一次（评一次级）＋永逸（永远安逸、永远有效），正好对应“仅靠评级就想永远有效”的旧想法；“一步到位”=一次就达到预定目标，但“到位”≠“永远有效”，缺“永逸”的长时间维度。第二空“口碑立身、品质说话”的反面是急于求成→“急功近利”；“好高骛远”指脱离实际追求过高目标，语义不符。", "key": "成语拆分对应：“一劳永逸”拆成“劳一次＋永安逸”，逐词素对语境——评一次级=劳一次，永远有效=永逸；“一步到位”缺“永”的时间维度，即被拆穿。", "traps": [{"o": 1, "why": "一步到位=一次就达到预定目标，与“仅靠评级”表面吻合（评一次就到位），但丢失了“永逸”（长期有效）的时间维度——“一步”与“一劳”一字之差，是命题人设置的拆分对应陷阱。"}, {"o": 0, "why": "一本万利=本钱小利润大，文段未提“本钱、利润”，属无中生有；浑水摸鱼=趁混乱捞取利益，与“景区以品质立身”的语境不符。"}, {"o": 3, "why": "一鸣惊人=平时无表现、一下子做出惊人成绩，与“评级”这一持续动作无关；投机取巧=用不正当手段谋利，语义过重且无对应。"}], "src": "2021国考·副省级", "yr": 2021, "srcType": 2, "orig": "2021国考·副省级第26题；题干与解析依灵鹏教育真题汇编（答案C）"}, {"q": "<div class=\"zl-q\">代入感是作品引发受众认同的机制，故事人物的某些方面召唤读者将自己替换为主人公，从而____，与角色同呼吸共命运。代入感是长篇网络小说____的属性，由于网络小说连载时间长，读者容易中途放弃。因此，作品绑定读者，将单纯浏览转变为情感认同便十分重要。</div>", "opts": ["感同身受 不可或缺", "惺惺相惜 独一无二", "身临其境 与生俱来", "触景生情 与众不同"], "ans": 0, "point": "主体视角·角色对应", "solve": "第一空看主语身份：读者是“替换为主人公”的借位者、并非亲历者——“感同身受”（虽未亲身经历，感受却如同亲身经历）恰合借位者身份；“身临其境”要求“亲自到达那个环境”，读者始终是旁观者，主体错配。第二空“连载时间长、读者易中途放弃”→代入感是“缺了它不行”的属性→“不可或缺”；“独一无二”程度过重（并非只有长篇网络小说才有代入感）。", "key": "主体视角：横线主语是“读者（借位者）”——能“虽未亲历却感同身受”，不能“身临其境”（须亲历）；第二空“连载长→易弃读→缺它不行”→不可或缺。", "traps": [{"o": 2, "why": "身临其境=亲自到了那个环境。读者只是“将自己替换为主人公”的想象性代入，不是真的亲历——命题人用“亲历者”身份偷换“借位者”身份，是主体视角题的核心陷阱。"}, {"o": 1, "why": "惺惺相惜=性格、志趣相同的人互相爱护支持，要求双方是同类主体；读者与主人公并非“同类互惜”的关系，主语关系错配。"}, {"o": 3, "why": "触景生情=被眼前景物触动而感怀，对象是“景物”而非“人物角色”；且“与众不同”只表差异，与“连载时间长、需绑定读者”的原因逻辑不匹配。"}], "src": "2021国考·副省级", "yr": 2021, "srcType": 2, "orig": "2021国考·副省级第31题；题干与解析依灵鹏教育真题汇编（答案A）"}, {"q": "<div class=\"zl-q\">构建人类命运共同体是世界各国人民前途所在，____。只有各国行天下之大道，和睦相处、合作共赢，繁荣才能持久，安全才有保障。中国提出了全球发展倡议、全球安全倡议，愿同国际社会一道努力落实。中国坚持对话协商，推动建设一个持久和平的世界；坚持共建共享，推动建设一个普遍安全的世界……</div>", "opts": ["河海不择细流，故能就其深", "大道之行也，天下为公", "万物并育而不相害，道并行而不相悖", "芳林新叶催陈叶，流水前波让后波"], "ans": 2, "point": "语境对应·中心话题", "solve": "横线前后无直接对应词时回到全文中心：人类命运共同体→各国“和睦相处、合作共赢”（和谐共处、互不冲突）。“万物并育而不相害，道并行而不相悖”（万物一起生长互不妨害、各自运行互不冲突）正是“和谐共处”的经典表述。A“河海不择细流”讲汇聚细流成就深广（积累），B“大道之行，天下为公”讲天下公有（分配格局），D“芳林新叶催陈叶”讲新陈代换（革新），均偏离“并行不悖、和谐共处”的中心话题。", "key": "中心话题法：横线前后都无直接对应词时，回到全文中心——人类命运共同体=各国并行不悖、和谐共处；政治熟语“天下为公”最像，但重心在“公有”而非“共处”。", "traps": [{"o": 1, "why": "大道之行也，天下为公（天下是公共的）字面极具政治色彩、最易误选——但它讲的是“公有、公平”的治理理想，重心不在“各国并行共处”。命题人用政治熟语做中心话题干扰。"}, {"o": 0, "why": "河海不择细流，故能就其深=不拒绝细流才能成就深广，讲“包容、积累”，且“包容”是单向的；“和睦相处、合作共赢”是双边共处关系，重心不同。"}, {"o": 3, "why": "芳林新叶催陈叶，流水前波让后波=新事物代替旧事物，讲“新陈代换、革新”，与人类命运共同体的“共处共赢”话题完全无关，属话题偏移。"}], "src": "2023国考·副省级", "yr": 2023, "srcType": 2, "orig": "2023国考·副省级第36题；题干
