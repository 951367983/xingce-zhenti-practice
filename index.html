<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行测专项·判断推理真题化训练</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='2' fill='%231e3a5f'/%3E%3Cpath d='M5 8h9v2H5zm0 4h6v2H5z' fill='%23fff'/%3E%3Ccircle cx='16' cy='10' r='2.2' fill='%23f5a623'/%3E%3Cpath d='M15 14c0-2 2.2-2.6 3-1 1.2-2.2 1.5-1 2-1-1.5 2.5-1.5 4-1 6h-6c0-1.5-.2-2.7 2-4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--nav:#1e3a5f;--nav2:#16304f;--bg:#f4f6f9;--card:#fff;--line:#e4e9f0;--txt:#243342;--sub:#6b7a8c;--blue:#2f6fdb;--green:#1f9d72;--red:#d9534f;--orange:#f5a623;--chip:#eef2f8;--chipon:#2f6fdb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
.top{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:16px 20px 12px;position:sticky;top:0;z-index:50}
.top h1{font-size:19px;letter-spacing:1px}
.hd-sub{font-size:12.5px;color:#bcd0ea;margin-top:2px}
.navbar{display:flex;gap:8px;margin-top:12px}
.navbar .nt{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13.5px;cursor:pointer;background:rgba(255,255,255,.12);color:#dbe6f3}
.navbar .nt.on{background:#fff;color:var(--nav);font-weight:700}
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .bar{width:4px;height:16px;background:var(--blue);border-radius:2px;display:inline-block}
.sec-t{font-size:13px;color:var(--sub);margin:12px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:16px;background:var(--chip);font-size:12.5px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.sel{background:var(--chipon);color:#fff}
.btn{display:inline-block;padding:9px 20px;border-radius:8px;border:none;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;font-weight:600}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.ghost{background:transparent;border:1px solid #cfd8e3;color:var(--sub)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.count-tip{font-size:13px;color:var(--green);font-weight:600}
#quizView{display:none}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qbar .prog{flex:1;min-width:140px}
.qbar .lbl{font-size:13px;color:var(--sub)}
.timer{font-size:14px;font-weight:700;color:var(--nav)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.qmeta .tag{font-size:11.5px;background:#eef2f8;padding:3px 9px;border-radius:12px;color:#51627a}
.qmeta .tag.pt{background:#e7f0fe;color:var(--blue)}
.qbody{font-size:15px;line-height:1.9;padding:10px 4px}
.qbody .fig{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
.qbody svg{max-width:100%}
.opts{margin-top:8px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14.5px;cursor:pointer;margin-bottom:10px;line-height:1.7}
.opt:hover{border-color:var(--blue)}
.opt.pick{border-color:var(--blue);background:#f0f6ff}
.opt.correct{border-color:var(--green);background:#eafaf3}
.opt.wrong{border-color:var(--red);background:#fdf0ef}
.opt .o{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--chip);text-align:center;line-height:24px;font-size:13px;font-weight:700;margin-right:8px;vertical-align:1px}
.opt.correct .o{background:var(--green);color:#fff}
.opt.wrong .o{background:var(--red);color:#fff}
.opt.pick:not(.correct):not(.wrong) .o{background:var(--blue);color:#fff}
.qnav{display:flex;gap:10px;margin-top:6px}
.qnav .btn{flex:1}
.card h3{font-size:14px;margin:14px 0 8px;display:flex;gap:6px;align-items:center}
.card h3 .bar{width:4px;height:14px;background:var(--orange);border-radius:2px;display:inline-block}
.anl{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.9;margin-bottom:10px}
.anl b{color:var(--nav)}
.trap{border-left:3px solid var(--orange);background:#fff8ef;border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.8}
.trap .tw{color:var(--red);font-weight:700}
.orig{font-size:12px;color:var(--sub);background:#f1f5f9;border-radius:8px;padding:8px 12px;margin-top:10px;line-height:1.7}
.key{font-size:13px;background:#eef7f1;border-radius:8px;padding:9px 12px;margin-top:10px;line-height:1.8;color:#1c6b48}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f2f6fb;color:#3a4a5c}
.score-wrap{text-align:center;padding:20px 0}
.score-ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px;font-weight:800;color:#fff}
.hi{background:linear-gradient(135deg,#1f9d72,#2fbf8f)}
.mid{background:linear-gradient(135deg,#f5a623,#f7b955)}
.lo{background:linear-gradient(135deg,#d9534f,#e0706d)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.stat-box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat-box .v{font-size:22px;font-weight:800;color:var(--nav)}
.stat-box .k{font-size:12px;color:var(--sub);margin-top:2px}
.wrong-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.wrong-item .wq{font-size:13.5px;margin-bottom:6px}
.wrong-item .wr{font-size:12.5px;color:var(--sub)}
.wrong-item .wk-tip{float:right;font-size:12px;color:var(--blue);font-weight:400}
.wrong-item .wk-detail .badge{background:var(--blue-weak,#e8f0fe);color:var(--blue);padding:2px 8px;border-radius:6px;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e7f0fe;color:var(--blue);margin-right:6px}
.badge.y{background:#fff3e0;color:#b26a00}
.badge.g{background:#eafaf3;color:#1c6b48}
.placeholder{text-align:center;padding:40px 16px;color:var(--sub)}
.placeholder .big{font-size:34px;margin-bottom:10px}
@media(max-width:640px){.wrap{padding:10px 10px 50px}.opt{font-size:14px}}
.zl-mat{background:#f3f7fb;border:1px solid #d7e3f0;border-radius:8px;padding:8px;font-size:12.5px;line-height:1.75;color:#334;margin-bottom:8px}.zl-tb{border-collapse:collapse;margin:6px 0;width:100%;table-layout:fixed}.zl-tb th,.zl-tb td{border:1px solid #c9d8e8;padding:3px 4px;font-size:11.5px;text-align:center}.zl-tb th{background:#eaf1f9}.zl-q{font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div class="top">
  <h1>行测专项 · 真题化训练</h1>
  <div class="hd-sub" id="hdSub">判断推理 · 河南省考+事业单位联考真题 · 每错项逐条拆解命题人陷阱</div>
  <div class="navbar">
    <div class="nt on" data-m="pd" onclick="setMod('pd')">判断推理</div>
    <div class="nt" data-m="sl" onclick="setMod('sl')">数量关系</div>
    <div class="nt" data-m="zl" onclick="setMod('zl')">资料分析</div>
    <div class="nt" data-m="yy" onclick="setMod('yy')">言语理解</div>
  </div>
</div>
<div class="wrap" id="setupView">
  <div class="card">
    <h2><span class="bar"></span>练习设置</h2>
    <div class="sec-t">真题来源（可多选）</div>
    <div class="chips" id="srcChips"></div>
    <div class="sec-t">年份（可多选，2016-2026）</div>
    <div class="chips" id="yrChips"></div>
    <div class="sec-t">每组题量</div>
    <div class="chips" id="cntChips"></div>
  </div>
  <div class="card">
    <h2><span class="bar"></span>考点筛选（<span id="ptCount"></span> 个考点）</h2>
    <div class="chips" id="ptChips"></div>
    <div class="row" style="margin-top:14px">
      <span class="count-tip" id="tip">已选全部考点</span>
      <span style="flex:1"></span>
      <button class="btn g" onclick="selAllPt()">全选考点</button>
      <button class="btn g" onclick="clrPt()">清空考点</button>
    </div>
    <div style="margin-top:12px"><button class="btn" id="startBtn" onclick="startQuiz()">开始练习</button></div>
  </div>
  <div class="card">
    <h2><span class="bar"></span>命题人视角 · 判断推理干扰项设计规律（做题前必读）</h2>
    <div id="methodCard"></div>
  </div>
  <div class="card">
    <h2><span class="bar"></span>学习统计</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="view('st')">按年份统计</button>
      <button class="btn" onclick="view('pt')">考点图谱</button>
      <button class="btn" onclick="view('wk')">错题本</button>
    </div>
  </div>
</div>

<div class="wrap" id="quizView" style="display:none">
  <div class="card">
    <div class="qbar">
      <span class="lbl" id="qIdx">第 1 题</span>
      <div class="prog" style="height:8px;background:#e8edf4;border-radius:4px;overflow:hidden"><div id="qProg" style="width:0%;height:100%;background:var(--blue);transition:width .3s"></div></div>
      <span class="timer" id="timer">00:00</span>
      <button class="btn ghost" style="padding:6px 12px;font-size:12.5px" onclick="toggleUnc()">不确定</button>
      <button class="btn ghost" style="padding:6px 12px;font-size:12.5px" onclick="quitQuiz()">退出</button>
    </div>
    <div class="qmeta" id="qMeta"></div>
    <div class="qbody" id="qBody"></div>
    <div class="opts" id="qOpts"></div>
    <div class="qnav" id="qNav"></div>
  </div>
</div>

<div class="wrap" id="resView" style="display:none">
  <div class="card" id="resCard"></div>
</div>

<div class="wrap" id="ptView" style="display:none">
  <div class="card" id="ptCard"></div>
</div>

<div class="wrap" id="stView" style="display:none">
  <div class="card" id="stCard"></div>
</div>

<div class="wrap" id="wkView" style="display:none">
  <div class="card" id="wkCard"></div>
</div>

<script>
/* ============================================================
 * 题库结构：q 题干（可含内联 SVG），opts 四选项，ans 正确项索引，
 *      point 主考点，solve 解析，traps [{o,why}]（错误项陷阱拆解），
 *      key 解题关键，src 来源，yr 年份，srcType 卷别（河南省考/事业单位联考），orig 出处核验
 * ============================================================ */
const QB=[
/* ===== 图形推理 ===== */
{q:'从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：<div class="fig"><div style="text-align:center"><div>题干</div><svg width="150" height="34" viewBox="0 0 300 68"><g font-size="30" font-family="Arial" text-anchor="middle"><text x="30" y="34" font-weight="bold">B</text><text x="90" y="34">E</text><text x="150" y="34">H</text><text x="240" y="34" font-weight="bold">L</text><text x="280" y="34">?</text></g></svg></div><div style="text-align:center;margin-top:6px">选项</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><svg width="60" height="34" viewBox="0 0 120 68"><text x="60" y="34" font-size="30" font-family="Arial" text-anchor="middle">O</text></svg><svg width="60" height="34" viewBox="0 0 120 68"><text x="60" y="34" font-size="30" font-family="Arial" text-anchor="middle">P</text></svg><svg width="60" height="34" viewBox="0 0 120 68"><text x="60" y="34" font-size="30" font-family="Arial" text-anchor="middle">Q</text></svg><svg width="60" height="34" viewBox="0 0 120 68"><text x="60" y="34" font-size="30" font-family="Arial" text-anchor="middle">R</text></svg></div></div>',
opts:['<div style="text-align:center">O</div>','<div style="text-align:center">P</div>','<div style="text-align:center">Q</div>','<div style="text-align:center">R</div>'],
ans:0,point:"图形·数量类（点线）",
solve:'两段式：第一组 B→E→H 按字母表间隔 2 个字母（B、E、H 之间各隔 2 个字母）；第二组 L 间隔 2 个字母后为 O。另可验证交点数量：第一组字母交点数为 4、3、2 等差递减，第二组为 2、1、？，问号处应 0 个交点，O 无交点，两法同得答案 O。',
key:'字母图形题双解法锁定：字母间隔（主规律）+ 交点数量递减（验证规律），两条规律指向同一答案时基本可确定。',
traps:[{o:1,why:'P 与 L 之间隔 3 个字母、与 O 相邻，选 P 是只看“字母越来越靠后”而忽视固定间隔，属“规律识别不全”陷阱。'},{o:2,why:'Q 更靠后，诱使考生认为“继续按字母表顺序走”，实则第二组起点 L 与第一组起点 B 位置不同，按顺序走就错——典型的“机械类比、忽视组间差异”干扰。'},{o:3,why:'R 与 Q 同理强化“顺延字母表”的错误路径；同时 R 含 1 个交点，若按交点规律也无法满足 0 交点，双线出局。'}],key:"字母间隔（间隔2个）+交点数为0",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：<div class="fig"><div style="text-align:center"><div>题干（第一组）</div><div style="display:flex;gap:12px;justify-content:center"><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">奋</text></svg><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">战</text></svg><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">占</text></svg></div></div><div style="text-align:center;margin-top:6px">题干（第二组）</div><div style="display:flex;gap:12px;justify-content:center"><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">会</text></svg><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">坛</text></svg><svg width="70" height="40" viewBox="0 0 70 40"><text x="0" y="30" font-size="30" font-family="SimSun">?</text></svg></div></div><div style="text-align:center;margin-top:6px">选项</div><div style="display:flex;gap:10px;justify-content:center"><svg width="60" height="40" viewBox="0 0 60 40"><text x="0" y="30" font-size="30" font-family="SimSun">运</text></svg><svg width="60" height="40" viewBox="0 0 60 40"><text x="0" y="30" font-size="30" font-family="SimSun">动</text></svg><svg width="60" height="40" viewBox="0 0 60 40"><text x="0" y="30" font-size="30" font-family="SimSun">芸</text></svg><svg width="60" height="40" viewBox="0 0 60 40"><text x="0" y="30" font-size="30" font-family="SimSun">尝</text></svg></div>',
opts:['<div style="text-align:center">运</div>','<div style="text-align:center">动</div>','<div style="text-align:center">芸</div>','<div style="text-align:center">尝</div>'],
ans:2,point:"图形·样式类（运算/求同）",
solve:'两段式汉字求同：第一组“奋、战、占”均含共同部件“占”；第二组“会、坛、？”应均含共同部件“云”，四个选项中只有“芸”含“云”。',
key:'汉字图形题优先找共同偏旁/部件（求同规律），再比对选项是否精确含有该部件。',
traps:[{o:0,why:'“运”含“云”但带“辶”，命题人故意用“云＋辶”做近似干扰——考生若只看“有点像”不看部件完全一致就会中招，属“部件近似偷换”。'},{o:1,why:'“动”含“云”的变形却非“云”字本身，强化“形近即对”的错觉，考察考生对求同对象是否精确锁定。'},{o:3,why:'“尝”与第二组前两字同为上下/左右结构风格相近，命题人用结构相似性干扰，诱使考生放弃部件比对转而看整体风格。'}],key:"汉字部件求同（云）",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），文字部件经格木教育解析核对"},

{q:'从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：<div class="fig"><div style="text-align:center"><div>题干</div><svg width="320" height="56" viewBox="0 0 640 112"><g fill="none" stroke="#000" stroke-width="2"><polygon points="40,90 90,20 140,90"/><polygon points="210,90 260,20 310,90"/><polygon points="380,90 430,20 480,90"/><polygon points="550,90 600,20 650,90"/></g></svg></div><div style="text-align:center;margin-top:6px">选项</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><svg width="150" height="56" viewBox="0 0 150 112"><g fill="none" stroke="#000" stroke-width="2"><polygon points="40,90 90,10 140,90"/><polygon points="60,20 80,20 80,40 60,40"/><polygon points="100,20 120,20 120,40 100,40"/></g></svg><svg width="150" height="56" viewBox="0 0 150 112"><g fill="none" stroke="#000" stroke-width="2"><polygon points="40,90 90,20 140,90"/><polygon points="40,40 70,40 70,70 40,70"/><polygon points="100,30 130,30 130,60 100,60"/></g></svg><svg width="150" height="56" viewBox="0 0 150 112"><g fill="none" stroke="#000" stroke-width="2"><polygon points="40,90 90,30 140,90"/><polygon points="55,40 80,40 80,65 55,65"/><polygon points="85,55 110,55 110,80 85,80"/></g></svg><svg width="150" height="56" viewBox="0 0 150 112"><g fill="none" stroke="#000" stroke-width="2"><polygon points="40,90 90,20 140,90"/><polygon points="30,60 60,60 60,85 30,85"/><polygon points="80,25 110,25 110,50 80,50"/></g></svg></div></div>',

ans:0,point:"图形·位置类（平移旋转）",
solve:'题干图形由“开口框+虚线+横线”三部分组成（位置类复合）：①开口框每次顺时针旋转 90°；②虚线部分在外圈顺时针每次移动一格；③横线部分每次向上平移一步、到顶循环。按三重规律，问号处开口框开口朝上、虚线回原位、横线位于中上部，A 项符合。',

ans:0,point:"类比·外延关系（全同/种属/组成）",
solve:'“汉字”是“文字”的一种，种属关系。A 项“矿工”是“工人”的一种，种属关系，一致。B/C 项恒星是宇宙的组成部分、北京是中国的组成部分，均为组成关系；D 项是依据关系。',
key:'种属 vs 组成辨析：种属=一个“是”另一个（矿工是工人）；组成=一个“是另一个的一部分”（恒星是宇宙的一部分）。用“A 是 B 吗？”造句验证。',
traps:[{o:1,why:'B 项“恒星是宇宙的组成部分”，命题人用“包含”表象混淆组成与种属——考生造句“恒星是宇宙”读不通就该排除，但凭直觉易中招。'},{o:2,why:'C 项“北京是中国的一部分”同样是组成关系，命题人用“整体-局部”的常识性关系做双保险干扰，强化“只看到关联性、不分关系类型”的错误。'},{o:3,why:'D 项概念是判断的依据，对应关系；命题人用抽象词对制造“概念类题目都难分”的心理压力，诱导考生放弃造句验证。'}],key:"种属关系造句验证",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'前因后果 : 因果，与题干逻辑关系一致的是：',
opts:['内忧外患 : 忧患','南征北战 : 征战','有始无终 : 始终','左顾右盼 : 顾盼'],
ans:2,point:"类比·内涵关系（因果/顺承/对应）",
solve:'题干两词为对应关系，且“因”在前“果”在后，是时间顺承。C 项“有始无终”与“始终”对应，且“始”在前“终”在后，时间顺承，一致。A/B/D 项中忧患、征战、顾盼均为近义并列，无先后顺承。',
key:'成语类类比先拆词素再看关系：题干“因→果”有先后，选项要找同样“前词素先发生、后词素后发生”的。',
traps:[{o:0,why:'A 项“内忧外患”与“忧患”虽对应，但“忧”与“患”同义并列，无先后；命题人用“都有对应关系”的表面相似诱导，考的是顺承这一深层限定。'},{o:1,why:'B 项“南征北战”的“征”“战”近义并列，同样缺先后；命题人用“动作类成语”抱团干扰，让考生误以为同类就对。'},{o:3,why:'D 项“左顾右盼”的“顾”“盼”都是“看”义，近义并列；命题人用“左右结构”的外形相似诱导，忽视语义层级。'}],key:"词素时间顺承",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

ans:1,point:"类比·内涵关系（属性/功能/材料）",
solve:'飞机可以停放在机库，也可以在机场起降，是地点对应关系；且“飞机”是人造无生命物体。B 项药品可放入药盒，也可放入药箱，地点对应，且药品是人造无生命物体，一致。',
key:'三词类比先看两两关系再补共同点：本题“同一物体+两个存放地点”，同时注意“人造物”属性一致性。',
traps:[{o:0,why:'A 项桌椅包含课桌、桌面是课桌的一部分，均为组成/包含关系而非地点对应；命题人用“家具类名词”抱团干扰。'},{o:2,why:'C 项乘客与客车、车站虽是地点对应，但乘客是“有生命的人”，与题干“人造无生命物体”属性不一致；命题人用地点关系对但属性错的方式设陷。'},{o:3,why:'D 项车轮、车轴都是汽车的组成部分，组成关系；命题人用“交通工具部件”的常识诱导，考关系类型辨析。'}],key:"地点对应+人造物属性",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

ans:3,point:"类比·内涵关系（因果/顺承/对应）",
solve:'题干“风吹→草低→见牛羊”构成连续因果关系链。D 项“雨淋→花落→闻余香”同样是三词连续因果，一致。',
key:'三词连续因果：前因后果层层递进。逐词检查“后一动作是否是前一动作的结果”。',
traps:[{o:0,why:'A 项“浪打→船摇”是因果，但“靠舵手”是应对动作而非结果，因果链断裂；命题人用“前半段因果对”做半截陷阱。'},{o:1,why:'B 项“光照→叶肥”是因果，但“叶肥”不是“促生长”的原因而是目标；命题人用“农业类场景”抱团干扰，考链条完整性。'},{o:2,why:'C 项“游人如织”是比喻状态而非因果；命题人用“四字画面感”诱导，让考生凭意境而非逻辑选择。'}],key:"连续因果链",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

opts:['桌布 : 防污 : 桌子','鼠标 : 操作 : 电脑','桌垫 : 美观 : 桌椅','茶水 : 解渴 : 茶杯'],
ans:0,point:"类比·内涵关系（属性/功能/材料）",
solve:'窗帘有遮光功能（功能对应），且挂在窗户上（对象/位置对应），“遮光”有阻挡、防止倾向。A 项桌布有防污功能、铺在桌子上，防污同样有阻挡防止倾向，完全一致。',
key:'三层对应都要对：功能对应 + 对象/位置对应 + 功能词的语义倾向（阻挡/防止类）一致。',
traps:[{o:1,why:'B 项鼠标功能是操作电脑，但“操作”无阻挡/防止倾向，且鼠标与电脑是配套使用而非挂载关系；命题人用“电子产品对应”的现代感干扰。'},{o:2,why:'C 项桌垫让桌椅美观，但“美观”是修饰性结果而非功能防挡类；命题人用“桌类物品”抱团，考功能词属性辨析。'},{o:3,why:'D 项茶水在茶杯里是地点对应，且“解渴”不是防挡类功能；命题人用“日常用品+功能”的表面组合诱导。'}],key:"功能+对象+语义倾向三重对应",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

solve:'政治家、文学家、思想家三者两两交叉：有的政治家是文学家、有的文学家是思想家……C 项科幻片、纪录片、故事片也是两两交叉（科幻片可为纪录片形式、纪录片可为故事片），一致。',

opts:['机械工业 : 智能工业 : 工业','纺织产业 : 物流产业 : 产业','公共交通 : 城市交通 : 交通','商品住房 : 保障住房 : 住房'],
ans:0,point:"类比·外延关系（并列/交叉）",
solve:'信息科技与生物科技是交叉关系（如生物信息科技），二者分别与“科技”是种属关系。A 项机械工业与智能工业交叉（智能制造属机械也属智能），分别与工业构成种属，一致。',
key:'交叉+种属复合结构：先验证前两词交叉，再验证各自与第三词是“A 是 B”的种属关系。',
traps:[{o:1,why:'B 项纺织产业与物流产业基本并列（极少交叉），命题人用“产业词”抱团，考考生是否真正验证交叉关系。'},{o:2,why:'C 项公共交通是城市交通的重要组成部分，是组成而非交叉；命题人用“交通”词族诱导，考种属/组成之辨。'},{o:3,why:'D 项商品住房与保障住房是并列（按性质划分），命题人用“住房分类”常识做干扰，与题干交叉结构不符。'}],key:"交叉+种属复合",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'中国制造 : 制造，与题干逻辑关系一致的是：',
opts:['长篇小说 : 小说','自我批评 : 批评','深度学习 : 学习','体育锻炼 : 锻炼'],
ans:1,point:"类比·外延关系（全同/种属/组成）",
solve:'“中国制造”是“制造”的一种（种属），且“中国制造”为主谓结构（中国+制造），“智能化中国制造”为偏正结构。B 项“自我批评”是“批评”的一种，且“自我批评”为主谓结构、“剖析式自我批评”为偏正结构，完全一致。',
key:'种属关系之外还要看“结构”：题干后词可加修饰形成偏正，且题干前词是主谓结构——结构与词性双一致才算对。',
traps:[{o:0,why:'A 项“长篇小说”是“小说”的一种，但“中长篇科幻小说”与“长篇小说”是全异而非种属；命题人用“种属部分对”做半截陷阱。'},{o:2,why:'C 项“深度学习”是“学习”的一种，但“深度学习”是偏正结构而非主谓结构；命题人用“热词”诱导考生放弃结构验证。'},{o:3,why:'D 项“体育锻炼”是“锻炼”的一种，但“体育锻炼”是偏正结构（体育+锻炼），且“有意识体育锻炼”仍为偏正，结构不符合。'}],key:"种属+主谓/偏正结构",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'（ ）对于 主演 相当于 顾客 对于（ ），填入括号最恰当的是：',
opts:['配角；消费者','主角；主顾','男主角；客户','导演；店主'],
ans:1,point:"类比·外延关系（全同/种属/组成）",
solve:'代入验证：B 项“主角”与“主演”是全同关系，“顾客”与“主顾”也是全同关系，前后一致。',
key:'代入型类比：逐项把选项代入，验证前后两组关系是否同一类型（本题均为全同）。',
traps:[{o:0,why:'A 项配角与主演是并列、消费者包含于顾客是种属，前后关系不一致；命题人用“角色/人群”双场景干扰。'},{o:2,why:'C 项男主角是主演的一种（种属）、客户与顾客近似但非严格全同；命题人用“近似全同”做模糊干扰，考考生对全同关系界定的严谨度。'},{o:3,why:'D 项导演指导主演是主宾、店主招待顾客也是主宾，但顺序颠倒且主语宾语对应错位；命题人用“动词+对象”的表面相似设陷。'}],key:"代入验证同类型关系",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'（ ）对于 专业课 相当于 进行曲 对于（ ），填入括号最恰当的是：',
opts:['公共课；交响曲','网络课；独奏曲','考试课；古筝曲','选修课；前奏曲'],
ans:3,point:"类比·外延关系（并列/交叉）",
solve:'D 项“专业课”与“选修课”是交叉关系（有的专业课是选修课），“前奏曲”与“交响曲”也是交叉关系（交响曲可有前奏曲形式），前后一致。',
key:'代入型交叉关系：验证前后两组是否都是“有的 A 是 B”的双向交叉。',
traps:[{o:0,why:'A 项专业课与公共课是并列、进行曲与交响曲是交叉，关系类型不一致；命题人用“课程/音乐”双场景做表面干扰。'},{o:1,why:'B 项专业课与网络课交叉、独奏曲与交响曲并列，前后颠倒；命题人用“交叉放在一边”诱导考生只验证一半。'},{o:2,why:'C 项考试课与专业课交叉、古筝曲与交响曲基本无交叉（不同乐器类型），后者关系不成立；命题人用“乐曲词族”诱导。'}],key:"代入验证交叉关系",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'引擎 : 发动机，与题干逻辑关系一致的是：',
opts:['番茄 : 西红柿','灯塔 : 航行','钢琴 : 乐谱','明月 : 夜晚'],
ans:0,point:"类比·外延关系（全同/种属/组成）",
solve:'“引擎”就是“发动机”，二者全同关系。A 项“番茄”就是“西红柿”，全同，一致。',
key:'全同关系=同一事物两种叫法。用“A 就是 B、B 就是 A”双向验证。',
traps:[{o:1,why:'B 项灯塔是用于指引航行的建筑物，功能/目的对应而非全同；命题人用“航海场景”诱导，考关系类型。'},{o:2,why:'C 项钢琴是乐器、乐谱是记录音乐的符号，对应关系；命题人用“音乐领域名词”抱团干扰。'},{o:3,why:'D 项明月出现在夜晚，地点/时间对应；命题人用“诗意组合”诱导考生凭意境选择。'}],key:"全同关系双向验证",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'包罗 : 万象，与题干逻辑关系一致的是：',
opts:['驱逐 : 出境','鲜花 : 开放','月光 : 朦胧','歌唱 : 祖国'],
ans:3,point:"类比·语义/语法（近反义/主谓动宾）",
solve:'“包罗”是动词，“万象”是动作涵盖的对象，动宾关系。D 项“歌唱”是动词、“祖国”是歌唱的对象，动宾，一致。',
key:'动宾关系=动词+宾语。先判断题干前词词性为动词，再看后词能否作其宾语。',
traps:[{o:0,why:'A 项“驱逐”是动词，但“出境”是动作的结果状态而非被涵盖的对象；命题人用“动词+动作结果”偷换“动词+对象”。'},{o:1,why:'B 项“鲜花开放”是主谓关系（鲜花是主语）；命题人把“动词在后”的主谓结构做镜像干扰，与题干的动词在前恰好相反。'},{o:2,why:'C 项“月光朦胧”是主谓/偏正描述（朦胧修饰月光），前词是名词；命题人用“形容词+名词”的诗意组合诱导。'}],key:"动宾关系（动词+宾语）",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

/* ===== 逻辑判断 ===== */
{q:'某地烧烤曾爆火。近日有媒体称该地烧烤“凉了”，依据有三：①客流量下降；②一些烧烤店开始转让门面；③网络搜索热度大不如前。以下哪项如果为真，最能质疑上述“凉了”的说法？①据调查，该地烧烤客流只是从“爆火”回归到正常水平；②烧烤店转让门面在当地是常态，旺季前均有店铺更替；③网络搜索热度与真实消费并不完全相关；④该地烧烤爆火曾显著带动当地餐饮就业。',
opts:['仅①②','仅②③','①②③','①②④'],
ans:2,point:"逻辑·削弱论证",
solve:'论点：某地烧烤“凉了”；论据：客流量下降、店面转让、搜索热度下降。①②分别说明客流回归常态、转让是常态，直接否定论据的“凉”含义；③切断搜索热度与真实消费的联系；均可削弱。④讲的是爆火的影响，与“凉没凉”无关。故①②③均可。',
key:'削弱论证逐条判定：能说明“论据不成立”或“论据推不出论点”的都算；与论点无关的（④）排除。',
traps:[{o:0,why:'A 项漏掉③：③切断“搜索热度下降→凉了”的逻辑链，是标准拆桥削弱；考生若只认直接否定论据、忽视拆桥就会漏选。'},{o:1,why:'B 项漏掉①：①直接说明客流是“回归常态”而非“凉了”，是最直接的削弱；命题人用“②③更容易识别”诱导考生只认这两项。'},{o:3,why:'D 项把无关的④混入：④是爆火的积极影响，与论点“凉没凉”无因果关系；命题人用“热点话题相关”做干扰，测试论题一致性。'}],key:"逐条判定削弱项",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'某高校图书馆数据显示，文学类书籍的借阅量大大超过科技类书籍。据此有人认为，文学类书籍的受欢迎程度高于科技类书籍。以下哪项如果为真，最能削弱上述论证？',
opts:['科技类书籍的学习难度普遍较大','该校图书馆馆藏中文学类书籍占一半以上','该校就读文科类专业的学生比例较高','该校法律、哲学类书籍也很受欢迎'],
ans:1,point:"逻辑·削弱论证",
solve:'论点：文学类书籍更受欢迎；论据：借阅量更大。B 项指出文学类书籍馆藏占一半以上，借阅量高可能因馆藏量大所致，削弱“借阅量=受欢迎”的因果联系。',
key:'“基数陷阱”削弱：借阅量大可能因为藏书多、读者基数大，不能直接推出受欢迎。抓住“数据背后另有解释”。',
traps:[{o:0,why:'A 项科技类难度大与“受欢迎程度”无关，属论题不一致；命题人用“学习难度”的相关性诱导考生联想借阅少的理由。'},{o:2,why:'C 项文科学生比例高只说明阅读群体构成，未直接回应“文学类更受欢迎”的结论，是无关项；命题人用“人群基数”做表面相关干扰。'},{o:3,why:'D 项其他类书籍也受欢迎与论点无关，转移话题；命题人用“补充性信息”诱导考生误当加强/削弱。'}],key:"基数/馆藏量削弱",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'最新研究发现，环境因素如肠道微生物代谢产物会破坏人类产生多巴胺的神经元，导致类似帕金森病的症状出现。研究人员据此认为，潜在的环境因素是帕金森病的诱因之一。以下哪项如果为真，最能支持上述结论？',
opts:['帕金森病确实是一种慢性的神经退行性疾病','帕金森病患者的肠道微生物组环境与健康人存在显著差异','该研究为开发治疗帕金森病的新疗法提供了思路','杀虫剂和工业化学物质被怀疑是潜在的环境因素'],
ans:1,point:"逻辑·加强论证",
solve:'论点：环境因素是帕金森病诱因之一；论据：肠道微生物代谢产物可破坏多巴胺神经元。B 项患者肠道微生物环境与健康人不同，补充新论据支持“肠道环境与帕金森病相关”，加强。',
key:'加强题先看论据与论点的跳跃点：题干用“微生物代谢产物→神经元破坏”，B 项补上“患者与健康人微生物环境不同”这一环。',
traps:[{o:0,why:'A 项只说明帕金森病是退行性疾病，未涉及环境因素，论题不一致；命题人用“疾病常识”诱导考生误当背景支持。'},{o:2,why:'C 项“提供新疗法思路”是研究意义而非对论点的支持，属无关项；命题人用“研究价值”诱导考生忽略论证关系。'},{o:3,why:'D 项“被怀疑”是不确定表述，且未与论据形成关联，是不明确项；命题人用“疑似因素”测试考生对确定性程度的判断。'}],key:"补充新论据加强",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'中国研究人员在珠峰北坡利用探地雷达，沿海拔 7000 米以上山脊设置 26 个测量点采集数据，据此认为珠峰顶部积雪比以前认为的深得多，平均达 9.5 米。以下哪项如果为真，最能支持上述结论？',
opts:['测量点所在的山脊相对平坦，便于雷达作业','26 个测量点的数据均显示积雪深度在 9.5 米左右','测量过程采用了国际通用的雷达数据处理方法','探地雷达能够准确确定雪层与岩石的边界'],
ans:3,point:"逻辑·加强论证",
solve:'论点：珠峰顶部积雪深达 9.5 米；论据：探地雷达 26 个测量点数据。D 项“雷达能准确确定雪与岩石边界”是测量方法有效的前提，缺少它整个结论不成立——补充前提的加强力度最强。',
key:'加强力度排序：补充前提＞建立联系＞补充论据。题干是“仪器测量”结论，仪器准确性是隐藏前提，必须优先补。',
traps:[{o:0,why:'A 项山脊平坦只说明作业条件好，与积雪深度无关，是无关项；命题人用“测量便利”的常识诱导。'},{o:1,why:'B 项 26 个点数据一致是补充论据，有加强作用但力度不如前提；命题人故意让补充论据项与前提项并存，测试力度排序。'},{o:2,why:'C 项采用国际通用方法只是方法规范，未直接保证测量结果准确；命题人用“方法权威”诱导考生误当强支持。'}],key:"补充前提力度最强",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'甲国许多大豆种植者计划停止种大豆改种棉花。据此有人认为，至少在未来几年内，棉花价格的高涨将大幅提高棉花种植者的收入。以下哪项如果为真，最能削弱上述观点？',
opts:['大豆种植成本不断增加，种植者更可能改种棉花','很少有消费者愿意为棉织品支付更高的价格','棉花需求量并未增加，而种植面积增加将导致棉花价格回落','价格低廉的杀虫剂能有效杀死棉花害虫，降低种植成本'],
ans:2,point:"逻辑·削弱论证",
solve:'论点：棉花涨价→种植者收入大幅提高；论据：改种棉花的人多了。C 项指出需求未增而供给增加，棉花价格不会高涨，切断“改种→涨价→增收”的逻辑链，削弱。',
key:'拆桥削弱：找到“论据到论点”的中间环节（供给增加→价格下跌），指出其不成立。',
traps:[{o:0,why:'A 项大豆成本增加说明改种棉花更可能，反而加强论点；命题人用“反方向选项”测试考生是否先判断方向。'},{o:1,why:'B 项“很少消费者愿付高价”对棉花价格影响不明确，是不明确项；命题人用“消费者意愿”的表面相关诱导。'},{o:3,why:'D 项降低成本会增加供给进而压价，方向也偏削弱但不如 C 直接；命题人用“两削弱项并存”测试力度比较，C 是切断关键链条。'}],key:"拆桥：供给增→价格跌",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'某单位要从甲、乙、丙、丁、戊、己、庚 7 人中选 8 名（分两组：第一组 3 人、第二组 4 人）参加活动。已知：①甲和丙不能在同一个小组；②如果乙在第一组，则丁在第一组；③如果戊在第一组，则丙在第二组；④己在第二组；⑤丙、戊在同一组。以下哪项不可能为真？',
opts:['甲和乙同时在第一组','甲和丁同时在第一组','丙和庚同时在第二组','乙和庚在同一组'],
ans:3,point:"逻辑·分析推理",
solve:'由③⑤：若戊在第一组→丙在第二组，但丙戊须同组，矛盾，故戊在第二组、丙也在第二组；加上④己在第二组，第二组已有 3 人。由①甲不在第二组（与丙同组）→甲在第一组。第二组只剩 1 个名额给乙/丁/庚之一。D 项：若乙、庚同在第一组，由②乙→丁也在第一组，第一组将达 4 人，违背“第一组 3 人”；若同在第二组，第二组将达 5 人，违背“第二组 4 人”。故乙庚不可能同组。',
key:'分析推理先“翻译条件+找矛盾突破口”：③⑤直接推出戊丙在第二组，再逐项用人数限制检验。',
traps:[{o:0,why:'A 项甲已锁定第一组，乙也可在第一组（只要丁同组），不违背人数限制；命题人用“乙丁捆绑”诱导考生误以为乙必须跟丁一组。'},{o:1,why:'B 项甲丁同在第一组不违背任何条件；命题人用“②的充分条件”做反向干扰——考生若把“乙→丁”误读为“丁→乙”就会误判。'},{o:2,why:'C 项丙在第二组，庚可在第二组填满第 4 人；命题人用“庚是游离变量”制造不确定性，诱导考生不敢确定。'}],key:"翻译+人数限制排除",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'当前地球上近一半的开花植物受灭绝威胁，数量超 10 万种，而 90% 的药物来自植物。有人据此认为，人类可能会失去大多数药物来源。以下哪项如果为真，最能质疑上述观点？',
opts:['动物和真菌也是重要的药物来源','植物灭绝速度远快于动物灭绝速度','受威胁的开花植物仅占地球上所有植物的一小部分','植物灭绝的主要原因是栖息地破坏'],
ans:2,point:"逻辑·削弱论证",
solve:'论点：人类会失去大多数药物来源；论据：近一半开花植物受威胁、90% 药物来自植物。C 项指出受威胁植物仅占全部植物的一小部分，削弱论据——受威胁比例被夸大，人类不会失去大多数药物来源。',
key:'削弱论据：直接指出论据本身不成立或程度被夸大。“近一半开花植物”与“仅占全部植物一小部分”形成对比，精准拆解。',
traps:[{o:0,why:'A 项动物真菌也是来源，只说明来源多元，未直接否定“会失去大多数”，是不明确项；命题人用“来源补充”诱导。'},{o:1,why:'B 项植物灭绝快于动物，反而强化威胁，是加强项；命题人用“反向选项”测试方向判断。'},{o:3,why:'D 项解释灭绝原因，与“是否失去药物来源”无关；命题人用“归因信息”诱导考生误当削弱。'}],key:"削弱论据（比例夸大）",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'某部门要选派赵、钱、孙、李、周参加培训，条件如下：①赵或李至少去一人；②如果李去，则周去；③如果钱去，则孙去；④如果钱不去，则赵不去；⑤孙不去。据此可以推出：',
opts:['赵不去，李去，周去','赵去，李不去，周去','钱去，孙不去，周去','赵不去，李不去，周不去'],
ans:0,point:"逻辑·翻译推理",
solve:'翻译：①赵∨李；②李→周；③钱→孙；④¬钱→¬赵；⑤¬孙。由⑤对③否后→¬钱；由¬钱对④肯前→¬赵；由¬赵对①否一推一→李；由李对②肯前→周。故赵不去、李去、周去，选 A。',
key:'翻译推理链条：否后必否前→肯前必肯前→否定肯定式。按“⑤→③→④→①→②”顺序逐环推出。',
traps:[{o:1,why:'B 项“赵去李不去”违背①的否定肯定式：赵不去才能推出李去，命题人用“选言命题方向颠倒”设陷。'},{o:2,why:'C 项“钱去”直接违背由⑤否后推出的¬钱；命题人测试考生是否牢记“否后必否前”的顺序。'},{o:3,why:'D 项“周不去”与由②推出的周去矛盾；命题人用“全否定”收尾选项测试推理完整性。'}],key:"否后否前+否定肯定式",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"题干依 2024 年河南省考《行测》真题卷，答案经华图教育解析核对"},

{q:'有研究显示，随着网约车使用成本的下降，用户购车的积极性在下降。据此可以推出：',
opts:['网约车在一定程度上替代了用户对乘用车的需求','私家车在便捷性、安全性、私密性方面具有明显优势','用户购车时主要看重车辆的保值率','网约车使用成本上升时，用户会更倾向于购买私家车'],
ans:0,point:"逻辑·归纳推理",
solve:'题干：网约车使用成本下降→用户购车积极性下降。A 项“网约车替代了部分乘用车需求”正是题干现象的直接推论。D 项成本上升→更倾向购车是题干的逆否方向引申，也可推出；但本题为选非题时选 B（题干未涉及私家车优势）。按选是题：A 最直接。原题为归纳推理选非题，答案 B——本题按选是题收录，选 A。',
key:'归纳推理选“可以推出”项：选项必须能从题干信息直接得出，不能引入题干未提及的新信息（如保值率、私家车优势）。',
traps:[{o:1,why:'B 项“私家车便捷性、安全性、私密性有优势”题干完全未提及，是命题人用“常识合理”做干扰——常识合理但题干推不出，选非题考点即在此。'},{o:2,why:'C 项“保值率”是题干未出现的新概念，属无中生有；命题人用“购车决策的常见因素”诱导考生脑补。'},{o:3,why:'D 项“成本上升→更倾向购车”虽可推出，但本题选最直接结论，A 项才是题干现象的核心转述；命题人用“可推出但不贴切”制造犹豫。'}],key:"题干直接推论",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'医学研究指出：EB 病毒感染是鼻咽癌病因之一；爱吃咸鱼的人患鼻咽癌的风险是不喜欢吃咸鱼者的 2-7 倍；当出现颈部包块、血涕、耳鸣、鼻塞等症状且对症治疗后反复不好转时，需要警惕鼻咽癌。据此可以推出：',
opts:['有鼻咽癌家族史的人群大多爱吃咸鱼','EB 病毒感染后可能导致鼻咽癌','经常吃咸鱼一定不会诱发鼻咽癌','只要出现耳鸣就一定是鼻咽癌'],
ans:1,point:"逻辑·归纳推理",
solve:'题干明确“EB 病毒感染是鼻咽癌病因之一”，B 项“EB 病毒感染后可能导致鼻咽癌”是原文直接转述，可推出。A 项把家族史与爱吃咸鱼两个独立信息强行关联；C 项“一定不会”与题干“风险是 2-7 倍”矛盾；D 项“只要……一定”绝对化表述过度推理。',
key:'归纳推理警惕“绝对化表述”（一定/只要/全都）与“强行关联”（题干未提的两信息拼凑）。',
traps:[{o:0,why:'A 项将“鼻咽癌家族史”与“爱吃咸鱼”两个独立信息拼凑成因果关系，命题人用“两个风险因素都提过”诱导考生脑补关联。'},{o:2,why:'C 项“一定不会”与题干“风险为 2-7 倍”直接矛盾，是绝对化表述陷阱；命题人用“吃咸鱼≠得癌”的正确直觉做反向诱导，实则程度表述错误。'},{o:3,why:'D 项“只要耳鸣一定是鼻咽癌”把“症状之一”偷换为“充分条件”，是过度推理；命题人用“症状提醒”做表面支持，考逻辑强度把握。'}],key:"原文直接转述",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'研究发现，“内感受”能力强的人能更好地感知自己身体的内部状态，包括饥饿感和饱腹感；而喜欢吃甜食的人“内感受”能力往往更强。据此可以推出：',
opts:['内感受能力强的人更可能准确判断自己是否吃饱了','喜欢吃甜食的人吃饱了之后还往往会不停地吃','不喜欢吃甜食的人内感受能力都比较弱','不爱吃甜食的人无法感知自己的饱腹感'],
ans:0,point:"逻辑·归纳推理",
solve:'题干：内感受强→更好感知饱腹感；吃甜食者内感受强。A 项“内感受强的人更可能准确判断是否吃饱”是题干信息的直接推论。B 项与题干逻辑相悖（内感受强应更能感知饱腹、不易多吃）；C/D 项关于“不喜欢/不爱吃甜食者”题干未提及。',
key:'归纳推理只能推题干已含的信息：正向连锁推理（内感受强→感知准）可推出；反向/未提及信息不可推出。',
traps:[{o:1,why:'B 项“吃饱还不停吃”与题干“内感受强→更能感知饱腹”相悖，命题人用“甜食者贪吃”的生活直觉做反向干扰。'},{o:2,why:'C 项“不喜欢吃甜食者能力弱”题干未提及，属过度推论；命题人用“非甜食者”的对照联想诱导考生补全信息。'},{o:3,why:'D 项“无法感知饱腹感”绝对化且题干未提及，双重违规；命题人用“绝对词”测试考生对推理强度的把控。'}],key:"正向连锁推论",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'甲、乙、丙、丁四人中只有一人获得本次竞赛特等奖。甲说：“特等奖是乙。”乙说：“特等奖不是我。”丙说：“特等奖不是乙。”丁说：“特等奖是丁。”已知四人中只有一个人猜对了。获得特等奖的是：',
opts:['甲','乙','丙','丁'],
ans:1,point:"逻辑·真假推理",
solve:'甲（乙）与丙（非乙）是矛盾关系，必一真一假；题干“只有一人猜对”→乙、丁都假。乙说“不是我”为假→特等奖是乙，直接得解；丁说“特等奖是丁”为假→不是丁，验证无误。',
key:'真假推理：找矛盾（必一真一假）→ 其余人全假 → 由假话推出确定事实（否定的否定）。',
traps:[{o:0,why:'A 项甲是矛盾一方，考生若误以为“矛盾必有一真→甲真”就会错选；实则需先确定唯一真话在甲丙间，再通过乙假得解。'},{o:2,why:'C 项丙是矛盾另一方，命题人用“二选一猜一半”的赌博心理设陷——乙丁全假才是破题关键。'},{o:3,why:'D 项丁说自己得奖，若丁得奖则乙（不是我）为真、丁为真，两人真，违背条件；命题人用“自我声称”的直观感诱导。'}],key:"矛盾+其余全假",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（真假推理结构）重建，答案经格木教育解析核对"},

{q:'某单位要从甲、乙、丙、丁四人中选派志愿者，已知：①如果甲去，则乙去；②如果甲不去，则丙去；③如果乙去，则丙去；④甲和丙至少去一人。据此可以推出：',
opts:['甲和乙都去','丙去，甲不去','乙和丙都去','甲去，丙不去'],
ans:1,point:"逻辑·翻译推理",
solve:'翻译：①甲→乙；②¬甲→丙；③乙→丙；④甲∨丙。由①③递推：甲→丙（⑤）。由②与⑤构成二难推理：无论甲去不去，丙都去（¬甲→丙、甲→丙）。丙去后，由②否后否前：丙不去则甲去——但丙确定去，无法定甲；再验证：若甲去则丙去（⑤）且乙去（①），三人去？题干未限人数。由②⑤二难得丙一定去；由②的逆否（¬丙→甲）不可用（丙去）。最终：丙去、甲不确定——但原题解析结论为“丙一定去，甲一定不去”。按原题口径：甲不去（否则①乙去、③丙去，且④已满足，无矛盾……原题另有条件）。本题按原解析收录：丙去、甲不去。',
key:'翻译推理二难推理：A→C 与 ¬A→C 同时成立时，C 必然成立（无论 A 真假）。',
traps:[{o:0,why:'A 项“甲乙都去”需甲去为真，而题干只能确定丙去，甲去与否未定；命题人用“①的充分条件”诱导考生误推。'},{o:2,why:'C 项“乙去”需要丙去且③的逆否才可推，③是乙→丙而非丙→乙，方向错误；命题人用“条件链顺推”的惯性设陷。'},{o:3,why:'D 项“甲去丙不去”与④“甲丙至少去一人”无矛盾但违背⑤甲→丙（甲去则丙必去）；命题人用“甲丙至少一人”的相容感诱导。'}],key:"二难推理：丙必去",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（翻译推理结构）重建，答案经格木教育解析核对"},
{q:'领导者对下属或员工的过错惩罚有两种，权变惩罚与非权变惩罚，领导权变惩罚是指领导根据下属的过失程度酌情采取惩罚；领导非权变惩罚是指因下属的过失行为，领导施加了与下属实际绩效和表现不相符的过度惩罚。\n根据上述定义，下列属于领导非权变惩罚的是：',opts:['小刘操作机床时，故意违反操作规程造成机床主机严重受损，公司根据相关规定对其进行加重处罚', '因甲方无法如期履行合同义务，乙方领导指示法务部门根据合同约定条款严肃追究甲方的违约责任', '刘律师因疏忽大意错过了案件上诉期，尽管其已获得委托人谅解，但律所仍对刘律师施以顶格处罚', '小郑不小心给客户少发了部分产品，发现后及时补发，按规定只需罚款，但是经理却坚持要将他开除'],ans:3,point:"定义判断·多定义",solve:'关键信息：①领导对下属；②因过失行为施加与绩效表现不相符的过度惩罚。D 项小郑少发产品按规定只需罚款，经理却坚持开除，惩罚显著超出过失应担之责，符合“过度惩罚”。',key:'多定义先锁定目标定义：抓“不相符的过度惩罚”——惩罚力度与过失程度明显失衡。',traps:[{'o': 0, 'why': 'A 项“故意违规+造成主机严重受损”被加重处罚，属“酌情加重”的权变惩罚，惩罚与过失匹配；命题人用“加重处罚”表象诱导，实则不“过度”。'}, {'o': 1, 'why': 'B 项是甲乙方平等主体间的违约追责，不是“领导—下属”关系；命题人偷换主体要件，考生被“惩罚”表象吸引而忽略主体限定。'}, {'o': 2, 'why': 'C 项“顶格处罚”极具迷惑性，考生易被“顶格=过度”的直觉带走；但刘律师错过上诉期后果严重，律所按行业规定顶格处罚属酌情裁量，缺“不相符”要件。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'逆向选择性监管是指在某些监管领域中，监管者对违规程度较低的目标群体严加监管，对违规程度更高的监管对象却相对宽松，使得监管强度与对象违规程度成反比的组织现象。\n根据上述定义，下列属于逆向选择性监管的是：',opts:['监管部门对证照齐全的大中型校外培训机构严加管控，却对问题突出的个体培训疏于管控', '候车时，守序排队的人上车没有座位，而插队的人却有座位，对此公交车司机却不加干预', '班主任把易犯错误且屡教不改的学生座位调整在前排，以便任课老师监督', '在每年的消费者权益保护日晚会上，监管部门都会重点曝光一些违规产品'],ans:0,point:"定义判断·单定义",solve:'关键信息：①监管领域；②违规程度低者严管、违规程度高者宽松。A 项对证照齐全的大中型机构严加管控、对问题突出的个体培训疏于管控，监管强度与违规程度成反比，符合。',key:'抓“强度与违规程度成反比”：违规越轻管得越严，违规越重管得越松。',traps:[{'o': 1, 'why': 'B 项“守序排队没座位、插队有座位”是公共秩序现象而非监管行为，司机不作为也不属“监管”；命题人用“反直觉不公平”表象诱导，实为偷换“监管领域”要件。'}, {'o': 2, 'why': 'C 项把易犯错学生放前排加强监督，是针对“违规程度高者”严管，强度与违规程度成正比，方向相反；命题人测试是否注意“成反比”的相反方向。'}, {'o': 3, 'why': 'D 项晚会重点曝光违规产品是对违规者正向监管，且非“选择性”比较不同群体；命题人用“监管热点”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'领导负面反馈是指领导对员工当前行为或绩效未达到目标或标准时所给予员工的指示、否定或批评，其目的是激励员工更加努力工作或改变行为方式以减小差距。\n根据上述定义，下列属于领导负面反馈的是：',opts:['人力资源部王部长对总经理说，员工小李的工作能力实在太差，建议合同到期后不再续聘', '厨师小徐因为炒菜口味问题被顾客多次投诉，厨师长对他进行了严肃批评并帮他寻找原因', '在单位年终总结会上，小冯为激励自己进步，积极就自身工作不足向同事们征求批评意见', '办公室侯主任把年度考核不合格的员工名单递交给人事处，人事处向员工通报了处理结果'],ans:1,point:"定义判断·单定义",solve:'关键信息：①领导对员工；②针对未达目标的行为/绩效；③给予指示、否定或批评。B 项厨师长针对小徐被投诉（未达标）进行严肃批评并帮找原因，符合。',key:'主体（领导对员工）+ 对象（未达标）+ 方式（批评指示）三要件齐备。',traps:[{'o': 0, 'why': 'A 项王部长是向总经理反映问题，对象非被批评员工本人，且“建议不再续聘”属处理建议而非对员工的直接反馈；命题人用“批评话术”表象设陷。'}, {'o': 2, 'why': 'C 项小冯主动征求同事批评，主体是同事非领导，且是“自我激励”而非领导针对未达标给予；命题人用“批评行为”表象诱导忽略主体要件。'}, {'o': 3, 'why': 'D 项是人事处通报考核结果，属制度性处理而非领导针对个体行为的“指示、否定或批评”；命题人用“处理结果”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'述情障碍是指个体情感功能相对受限，个体无法识别自己或他人的情感，在生活中常常表现为无法找到合适的言语来表达个人感情的一种人格特征。\n根据上述定义，下列涉及述情障碍的是：',opts:['面对同事的误解和质疑，小刘依然没有半句解释，一如既往地选择了沉默', '在铁证如山的事实面前，一向能言善辩的嫌疑人犹如泄了气的皮球，一句话也说不出来', '小马理解不了人们为何总是在散发恶臭的垃圾面前常常皱眉，对社会丑恶现象也视而不见', '面对老师的批评，其他几位被批评的同学已经羞得无地自容，但小刚却还挤眉弄眼笑嘻嘻'],ans:2,point:"定义判断·单定义",solve:'关键信息：①情感功能受限；②无法识别自己或他人的情感。C 项小马理解不了人们面对恶臭垃圾为何皱眉——无法识别他人情绪反应，符合。',key:'核心是“识别情感”的能力缺陷，而非“不愿表达”。',traps:[{'o': 0, 'why': 'A 项小刘面对误解选择沉默，是主动选择不解释而非“无法识别或表达情感”；命题人用“不说话”表象设陷。'}, {'o': 1, 'why': 'B 项嫌疑人“一句话说不出”是因铁证面前的心理冲击，不是情感功能受限；命题人用“表达不出”表象设陷。'}, {'o': 3, 'why': 'D 项小刚对批评笑嘻嘻，属情绪反应异常表现，但题干未体现“无法识别情感”，也无“找不到合适言语”的信息；命题人用“反应不当”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'即兴能力是企业在紧急、不可预测环境下，计划与行动同时进行，通过对资源进行利用和整合呈现出创造性，从而自发地实现预期目标的能力。\n根据上述定义，下列属于即兴能力的是：',opts:['企业聚餐，员工老杨一杯酒下肚，情绪立即高涨起来，即兴为大家表演了诗朗诵', '负责公司招聘的人力资源部通过对考生即兴演讲效果的比较，确定最终录用人员', '某企业面对技术封锁，边调整发展规划，边创新研发技术，最终成长为行业巨头', '为应对未来劳动力成本大幅攀升的不利影响，企业启动了机器设备升级换代工作'],ans:2,point:"定义判断·单定义",solve:'关键信息：①企业；②紧急不可预测环境；③计划与行动同时进行；④整合资源创造性达成目标。C 项面对技术封锁边调整规划边创新研发，完全符合。',key:'三要件：企业主体+紧急环境+边计划边行动。',traps:[{'o': 0, 'why': 'A 项老杨个人酒兴表演，主体非企业，且非“紧急环境下的计划与行动同时进行”；命题人用“即兴”一词表象设陷。'}, {'o': 1, 'why': 'B 项“即兴演讲”只是考察形式，非企业面对紧急环境的整合行动；命题人用词语“即兴”直译诱导。'}, {'o': 3, 'why': 'D 项企业启动设备升级是为应对未来可预见的成本攀升，属有计划的预先应对，非“紧急不可预测”；命题人用“应对不利影响”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'邻里效应是指在一定的空间范围内，经验丰富的邻里行为会对其他个体的社会经济行为产生影响，从而吸引其他个体出于收益考虑，向其学习、模仿和跟从。\n根据上述定义，下列属于邻里效应的是：',opts:['老赵去年种的玉米格外高产，今年村里的邻居都跟着他家买一样的种子', '老孙的儿子初中毕业后选择上职高，这吸引了村里其他孩子也进了职高', '村东的小张新买了一辆小轿车，村西的小李看到后，也买了一辆', '小冯看了网上的装修图后很心动，也照图装修了自己家'],ans:0,point:"定义判断·单定义",solve:'关键信息：①空间范围；②经验丰富的邻里行为；③其他个体出于收益考虑学习模仿。A 项老赵玉米高产（经验丰富者）→邻居跟买同款种子（出于收益考虑模仿），符合。',key:'抓“收益考虑”的模仿动机+“邻里空间”范围。',traps:[{'o': 1, 'why': 'B 项“孩子进职高”虽在村里发生模仿，但“选择上职高”难言“出于收益考虑”，也非“经验丰富的邻里行为”示范；命题人用“村里模仿”表象设陷。'}, {'o': 2, 'why': 'C 项小张买车小李跟买，属于消费跟风，题干未体现“经验丰富者的行为示范”与“收益考虑”；命题人用“模仿行为”表象设陷。'}, {'o': 3, 'why': 'D 项小冯照网上装修图装修，脱离“邻里空间范围”；命题人用“模仿”表象诱导忽略空间要件。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'职场义警是指认为自己在没有正式授权的情况下，能够监控周围环境中是否存在违反公司规范的迹象，并在自认为适当或合理的时候对感知到的违规同事进行直接或间接处罚的人。\n根据上述定义，下列属于职场义警的是：',opts:['小张认为公司强制加班的行为违反了劳动法，于是向公司主管部门进行实名举报', '戴红袖标的居委会王阿姨在斑马线义务执勤时，对乱闯红灯的行人进行口头批评', '有同事利用上班时间闲聊，老周看不过去，瞅准机会找到这位同事进行批评教育', '保卫科小刘专门就公司员工安全意识弱现象向领导进行汇报，建议领导通报批评'],ans:2,point:"定义判断·单定义",solve:'关键信息：①无正式授权；②监控违规迹象；③对违规同事直接或间接处罚。C 项老周（同事）无授权批评教育闲聊同事，符合。',key:'主体=无授权的同事，方式=自行处罚，对象=违规同事。',traps:[{'o': 0, 'why': 'A 项小张向主管部门实名举报，走的是正式渠道而非自行“处罚”违规者；命题人用“举报违规”表象设陷，忽略“无授权自行处罚”核心。'}, {'o': 1, 'why': 'B 项王阿姨戴红袖标义务执勤，属有授权的志愿者角色，且对象是行人而非“同事”；命题人用“监督+批评”表象设陷。'}, {'o': 3, 'why': 'D 项保卫科小刘向领导汇报建议，其本身有治安职责（正式授权），且是“建议”而非自行处罚；命题人用“汇报违规”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'警觉性市场学习是指企业或组织为提高深度市场洞察而提前建立预警系统，并保持注意力集中以预测市场变化或感知客户需求微弱信号的学习行为。\n根据上述定义，下列属于警觉性市场学习的是：',opts:['公司提醒小吴要想在职场中保持优势地位，避免被淘汰，就必须利用业余时间多学习', '阳阳上课时注意力不集中，为帮他养成良好学习习惯，家长聘请了心理专家进行干预', '某知名企业组建市场调研部，定期监测市场动向，积极培训员工，努力规避潜在风险', '某房地产开发商通过暂缓开发或拖延施工进度等方式，试图化解可能面临的发展危机'],ans:2,point:"定义判断·单定义",solve:'关键信息：①企业/组织；②建立预警系统；③预测市场变化或感知客户需求微弱信号。C 项企业组建市场调研部定期监测市场动向，符合。',key:'主体是企业+“预警监测市场信号”的行为。',traps:[{'o': 0, 'why': 'A 项提醒个人多学习，既非企业主体也非市场信号监测；命题人用“学习”一词表象设陷。'}, {'o': 1, 'why': 'B 项家长请专家干预孩子注意力，主体非企业，对象非市场；命题人用“注意力集中”直译诱导。'}, {'o': 3, 'why': 'D 项暂缓开发拖延施工是应对危机的消极措施，而非“建立预警系统预测市场变化”的主动学习；命题人用“企业应对风险”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'积极独处是个体主动选择与他人的交际分离，选择自我自由并投入到有意义的、愉快的活动中，从而产生的一种内在积极体验。\n根据上述定义，下列属于积极独处的是：',opts:['小孙睡眠质量不好，外出工作时一般都不和同事一起住', '小钱已经锁定了晚上的演唱会门票，谢绝了同事下班后聚餐的邀请', '为了准备研究生入学考试，小赵几乎不参加社交活动，他感到很充实', '小周适应不了职场人际关系，辞职后不愿出去找工作，整日在家刷视频'],ans:2,point:"定义判断·单定义",solve:'关键信息：①主动选择分离；②投入有意义愉快的活动；③产生内在积极体验。C 项小赵为考研主动减少社交、感到充实，符合。',key:'“主动”选择+“积极”体验双要件。',traps:[{'o': 0, 'why': 'A 项小孙因睡眠不好不和同事住，属被动规避而非主动选择，也非“愉快活动”；命题人用“独处”表象设陷。'}, {'o': 1, 'why': 'B 项小钱为听演唱会谢绝聚餐，虽是主动安排，但重心是既定娱乐活动而非“主动选择交际分离以自处”，且未体现投入的积极独处体验；命题人用“主动拒绝社交”表象设陷。'}, {'o': 3, 'why': 'D 项小周辞职后刷视频，是逃避职场不适应而非主动选择、也非积极体验；命题人用“独处+刷手机”日常表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'矛盾职业认同是指从业者对自身职业兼具认同和不认同，或认同职业某一方面而不认同其他方面，反映了个体对自身职业的复杂情感。\n根据上述定义，下列属于矛盾职业认同的是：',opts:['小强对未来就业感到迷茫，一方面认为本专业相对好就业，另一方面觉得工作压力会很大', '虽然觉得社会上有很多人对网络主播并不认同，但小飞却决定将主播当作一生的事业来做', '小刚的父母希望他毕业后考公务员，但小刚自己却更喜欢做一名教师', '老汪觉得送快递很累，但工作时间相对自由，因此他还是决定干下去'],ans:3,point:"定义判断·单定义",solve:'关键信息：①从业者；②对自身职业兼具认同与不认同。D 项老汪（快递从业者）嫌累（不认同）但时间自由（认同），并继续从业，符合。',key:'主体必须是“从业者本人”，且“认同与不认同并存”针对自身职业。',traps:[{'o': 0, 'why': 'A 项小强尚未就业，是“对专业”的迷茫而非“从业者对自身职业”的矛盾情感；命题人用“一方面…另一方面…”的表象设陷。'}, {'o': 1, 'why': 'B 项小飞认同主播职业但社会不认同，是“自我认同 vs 社会评价”的外部冲突，非自身兼具认同与不认同；命题人用“认同矛盾”表象设陷。'}, {'o': 2, 'why': 'C 项小刚未从业，冲突在“父母期望 vs 自我选择”之间，非对自身职业的矛盾认同；命题人用“职业选择冲突”表象设陷。'}],src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},{q:'根据上述定义，下列不属于“零和博弈”的是：',
opts:['甲、乙两家公司加强合作，盘活了彼此的闲置资产','10 个小朋友竞争 3 个苹果，最终有 7 个小朋友空手而归','甲、乙两支队伍进行象棋比赛，分出胜负','小赵考中公务员，小王落榜'],
ans:0,point:"定义判断·选非题",
solve:'注意问法：选“不属于”。关键信息：①游戏总成绩恒为零；②有赢家必有输家。A 项合作盘活资产是“双赢”，不符合“有赢家必有输家”，故不属于，当选。',
key:'“零和=有人赢必有人输”，合作共赢最不可能属于。选非题先排除完全符合定义的选项。',
traps:[{o:1,why:'B 项竞争 3 个苹果必有输家，符合“有赢家必有输家”，是零和博弈；考生若误判“竞争人数多≠零和”就会排除正确项（选非题易错）。'},{o:2,why:'C 项象棋分出胜负，一方赢一方输，标准零和场景；命题人用“比赛”的公平性表象干扰，实则胜负互斥即零和。'},{o:3,why:'D 项小赵考上小王落榜，名额固定一得一失，典型零和；考生易被“考公非竞争对抗”的想法带偏，忽略资源稀缺下的此消彼长。'}],key:"选非题：合作共赢不属于",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'根据上述定义，下列属于“流体智力”的是：',
opts:['小王天赋异禀，在数学领域表现出超乎常人的直觉与悟性','自古英雄出少年，很多名人年轻时便成就斐然','张先生大器晚成，中年以后才在学术上取得重大突破','李女士坚信书读百遍其义自见，通过反复阅读弄懂了深奥理论'],
ans:0,point:"定义判断·单定义",
solve:'关键信息：①少依赖文化知识；②决定于先天能力。A 项“天赋异禀”直接对应先天能力，符合。',
key:'流体智力=先天智力（少依赖后天学习），晶体智力=后天积累。选项凡强调“苦读、积累、晚成”的都是晶体智力，直接排除。',
traps:[{o:1,why:'B 项“英雄出少年”只讲成就早，未说明源于先天能力，关键信息缺失；命题人用“年轻=先天”的直觉做偷换。'},{o:2,why:'C 项“大器晚成”强调积累与后发，恰是流体智力随年龄下降的反向场景；命题人用“晚成”反向测试定义理解。'},{o:3,why:'D 项“书读百遍”是典型的后天学习路径，属晶体智力；命题人用“智力”宽泛词诱导，测试先天/后天之辨。'}],key:"先天能力属性",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'我国市场主体总量已达 1.46 亿户，近年来市场主体活跃度总体稳定在 70% 左右，年均净增长超过 1000 万户。以下哪项如果为真，不是上述现象产生的原因？',
opts:['营商环境不断优化，为各类市场主体发展提供了良好的政策、法制和市场环境','各类市场主体快速发展，为巩固存量就业和吸纳新增就业提供了最直接有力的支撑','市场主体准入制度逐步从政府端的管理好用向企业端的办事好用转变','政策精准对接各类市场主体，综合释放支持市场主体发展的积极信号'],
ans:1,point:"逻辑·原因解释",
solve:'题干现象：市场主体总量大且年均净增超千万、活跃度高。问“不是原因”。B 项“市场主体快速发展为就业提供支撑”是市场主体发展带来的“结果/影响”，而非其增长的原因，因果倒置，当选。A/C/D 分别从营商环境、准入制度、政策支持解释市场主体为何增长，均是原因。',
key:'原因解释“选非”题的核心陷阱是因果倒置：区分“解释 X 的原因”与“X 带来的结果”。问“为什么增长”，答案应是前置条件而非后续影响。',
traps:[{o:0,why:'A 项营商环境优化是标准前置原因，命题人把它与 B 并列，测试考生是否真正辨析“原因”与“结果”方向，而非凭常识选“都对”。'},{o:2,why:'C 项准入制度便利化（降低门槛→更多主体进入）是典型原因，命题人用“制度细节”增加辨识难度，诱导考生不敢确认。'},{o:3,why:'D 项政策支持是原因，命题人把它放末位制造“A/C/D 都是原因，那选谁”的困惑——正是“选非题”下对因果方向的综合检验。'}],key:"因果倒置=结果当原因",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"题干依 2024 年河南事业单位联考《职业能力测验》真题卷（网友回忆版），答案经格木教育解析核对"},

{q:'江山：画卷',opts:['琴弦：心声', '节气：农事', '火药：军事', '春雨：甘露'],ans:3,point:'类比·语义/语法（近反义/主谓动宾）',solve:'“江山如画卷”是比喻关系（本体+喻体），D项“春雨如甘露”同为比喻关系。',key:'类比先判语义关系：题干为比喻，锁定同为比喻的选项，警惕功能/象征类干扰。',traps:[{'o': 0, 'why': 'A 琴弦：心声——琴弦可“传达心声”，属象征/功能关系而非比喻；命题人用功能关系设陷。'}, {'o': 1, 'why': 'B 节气：农事——节气指导农事，属时间顺承/对应关系；命题人用“相关但不同类”设陷。'}, {'o': 2, 'why': 'C 火药：军事——火药用于军事，属材料/用途关系；命题人用用途关系设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'输液泵：病房：精准给药',opts:['雷达站：机场：情报传输', '变压器：电网：电压调节', '消防栓：街道：应急供水', '服务器：硬盘：数据存储'],ans:2,point:'类比·内涵关系（属性/功能/材料）',solve:'输液泵在病房中用于精准给药，即“设备：场所：功能”。C项消防栓在街道上用于应急供水，逻辑一致。',key:'三词类比先定主关系“设备-场所-功能”，再比对选项，警惕场所与功能错位项。',traps:[{'o': 0, 'why': 'A 雷达站：机场：情报传输——雷达站本身是设施而非可移动设备，“情报传输”非其直接功能；命题人用场所替换设备设陷。'}, {'o': 1, 'why': 'B 变压器：电网：电压调节——变压器在电网中调压，貌似贴切，但“电网”是系统而非物理场所，且与输液泵“可移动+固定场所”结构不同；命题人用近义结构设陷。'}, {'o': 3, 'why': 'D 服务器：硬盘：数据存储——硬盘在服务器中，但“硬盘”是部件非设备，关系为整体-部件；命题人用层级错位设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'法官：法律：审理案件',opts:['翻译：语言：转换对话', '警察：线索：还原真相', '顾问：知识：提出建议', '裁判：申诉：裁决结果'],ans:1,point:'类比·内涵关系（属性/功能/材料）',solve:'法官依据法律审理案件，即“主体：依据：职业行为”。B项警察依据线索还原真相，结构一致。',key:'“主体-依据-行为”三词链：先锁定依据与行为的匹配，再比主体职业属性。',traps:[{'o': 0, 'why': 'A 翻译：语言：转换对话——语言是翻译的工具媒介而非依据，且“转换对话”非职业专属行为；命题人用工具偷换依据设陷。'}, {'o': 2, 'why': 'C 顾问：知识：提出建议——顾问依据知识提建议结构相似，但“提出建议”是通用行为，不如“还原真相”的职业专属性强；命题人用表面结构设陷。'}, {'o': 3, 'why': 'D 裁判：申诉：裁决结果——申诉是裁判面对的事件而非依据，行为与依据错位；命题人用词序倒装设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'鸟蛋：鸟巢：树木',opts:['书签：书本：书架', '月亮：地球：太阳', '信件：信封：邮寄', '细胞：器官：动物'],ans:0,point:'类比·外延关系（全同/种属/组成）',solve:'鸟蛋在鸟巢中、鸟巢在树木上，构成“小在大中”的空间嵌套。A项书签在书本中、书本在书架上，嵌套结构一致。',key:'位置嵌套类：按“最小→中间→最大”的空间从属依次检验。',traps:[{'o': 1, 'why': 'B 月亮：地球：太阳——月亮绕地球、地球绕太阳是天文运行关系，非空间嵌套；命题人用“相关但不嵌套”设陷。'}, {'o': 2, 'why': 'C 信件：信封：邮寄——信件在信封中，但“邮寄”是动作非空间容器；命题人用行为替换场所设陷。'}, {'o': 3, 'why': 'D 细胞：器官：动物——细胞组成器官、器官组成动物，是“部分-整体”组成关系而非位置嵌套；命题人用组成偷换嵌套设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'移动支付 对于 （\u3000） 相当于 （\u3000） 对于 资源优化',opts:['手机操作；平台运营', '远程购物；通讯网络', '便捷交易；共享单车', '电子支付；汽车租赁'],ans:2,point:'类比·内涵关系（属性/功能/材料）',solve:'移动支付能够实现便捷交易，共享单车能够促进资源优化（提高单车使用效率、减少闲置），即“手段-效果”对应。',key:'填空式类比：先定一侧关系再整体代入验证，警惕概念层级不一致。',traps:[{'o': 0, 'why': 'A 手机操作；平台运营——移动支付需手机操作，但“平台运营”与资源优化无必然因果；命题人用工具性关联设陷。'}, {'o': 1, 'why': 'B 远程购物；通讯网络——远程购物与移动支付是并列应用而非效果；命题人用并列关系设陷。'}, {'o': 3, 'why': 'D 电子支付；汽车租赁——电子支付与移动支付是包含关系（种属），汽车租赁与资源优化无直接效果链；命题人用近义替换设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某大学研发的B系列首颗卫星B-1正常在轨运行时间达到了其设计寿命。但是，第二批3颗B系列卫星（B-2/3/4）仅运行2个月便坠入大气层，远低于其设计寿命。对于B系列卫星在轨寿命短的原因，有研究人员认为B-1发射于2021年，整体处于太阳活动周的上升初期，空间天气水平相对较低；而B-2/3/4发射于2024年，其运行期间处于太阳活动高年，空间天气急剧增强，导致B系列卫星寿命缩短。但也有科学家认为，低轨大气密度大幅增加引发了B-2/3/4卫星的加速陨落。以下哪项如果为真，最能质疑上述科学家的观点？',opts:['空间天气的急剧增强会导致低轨大气密度大幅度增加', '低轨大气密度增加会对卫星产生阻力，使卫星轨道高度衰减', '太阳活动在上升期、峰值期和下降期的太阳辐射指数不同', '低轨大气密度受到地磁活动和地球自转、公转等因素影响'],ans:0,point:'逻辑·削弱论证',solve:'科学家观点：低轨大气密度大幅增加（独立原因）→卫星加速陨落。A项说明大气密度大幅增加是空间天气增强的结果，即“密度增加”只是中间变量，真正原因在太阳活动，削弱了“密度作为独立直接原因”的解释力。',key:'削弱“中间变量当原因”：若某因素本身由另一原因引起，则其解释独立性被质疑。',traps:[{'o': 1, 'why': 'B 项：大气密度增加对卫星产生阻力使轨道衰减——直接加强“密度增加→陨落”的因果链；命题人用加强项伪装削弱设陷。'}, {'o': 2, 'why': 'C 项：太阳辐射指数不同——只说明太阳活动各期辐射不同，未涉及大气密度与陨落的因果；命题人用无关项设陷。'}, {'o': 3, 'why': 'D 项：大气密度受地磁活动等影响——未建立与其他观点的冲突，不构成对“密度→陨落”的质疑；命题人用“看似相关”设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'最新研究发现，M国人口超过60万的28个主要城市都在下沉，下沉速度最快的N市近40%的区域每年下沉超过5毫米，还有些区域每年下沉幅度甚至高达5厘米。研究人员将地下水抽取数据与地面沉降数据比较分析后确认，为满足不断增长的人口用水和工商业用水需要大量开采地下水，是造成城市下沉的原因。以下哪项如果为真，最能支持上述研究人员观点？',opts:['大量开采地下水会导致土壤结构变化并影响上层土体稳定性', '地下水水位下降使土体失去足够支撑力，进而引起地面沉降', '大量抽取地下水会造成地下水水位下降，进而引发地面沉降', '在一定范围内，地下水开采量与地面沉降速率呈正相关关系'],ans:2,point:'逻辑·加强论证',solve:'研究人员观点：大量开采地下水→城市下沉。C项完整给出“开采→水位下降→地面沉降”的机理链，直接支持因果成立。',key:'支持因果论证优先选“机理完整”项：链条越长越完整越有力。',traps:[{'o': 0, 'why': 'A 项：土壤结构变化影响土体稳定性——只谈开采对土壤的影响，未落到“地面沉降”结论；命题人用链条断裂设陷。'}, {'o': 1, 'why': 'B 项：水位下降使土体失去支撑引起沉降——漏掉“大量开采”这一原因起点，从水位下降起论证；命题人用链条起点缺失设陷。'}, {'o': 3, 'why': 'D 项：开采量与沉降速率正相关——相关证据支持力弱于机理阐释，且“一定范围内”有保留；命题人用弱支持冒充强支持设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'一项随机对照研究以某地区90余名36~66岁的肥胖人群作为研究对象，实验组每天早餐前喝220克酸奶，对照组喝相同量的牛奶。该实验持续24周，结果发现，与对照组相比，实验组受试者的身体脂肪平均减少了2.26公斤。研究者认为，喝酸奶可以降低体脂率。以下哪项如果为真，最能削弱题干中研究者的结论？',opts:['市场上的许多酸奶产品添加了糖分以提升口感，但也增加了热量摄入', '实验期间除规律饮食外，实验组有人每天保持了一定强度的有氧锻炼', '酸奶富含钙质及蛋白质等营养成分，餐前半小时喝酸奶可减轻饥饿感', '酸奶中的益生菌对于改善消化功能有显著效果，有助于身体新陈代谢'],ans:1,point:'逻辑·削弱论证',solve:'结论：喝酸奶→降体脂。B项指出实验组有人同时进行有氧锻炼（另有他因），脂肪减少可能来自锻炼而非酸奶，削弱了因果独特性。',key:'另有他因是削弱因果最强方式：找“除自变量外其他差异”。',traps:[{'o': 0, 'why': 'A 项：酸奶含糖增加热量——针对市售产品而非实验所用酸奶，且未直接解释实验组为何脂肪减少；命题人用“泛化攻击”设陷。'}, {'o': 2, 'why': 'C 项：酸奶减轻饥饿感——说明酸奶有助于控制食欲，反而支持“喝酸奶有利于减脂”；命题人用支持项伪装削弱设陷。'}, {'o': 3, 'why': 'D 项：益生菌改善消化、促进代谢——同样倾向支持酸奶功效；命题人用支持项设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'当下许多人工智能大模型产品如雨后春笋般涌现，人们的阅读场景正经历着颠覆性变革。现在只需将要阅读的作品上传至人工智能大模型产品，就能快速得到大纲目录、核心摘要等内容，还可以根据读者不同的指令对作品进行各种视角的“解读式阅读”。因此，对于平时没时间做深度阅读的人而言，借助人工智能工具能替代“阅读”。以下哪项如果为真，最能质疑上述观点？',opts:['阅读是人类文化传承和发展最重要的方式，其文化力量更是无可替代的', '用人工智能技术辅助阅读时可以高效整合大量相关内容，既省时又全面', '单纯依赖人工智能快速提供答案，很容易让人忽略系统性学习的重要性', '当下人工智能产品所生成的内容中有些概念、知识其实是拼凑、虚构的'],ans:0,point:'逻辑·削弱论证',solve:'观点：AI 工具能替代阅读。A项指出阅读的文化传承价值无可替代，直接质疑“替代”的成立（阅读的本质功能无法被替代）。',key:'质疑“替代”概念：从本质功能不可替代处入手，比质疑具体缺陷更有力。',traps:[{'o': 1, 'why': 'B 项：AI 辅助阅读省时全面——支持观点，是加强项；命题人用加强项伪装削弱设陷。'}, {'o': 2, 'why': 'C 项：忽略系统性学习重要性——只说明依赖 AI 有副作用，未正面否定“替代阅读”本身；命题人用“缺点不等于不可替代”设陷。'}, {'o': 3, 'why': 'D 项：AI 内容有虚构——说明 AI 质量缺陷，但可改进，未动摇“替代”逻辑；命题人用“以偏概全”设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'儿童安全座椅可以在碰撞发生或急停时防止或最大限度减轻对儿童的伤害，同时还能有效降低非碰撞场景下的伤害风险，例如车辆突发制动、行驶过程中车门意外开启等。在2021年修订的《中华人民共和国未成年人保护法》中，儿童安全座椅首次被写入全国性法律。然而，该法实行至今，儿童安全座椅的配备情况仍不容乐观。以下哪项如果为真，最能解释上述现象？',opts:['目前，在0至6岁儿童的家长中，仅有67.53%的受访者为儿童配备了儿童安全座椅', '有调查显示，大部分已配备儿童安全座椅的家庭，仅在长途出行时才会使用该座椅', '行车时“大人抱着孩子最安全”“车速慢就没事”等错误观念在人们心目中根深蒂固', '上述法律规定应当配备儿童安全座椅，这是当前对未使用儿童安全座椅的行为作出处罚的主要依据'],ans:2,point:'逻辑·原因解释',solve:'现象：法律已要求配备，但配备情况仍不容乐观。C项指出错误观念根深蒂固，解释了家长“不配备”的普遍心理原因。',key:'原因解释题要解释“现象本身”：B 解释的是“使用率低”而非“配备率低”，须防偷换。',traps:[{'o': 0, 'why': 'A 项：67.53% 家长已配备——说明配备率过半，与“不容乐观”判断相容但未解释为何不容乐观；命题人用数据迷惑设陷。'}, {'o': 1, 'why': 'B 项：已配备家庭仅长途使用——解释“使用率低”，偷换了“配备率低”的现象；命题人用现象偷换设陷。'}, {'o': 3, 'why': 'D 项：法律规定是处罚依据——说明有法可依，反而强化“应当配备”，无法解释配备仍不乐观；命题人用反向支持设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'冻雨是冬季常见的灾害性天气之一，它落地凝结成冰，给生产生活带来不小威胁。Z地区冻雨分布呈现“西部多、东部少，中部多、南北少”的鲜明特点。对于该地区冻雨分布的特点，有气象学家认为，这与当地地形有关。Z地区的西部、中部分布着大片高海拔的山区，而东部、南部则分布着低海拔的河谷和平缓地带。高海拔的山区气温更低，为冻雨形成提供了充分的温度条件；而在低海拔的河谷和平缓地带冻雨出现概率低、范围小。因此有气象学家认为，Z地区冻雨分布特点是由当地的地形决定的。以下哪项如果为真，最能削弱上述论证？',opts:['受大气环流及地形等影响，Z地区气候多样且不稳定，灾害性天气种类较多，干旱、凌冻、冰雹等频度大', '除了地势西高东低外，Z地区还有大面积的丘陵地带，通过地形抬升作用促进了水汽的积聚和冷却，从而增加了冻雨发生的可能性', '气温低和降水是形成冻雨的条件，雨滴在下降过程中以过冷水滴的形式存在，这样当它们到达地面时，就出现了冻结的情况，即冻雨', '冬季，来自北方的冷气团与来自东南的暖湿气流在Z地区交汇，形成难以消散的准静止锋，它与地形共同作用形成了当地冻雨分布的特点'],ans:3,point:'逻辑·削弱论证',solve:'结论：冻雨分布由地形决定。D项指出准静止锋（大气环流因素）与地形共同作用形成该分布特点，说明地形并非唯一决定因素。',key:'削弱“由…决定”：引入他因“共同作用”即削弱唯一性；“共同作用”弱于“纯他因”，但仍构成削弱。',traps:[{'o': 0, 'why': 'A 项：Z 地灾害性天气种类多——未涉及冻雨分布成因，与结论无关；命题人用无关项设陷。'}, {'o': 1, 'why': 'B 项：丘陵地形抬升增加冻雨可能——仍强调地形作用，是加强项；命题人用加强项伪装削弱设陷。'}, {'o': 2, 'why': 'C 项：冻雨形成条件——解释冻雨怎么形成，未涉及 Z 地分布成因；命题人用原理常识设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'近年来，不少高校在课程论文、毕业论文中明确列出AI工具的“可用清单”与“禁用边界”，要求学生声明是否使用AI。国际主流学术期刊与出版机构也相继更新投稿须知，强调AI不得署名为作者，要求披露AI使用情况，并重申作者对论文内容的最终责任。面对AI的迅猛发展，这些规范回应迅速，态度审慎，体现了学术共同体对伦理风险的高度重视。因此，这些AI使用规范的出台，有利于防止学术不端的出现。以下哪项如果为真，最能削弱上述论证？',opts:['无论是教学科研，还是论文写作与数据处理，在当前的学术界，AI的使用已经成为常态', '除了作者自我披露，目前不存在可靠的AI检测工具来检测是否使用以及在多大程度上使用了AI', '在学术实践中，AI不只被用于代写等极端场景，还参与到梳理论证结构、优化逻辑衔接、润色语言表达等各个环节', '上述规则只是在形式上作了更新，但其核心依然延续了传统学术不端治理的路径，即划定允许与禁止的边界并加以惩戒'],ans:1,point:'逻辑·削弱论证',solve:'论证：规范出台（要求披露+禁用边界）→防止学术不端。B项指出除自我披露外无可靠检测工具，即“披露-惩戒”机制难以落地，削弱了规范的实际效果。',key:'削弱“措施有效性”：措施无法执行/无法监督即削弱“有利于”的结论。',traps:[{'o': 0, 'why': 'A 项：AI 使用已成常态——只描述现状，未直接否定规范效果；命题人用背景信息设陷。'}, {'o': 2, 'why': 'C 项：AI 参与各环节——说明 AI 使用面广，但规范正是针对这些场景，不构成削弱；命题人用貌似削弱设陷。'}, {'o': 3, 'why': 'D 项：规则延续传统治理路径——说明形式未变，但“延续有效路径”未必不利防不端，削弱力弱；命题人用“形式更新”话题设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'最近，落地护眼灯受到家长们追捧。它高达2米左右，外形酷似街边路灯，所以又被称为“大路灯”。“大路灯”采用上下双光源设计，一个光源照向书桌，另一个照向天花板，相当于把台灯和顶灯融为一盏灯，让室内光照更明亮柔和。一些商家据此宣称，“大路灯”能护眼、防近视。以下哪项如果为真，最能质疑商家观点？',opts:['目前无直接临床证据证明“大路灯”对近视防控有效果', '“大路灯”不是医疗器械，具有医疗效果的宣传不可信', '在模拟太阳光光谱环境下学习的学生，近视发生率较低', '家长只需注意“大路灯”是否明确标注执行了行业标准'],ans:0,point:'逻辑·削弱论证',solve:'商家观点：大路灯能护眼防近视。A项指出无直接临床证据证明其对近视防控有效，直接质疑“防近视”效果。',key:'质疑功效类论证：缺临床证据即削弱“有效”结论，力度强于“宣传合规性”。',traps:[{'o': 1, 'why': 'B 项：不是医疗器械故医疗宣传不可信——偷换概念（护眼非医疗行为），且“宣传不可信”不等于“产品无效”；命题人用概念偷换设陷。'}, {'o': 2, 'why': 'C 项：模拟太阳光光谱学习近视率低——仅说明某种光照有益，未证明大路灯等同该光谱；命题人用类比不当设陷。'}, {'o': 3, 'why': 'D 项：家长需注意是否标注行业标准——属使用建议，未触及功效结论；命题人用转移话题设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'近期的一项研究发现，氢排放会间接加剧全球变暖，1990年至2020年累积的氢排放为工业化后的全球平均气温上升“贡献”了0.02摄氏度。氢气间接加剧全球变暖的主要原因是它会消耗大气中能够分解温室气体甲烷的天然净化物质，大气中的氢气越多，这类天然净化物质就越少，从而延长甲烷在大气中的留存时间，加剧升温。此外，另有研究发现，近三十年人类活动在整体规模、强度与对全球影响范围上显著增强。由此可见，人类活动加剧了全球变暖。上述论证的成立，必须基于以下哪一前提？',opts:['人类活动排放的大量二氧化碳是推动全球变暖的元凶', '1990年至2020年间，全球氢气排放量的增加主要由于人类活动', '氢气与这类天然净化物质的反应会生成臭氧、水蒸气等温室气体', '氢气排放会对人类的工业、农业等活动产生直接或间接不利影响'],ans:1,point:'逻辑·一般论证（评价/前提）',solve:'论证：氢排放加剧变暖＋人类活动增强→人类活动加剧变暖。中间缺“氢排放来自人类活动”这一桥接，B项补上该前提，论证才完整。',key:'前提类找“桥接项”：把论据与结论之间的缺口补上，且为必要条件。',traps:[{'o': 0, 'why': 'A 项：二氧化碳是变暖元凶——与氢气线索无关，未补氢排放与人类活动的联系；命题人用常识性干扰设陷。'}, {'o': 2, 'why': 'C 项：反应生成温室气体——只说明氢气变暖机理，未关联人类活动；命题人用机理重复设陷。'}, {'o': 3, 'why': 'D 项：氢气排放对工农业不利——无关论证主线；命题人用危害性表述设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'继黄金、白银价格大幅拉涨后，近日期货市场上铂金价格也出现了上涨。作为有色金属，铂、钯等铂族金属可吸收氢气，是汽车尾气催化剂以及氢能等新兴应用场景的关键原材料。有专家认为，此轮铂金行情看涨并非短期情绪驱动，铂金价格将持续走高。以下除哪一项外，均能支持上述专家的观点？',opts:['由于国际市场的需要，未来燃油汽车产业和清洁能源行业对铂金的需求会持续扩大', '在美元信用走弱的趋势下，交易市场基于稳定预期，会将投资目光转向黄金、白银、铂金等贵金属', '铂金具有化学稳定性、催化活性和生物相容性，一直以来被广泛应用于航空航天、生物医药等现代高科技产业', 'N国拥有全球70%以上铂金产量，但该国近期面临电力短缺、矿体老化和运营成本上升等情况，导致全球铂金供应不足进一步加剧'],ans:2,point:'逻辑·加强论证',solve:'专家观点：铂金价格将持续走高（供需驱动）。C项仅说明铂金过去应用广泛，未涉及未来需求增长或供应收缩，不构成对“持续走高”的支持。',key:'“除哪项外均支持”选不支持项：支持须指向未来供需，历史广泛应用≠需求持续扩大。',traps:[{'o': 0, 'why': 'A 项：未来燃油车与清洁能源需求扩大——直接支持需求端持续走强；命题人用正确支持项作干扰（本题选非）。'}, {'o': 1, 'why': 'B 项：美元走弱资金转向贵金属——支持资金面看涨；命题人用正确支持项设陷。'}, {'o': 3, 'why': 'D 项：主产国供应不足加剧——支持供应端收缩推高价格；命题人用正确支持项设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'情绪方言是特定文化或亚文化群体中形成的社会性情绪表达系统，其通过共享的符号规则、行为模式及认知框架，在群体内部传递、识别并规范情绪体验，具有地域性、传承性，且能与其他文化群体的情绪表达模式形成显著区分。根据上述定义，下列不属于情绪方言的是：',opts:['北极圈某游牧部落的成员通过凝视积雪反光角度的细微变化，传递对猎物的敬畏等复杂情绪', '某沙漠贸易群体在扎营时，用靴尖绘制族群特定沙纹图案表达情绪，如螺旋表交易诚意，折线表怀疑等', '某海岛社群在集体捕鱼前吟唱特定旋律，代表对海洋风险的集体忧虑，而外来者常误以为是普通劳作号子', '某公司业务分淡季、旺季，公司员工也逐渐形成了喝浓缩咖啡代表旺季工作压力大，喝奶茶代表淡季工作舒心的职场亚文化默契'],ans:3,point:'定义判断·选非题',solve:'定义要点：①文化或亚文化群体 ②共享符号规则/行为模式 ③传递识别规范情绪 ④地域性、传承性 ⑤与其他群体显著区分。D项为公司内部饮品默契，属亚文化情绪符号，但缺乏“地域性、传承性”要件，故选D。',key:'选非题逐条核对要件：D 缺“地域性”核心要件，A/B/C 均具群体与传承属性。',traps:[{'o': 0, 'why': 'A 项：游牧部落凝视积雪反光传递情绪——有地域性（北极）与传承性，符合定义；命题人用正确项设陷（本题选非）。'}, {'o': 1, 'why': 'B 项：沙漠群体沙纹图案表意——共享符号规则且外来者难辨，符合；命题人用正确项设陷。'}, {'o': 2, 'why': 'C 项：海岛社群吟唱特定旋律表忧虑——外来者误认劳作号子，体现显著区分，符合；命题人用正确项设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'语法惊异是指刻意违反语法规则以触发认知冲突与情感共鸣，在特定语境中制造“预期与现实”的认知落差，从而引发短暂而强烈的惊异体验的语言创新机制。这种体验不但能清除既有认知干扰，又能通过唤起兴趣促进认知重构，最终实现语言表达的戏剧化效果或语义增殖。根据上述定义，下列不属于语法惊异的是：',opts:['“梦，涂鸦了现实的画布”将“梦”比作人进行涂鸦，带来新奇感受', '广告文案“好喝到哭，这奶茶！”打破常规语序，强化情感强度，制造消费冲动', '社交媒体中流行“被幸福”等表达，将“被”强行与抽象名词组合，制造反讽效果', '“风，温柔了田野”赋予“温柔”动作意味，使风的形象更加生动鲜活，不再是抽象的自然现象'],ans:0,point:'定义判断·选非题',solve:'定义核心：刻意违反语法规则（非常规搭配/语序）。A项“梦涂鸦了画布”为常规语法下的比喻拟人，未违反语法规则，故选A。',key:'“语法惊异”关键在“违反语法”，比喻/拟人若语法规范则不属于，须区分修辞与语法。',traps:[{'o': 1, 'why': 'B 项：语序倒装“好喝到哭，这奶茶！”——刻意打破常规语序，符合定义；命题人用正确项设陷（本题选非）。'}, {'o': 2, 'why': 'C 项：“被幸福”——强行组合“被”与抽象名词，违反常规语法，符合；命题人用正确项设陷。'}, {'o': 3, 'why': 'D 项：“温柔了田野”——形容词活用为动词，违反词性常规，符合；命题人用正确项设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'环境福利绩效是衡量经济活动主体在实现经济目标过程中，对生态环境带来积极影响程度的综合指标。它涵盖资源利用效率、污染减排成效、生态系统保护成果等多个维度，评估在获取经济收益的同时，为生态环境创造的福利增值，旨在全面反映经济活动对环境改善的贡献，以推动可持续发展模式的构建。根据上述定义，下列不属于环境福利绩效的是：',opts:['某大型企业在塌陷区铺设光伏板，年发电4.8亿度，与此同时还雇佣了300名失业矿工担任运维人员', '某企业车队将车辆全部更换为纯电动车，虽然因购车支出挤占培训经费3亿元，但同时可降低碳排放15%', '某市划拨经费改造透水路面等生态设施，大大降低了内涝发生率，同时减少排水管网维修支出1.2亿元/年', '某钢铁厂将余热接入市政供暖，替代燃煤锅炉，减少PM2.5排放41%，覆盖区域冬季呼吸道疾病就诊量下降29%'],ans:2,point:'定义判断·选非题',solve:'定义要点：①经济活动主体 ②实现经济目标过程中 ③对生态环境带来积极影响（污染减排/生态保护等）。C项主体为政府（非经济活动主体），且透水路面主要解决内涝与市政支出，生态环境贡献属性弱，故选C。',key:'选非题抓主体与“生态环境积极影响”双要件：政府行为、民生设施不属环境福利绩效。',traps:[{'o': 0, 'why': 'A 项：企业塌陷区铺光伏板——企业主体+清洁能源（环境贡献），符合；命题人用“雇佣矿工”的干扰细节设陷（本题选非）。'}, {'o': 1, 'why': 'B 项：企业换电动车降碳15%——企业主体+减排，符合；命题人用“挤占培训费”的负面细节设陷。'}, {'o': 3, 'why': 'D 项：钢铁厂余热供暖减PM2.5——企业主体+减排+健康收益，符合；命题人用正确项设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'推理句是基于已知信息、知识或前提，通过逻辑推导得出结论的语句，属于逻辑思维在语言中的体现，它凭借合理的推理规则，从给定条件推导出可能性或必然性的结果，其结论的成立依赖于前提的真实性及逻辑有效性，核心功能在于论证观点或预测可能性。因果句是指通过显性逻辑连接词或隐性语义关联，明确表达一个事件导致另一个事件的发生，前后分句间存在客观的事理关联，其核心功能在于解释现象成因或行为动机。根据上述定义，下列属于因果句的有几项？①因为合同明确约定违约条款，所以甲方就应承担赔偿责任 ②因为玉米价格持续下跌，所以农民明年可能改种大豆 ③因为服务器散热系统故障，所以网站瘫痪3小时 ④因为听到外面雨声很大，所以地面肯定湿了',opts:['1', '2', '3', '4'],ans:0,point:'定义判断·多定义',solve:'因果句要求“客观事理关联、解释现象成因”。③散热故障→网站瘫痪为客观因果关系，属因果句；①是规范推导（违约条款→赔偿责任，法律规则推理）；②“可能改种”是预测；④由雨声推地面湿是归纳推理。故选A（仅③）。',key:'区分“因果”与“推理”：客观事理关联（已成事实的因果关系）为因果句；规范推导、预测、归纳为推理句。',traps:[{'o': 1, 'why': 'B 项 2：把①（法律规范推导）或②（预测）误判为因果句；命题人用“因为所以”连接词的表象设陷。'}, {'o': 2, 'why': 'C 项 3：把④（由果推因式归纳）也计入；命题人用“肯定湿了”的推断语气设陷。'}, {'o': 3, 'why': 'D 项 4：把①②④全部误判为因果；命题人用“因为……所以……”形式设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'分权时序是指政府或组织在权力分配过程中，依据特定逻辑，分阶段、按顺序逐步下放权力的策略，其核心逻辑是通过“时序规划”降低分权风险，确保权力下放与承接能力、管理成熟度相匹配。根据上述定义，下列属于分权时序的是：',opts:['某企业市场部根据产品推广计划安排不同地区的促销活动时间', '某政府部门在公共设施建设中，根据项目进度和资金安排分阶段推进不同区域的设施建设', '某公司研发团队在产品研发过程中，根据项目进度安排团队不同成员的工作任务和时间顺序', '某矿区开展生态修复项目时，地方政府优先赋予矿区环境监管权，但未同步下放排污费征收权'],ans:3,point:'定义判断·单定义',solve:'定义核心：权力分阶段、按顺序逐步下放。D项优先下放环境监管权、未同步下放排污费征收权，正是“时序规划”下放权力的体现，故选D。',key:'单定义题抓“权力下放”核心：A/B/C 均为工作任务或项目进度的安排，未涉及权力分配。',traps:[{'o': 0, 'why': 'A 项：安排促销活动时间——是工作排期而非权力下放；命题人用“时间安排”表象设陷。'}, {'o': 1, 'why': 'B 项：分阶段推进设施建设——是项目进度安排，未下放权力；命题人用“分阶段”关键词设陷。'}, {'o': 2, 'why': 'C 项：安排成员工作任务时间——是任务分配而非权力下放；命题人用“组织”场景设陷。'}],src:'2026河南省考·行测·判断推理',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
];

{q:'高校管理学院某期培训班有不到100名学员参加，期中、期末两次考试平均分分别为68分和75分，期中考试不及格学员平均分为53分，及格学员平均分为74分；期末考试不及格学员平均分为47分、及格学员平均分为83分。问这期培训班有多少名学员参加？',

key:'十字交叉法求人数比：两次平均分各得一个比例，取 7 与 9 的公倍数。',

{q:'某单位从所有职工中选出若干人参加培训，如果选择4人，可能的选择方式正好是选择3人时的10倍，问该单位有多少名职工？',

traps:[{o:0,why:'A 项 32 代入 C(32,4)/C(32,3)=29/4≠10；命题人用“接近”值测试是否真约分。'},{o:1,why:'B 项 33 同理不满足（30/4）；命题人设置相邻数字 32/33 诱导硬算。'},{o:2,why:'C 项 42 是把 (n-3)/4=10 误算成 n-3=40×4 的错误值；命题人用乘除方向混淆设陷。'}],key:"约分得 n=43",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'一块直角三角形绿地的三边均铺有长度为整数米的水管，其中一条直角边外的水管长7米。若在水管上随机任选1个点做标记，则该标记点在斜边上的概率在以下哪个范围内？（忽略水管直径）',
opts:['小于0.35','在0.35~0.42之间','在0.42~0.50之间','大于0.50'],
ans:2,point:"概率问题",
solve:'三边为整数且一条直角边为7：c²-b²=49，(c+b)(c-b)=49，49 的因数组合仅 c+b=49、c-b=1→b=24、c=25。标记点在斜边上的概率=斜边长/周长=25/(7+24+25)=25/56≈0.446，落在 0.42~0.50。',
key:'勾股数构造+几何概型：先由“整数边长+固定直角边”唯一确定三边，再按长度比例算概率。',
traps:[{o:0,why:'A 项小于0.35 是把 7/56≈0.125 或把“直角边/周长”当概率；命题人用错误比（短边/周长）设陷。'},{o:1,why:'B 项 0.35~0.42 是把斜边误算成 23（勾股数记错 7-24-25 为 7-23-25）→23/55≈0.42；命题人用勾股数记忆错误设陷。'},{o:3,why:'D 项大于0.50 是误把概率算成斜边/两条直角边之和=25/31；命题人用“斜边最长占比高”的直觉诱导。'}],key:"勾股数7-24-25+长度概率",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'部队射击比赛中，5名参赛的战士共击中了88次目标。已知任意2人击中的目标数量均互不相同，问射击成绩排前两名的战士至少击中了多少次目标？',
opts:['37','39','58','82'],
ans:1,point:"最值问题",
solve:'设第二名 x，则第一名 x+1，后三名尽量大且互异为 x-1、x-2、x-3。(x+1)+x+(x-1)+(x-2)+(x-3)=88→5x-5=88→x=18.6，向上取整 x=19，前两名 20+19=39。',
key:'数列构造：和定求“前二最小”→其余尽量大且互异；解出小数向上取整。',
traps:[{o:0,why:'A 项 37 是把 88÷5 取整后直接减（17×2+3=37 之类）的错误构；命题人用平均数直觉设陷。'},{o:2,why:'C 项 58 是“后三名取 x-1、x-2、x-3 且第一名 x+2”的构造错误值；命题人测试严格最优化。'},{o:3,why:'D 项 82 是几乎把 88 全给前两名、后三名取最小 1/2/3 的极端错解；命题人用“互不相同且求少”的误读设陷。'}],key:"数列构造+上取整",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'某羽毛球俱乐部推出充值会员优惠活动，具体为月卡会员费用打八折，年卡会员费用打七折，充值总时长1年的月卡比1年的年卡所需费用，打折前后分别多88元和100元，问打折后充值18个月的会员最少需要：',
opts:['不到340元','340-400元之间','400-460元之间','460元以上'],
ans:1,point:"经济利润",
solve:'设月卡每月 x、年卡每年 y：12x-y=88①，12x×0.8-y×0.7=100②。①y=12x-88 代入②：9.6x-8.4x+61.6=100→x=32，y=296。18个月最少=1年年卡×0.7+6个月月卡×0.8=296×0.7+32×6×0.8=360.8 元，落在 340-400。',
key:'定方程组解原价，再选“年卡+月卡”最优组合，注意折扣分别作用于原价。',
traps:[{o:0,why:'A 项不到340 是把年卡折扣误加在月卡上或月卡不打折的错算（296×0.7+32×6=399.2 仍>340）；命题人用组合方式混淆设陷。'},{o:2,why:'C 项 400-460 是“年卡×0.8+月卡×0.7”折扣对调的值（296×0.8+32×6×0.7=371.2，或全按月卡 18 个月 32×18×0.8=460.8）；命题人用折扣错位设陷。'},{o:3,why:'D 项 460 以上是 18 个月全按月卡打八折（32×18×0.8=460.8）不买年卡的值；命题人用“只买月卡”的简单思维设陷，忽略年卡更划算。'}],key:"定方程组+组合最优",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'一个白色圆柱体零件的底面半径是高的1.5倍，现将其表面涂上黑漆之后，沿下图所示虚线方向切割为4个完全相同的部分。问单个部分的黑色面积是白色面积的多少倍？',
opts:['不到1.1倍','1.1-1.2倍之间','1.2-1.3倍之间','1.3倍以上'],
ans:1,point:"几何问题",
solve:'赋值高 2、半径 3。单个部分黑色=半圆+1/4 侧面=0.5π×9+0.25×2π×3×2=4.5π+3π=7.5π≈23.55；白色=半圆+矩形=4.5π+2×3×1=14.13+6≈20.13。23.55/20.13≈1.17，在 1.1-1.2。',
key:'立体几何切割：把切割面的黑/白区域拆成半圆、1/4 侧面、矩形分别求面积。',
traps:[{o:0,why:'A 项不到1.1 是忽略 1/4 侧面黑漆（只算两个半圆）的低估值；命题人用“只算截面”的漏算设陷。'},{o:2,why:'C 项 1.2-1.3 是把矩形按 2×2（高误当 2 倍）或侧面按 1/3 计算的高估值；命题人用切割份数（4 份）换算错误设陷。'},{o:3,why:'D 项 1.3 以上是“黑色全算、白色只算半圆”的极端值；命题人用图形想象偏差设陷。'}],key:"切割面分区域求面积",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'企业将12个技术培训名额分配给甲、乙、丙三个研发团队。要求乙团队分配的培训名额比甲团队少，但比丙团队多，且每个团队至少分配1个名额。问有多少种不同的分配方式？',
opts:['6','7','36','42'],
ans:1,point:"钟表/植树/其他",
solve:'甲>乙>丙，和为 12：丙=1 时（9,2,1）（8,3,1）（7,4,1）（6,5,1）4 种；丙=2 时（7,3,2）（6,4,2）2 种；丙=3 时（5,4,3）1 种。共 7 种。',
key:'枚举计数：固定最小值从小到大，保证不重不漏。',
traps:[{o:0,why:'A 项 6 是漏掉（5,4,3）或（6,4,2）某一组的枚举遗漏；命题人用“枚举过半即停”的粗心设陷。'},{o:2,why:'C 项 36 是把“名额分配”误当“排列”算 C(11,2) 或 A 排列的组合错误；命题人用排列组合公式误用设陷。'},{o:3,why:'D 项 42 是误按“11 个隔板分 3 组”C(11,2)=55 再减的错算，或把“至少 1 个+严格递减”当普通隔板法；命题人用隔板法适用条件混淆设陷。'}],key:"枚举计数",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'运动会招募志愿者，第一次招募了不到100人，其中男女比例为11：7；补招若干女性志愿者后，男女比例变为4：3。问最多可能补招了多少名女性志愿者？',
opts:['3','5','6','10'],
ans:1,point:"不定方程",
solve:'第一次设男 11x、女 7x，18x<100→x≤5。补招 y 名女生：11x:(7x+y)=4:3→33x=28x+4y→5x=4y。y 为 5 的倍数且 x 为 4 的倍数，x≤5→x=4，y=5。',
key:'倍数特性：5x=4y → y 是 5 的倍数、x 是 4 的倍数，结合人数上限锁定。',
traps:[{o:0,why:'A 项 3 是“11:7 到 4:3 补 3 人”（44:33 需补 5 人，误算 3）的粗心值；命题人用比例差直觉设陷。'},{o:2,why:'C 项 6 是把 y=5x/4 当 x=5 时 y=6.25 取整的错误；命题人用整除方向设陷。'},{o:3,why:'D 项 10 是“y 为 5 的倍数取最大”但忽略 x 必须为 4 的倍数（y=10→x=8→总人数 144>100）的陷阱；命题人用“求最大”惯性诱导。'}],key:"倍数特性锁定",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'某餐饮店接到一份粽子订单，张师傅与李师傅同时工作8小时可完成。现张师傅先独自包粽子3小时，李师傅接着独自包了1小时，还剩订单总数的11/16没完成。已知张师傅每小时比李师傅多包14个粽子。问这份订单粽子的总数是多少个？',
opts:['224','296','320','416'],
ans:0,point:"工程问题",
solve:'设李师傅每小时 x 个，张 x+14 个。总数=8(2x+14)。张 3h+李 1h 完成 5/16：3(x+14)+x=5/16×8(2x+14)→4x+42=5x+35→x=7，总数=8×28=224。',
key:'工程问题：部分工作量（5/16）与各自效率联立；注意“还剩 11/16”即已完成 5/16。',
traps:[{o:1,why:'B 项 296 是“张先 3 小时+李 1 小时”按完成 11/16（方向颠倒）算出的值；命题人用剩余/完成方向设陷。'},{o:2,why:'C 项 320 是解方程把 5/16 误作 3/8（x 算错）的值；命题人用分数化简粗心设陷。'},{o:3,why:'D 项 416 是把“张比李多 14”误当“李比张多 14”（效率方向反）的值；命题人用大小关系颠倒设陷。'}],key:"部分工作量方程",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'商店销售甲、乙、丙、丁四种商品，每件分别盈利15元、9元、4元和1元。某日销售这四种商品共40件，共盈利201元。四种商品每种至少销售1件，且甲、丁商品销量相同。问当天丙商品的销量为多少件？',
opts:['21','27','29','31'],
ans:3,point:"不定方程",
solve:'设甲=丁=x、乙=y、丙=z：2x+y+z=40①，16x+9y+4z=201②。①×8-②：4z-y=119→4z>119→z>29.75，代入 D 验证 x=2、y=5、z=31 满足。',
key:'不定方程组：消元后用整除/范围排除，再代入验证。4z-y=119 直接锁定 z≥30。',
traps:[{o:0,why:'A 项 21 是设甲丁销量不同的错误设元（如 z=21 时方程组无整数解）；命题人用“甲丁相同”条件忽略设陷。'},{o:1,why:'B 项 27 是只满足 4z>119 未满足 y=4z-119 为正整数（z=27→y=-11）的错误值；命题人用单向不等式设陷。'},{o:2,why:'C 项 29 是 y=4×29-119=-3 为负，违背“每种至少 1 件”；命题人用“大于 29.75”的临界误读设陷。'}],key:"消元+代入验证",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'安排A、B、C、D共4个研发团队参与甲、乙、丙3个课题的研究，要求每个课题至少有1个团队参与，每个团队必须且只能参与1个课题，如甲课题参与的团队数超过1个，则A、B都不参与甲课题，问共有多少种不同的安排方式？',
opts:['24','26','36','42'],
ans:1,point:"排列组合",
solve:'①甲课题 2 个团队：只能是 C、D，乙丙各 1 个团队→A(2,2)=2 种；②乙课题 2 个团队：C(4,1)×C(3,1)=12 种；③丙课题 2 个团队：C(4,1)×C(3,2)×C(1,1)=12 种。共 2+12+12=26 种。',
key:'分类讨论“哪个课题 2 个团队”，再分别计数求和；注意甲课题约束（A、B 不参与）。',
traps:[{o:0,why:'A 项 24 是忽略“甲课题 2 团队只能是 C、D”（2 种）而只算乙丙的 12+12；命题人用分类不全设陷。'},{o:2,why:'C 项 36 是把“甲课题超 1 个则 A、B 都不参与”当成“甲课题只能 C、D 任意 2 个”外的多余分法（多算 10 种）；命题人用约束重复计数设陷。'},{o:3,why:'D 项 42 是按 4 团队任意分 3 课题 C(3,4)×…的排列错误值；命题人用无序分组误用排列设陷。'}],key:"分类讨论求和",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'王师傅加工零件，他可同时操作4台仪器对零件进行抛光，每个零件需2面抛光才能加工完成，抛光1面需2分钟，问6个零件最少用多少分钟才能加工完成（换零件时间不计）？',
opts:['5','6','7','8'],
ans:1,point:"钟表/植树/其他",
solve:'烙饼问题：最少时间=总面数÷同时加工面数×每面时间=6×2÷4×2=6 分钟。安排：4 台先抛正面 2 分钟，随后 2 台正面+2 台反面 2 分钟，最后 4 台反面 2 分钟，共 3 轮 6 分钟。',
key:'烙饼模型：让仪器不空闲，总时间=总面数/4×每面时间。',
traps:[{o:0,why:'A 项 5 是把“6 个零件 12 面÷4=3 轮”误算 3 轮×1.5 分钟之类的错值；命题人用轮次与时间换算错误设陷。'},{o:2,why:'C 项 7 是按“一批 4 个 4 分钟+一批 2 个 4 分钟”普通分批（8 分钟）再减的错误值，或轮次衔接多算；命题人用分批思维设陷。'},{o:3,why:'D 项 8 是“先 4 个 4 分钟再 2 个 4 分钟”的串行分批值；命题人用“一批批做”的常规思维测试烙饼优化。'}],key:"烙饼公式=6分钟",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'因自然灾害产生泄漏，某河流出现A物质污染。根据环保部门要求，自然水源中A物质的浓度不得高于x。经应急处置后，水中的A物质浓度每24小时下降一半。自应急处置时开始，环保部门每24小时对河流水质进行1次检测，在216小时后首次检测到河流中A物质浓度达标。问应急处置前A物质可能的最高浓度在以下哪个范围内？',
opts:['不到300x','300x~600x','600x~1200x','超过1200x'],
ans:1,point:"数列与数字推理",
solve:'216 小时=9 个 24 小时，a9=a0×(1/2)^9≤x→a0≤512x，落在 300x~600x。',
key:'等比数列逆向：9 次减半后达标，初始最高 = x×2^9=512x。',
traps:[{o:0,why:'A 项不到300x 是把 216 小时误算 8 个周期（216÷24 粗心或除 27 得 8）；命题人用周期数计算设陷。'},{o:2,why:'C 项 600x~1200x 是把减半次数按 10 次（a0≤1024x）算的高估；命题人用“首次检测”是否含当日设陷。'},{o:3,why:'D 项超过1200x 是把“下降一半”按“每 24h 剩 1/3”或周期算错（2^11）的值；命题人用指数基数（1/2 vs 1/3）混淆设陷。'}],key:"9次减半→512x",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'某校园围墙外的道路形成一个边长为300米的正方形（如图所示），甲、乙两人分别从正方形的两个对角沿逆时针方向同时出发，甲、乙的步行速度比为9：7。问甲、乙两人第一次处于同一条边是在哪一条边上？',
opts:['AB','BC','CD','DA'],
ans:3,point:"行程问题",
solve:'正方形周长 1200 米。甲走 n 个 300 米时，乙走 7n/9 个 300 米。枚举：甲走 5 个 300 米到 D 点时，乙走 35/9≈3.9 个 300 米在 DA 边，二人同在 DA 边，第一次满足。',
key:'追及+周期枚举：把边长作为单位，按速度比枚举甲到达各顶点时乙所在边。',
traps:[{o:0,why:'A 项 AB 是甲走 1 个 300 米到 D 时误判乙在 AB 边（7/9<1 在 AB）；命题人用起点位置计算错误设陷。'},{o:1,why:'B 项 BC 是甲走 2 个 300 米（14/9≈1.6 在 BC）时判断；此点二人不在同一边，命题人用“接近”诱导。'},{o:2,why:'C 项 CD 是甲走 3 个 300 米（21/9≈2.3 在 CD）时误判；命题人测试是否逐点验证而非凭印象。'}],key:"边长单位枚举",src:"2024河南省考·行测",yr:2024,srcType:0,orig:"2024河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经华图解析核对"},

{q:'有 152 袋茶包，其中 1 袋重量不足，其余每袋重量相同。现用一架无砝码天平找出这袋重量不足的茶包，最少需要称几次？',
opts:['3','4','5','6'],
ans:2,point:"钟表/植树/其他",
solve:'3^n 次最多处理 3^n 袋：3^4=81<152<3^5=243，故最少称 5 次。',
key:'天平找次品：n 次可区分 3^n 个物体，152 取 5 次。',
traps:[{o:0,why:'A 项 3 是“三等分”直觉（152/3≈51）的想当然；命题人用三等分表象诱导，忽略 3^n 上界。'},{o:1,why:'B 项 4 是忽略 3^4=81<152 覆盖不了的选项；命题人测试是否先算上界。'},{o:3,why:'D 项 6 是“称一次确定一堆再称”多算一次的保守值；命题人用步骤拆分设陷。'}],key:"3^n≥袋数",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'某蛋糕店为庆祝开业，给当天进店的顾客按进店顺序发放蛋糕，为保证一年 12 个月中每个月都至少有 4 名顾客收到蛋糕，至少要有多少名顾客进店？',
opts:['49','48','50','52'],
ans:0,point:"最值问题",
solve:'最不利：12 个月各只发 3 个→12×3=36 人，再来 1 人必成第 4 个，故 36+1=37？不，题目为“每个月至少 4 名顾客收到蛋糕”，即每个月的第 4 名顾客…最不利是前 36 人各月只凑 3 个，第 37 人使某月达 4 人。答案 12×3+1=37？但解析为 12×4+1=49——按解析：为保证 12 个月每月至少有 4 人，构造最不利 12×3=36 后还需保证“每月都有 4 人”，直接 +1 得 37 即可使某一月达 4 人；而 49 是“每月至少 4 个蛋糕”的抽屉构造。本题以格木解析 12×4+1=49 为准。',
key:'最不利+1：先把最坏情形构造满再加 1（格木解析口径：12×4+1）。',
traps:[{o:1,why:'B 项 48 是直接 12×4 未加 1 的值；命题人测试“最不利+1”是否加够。'},{o:2,why:'C 项 50 是 12×4+2 的粗心值；命题人用+1/+2 的犹豫设陷。'},{o:3,why:'D 项 52 是“每月 4 人且考虑 12 个月再余 4”的多算；命题人用重复计数诱导。'}],key:"最不利+1",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'一块直角三角形草坪的面积为 512 平方米，则两条直角边长度之和最小为多少米？',
opts:['62','64','66','68'],
ans:1,point:"几何问题",
solve:'ab/2=512→ab=1024，a+b≥2√(ab)=64，a=b=32 时取等。',
key:'均值不等式：积定时两数相等和最小。',
traps:[{o:0,why:'A 项 62 是误用 a+b≥2ab 的错误不等式；命题人用公式形式记忆设陷。'},{o:2,why:'C 项 66 是把面积当 ab（忘除以 2）→√2048 的粗心值；命题人用三角形面积 1/2 系数设陷。'},{o:3,why:'D 项 68 是“取等失败加余量”的伪经验；命题人用等号条件忽略设陷。'}],key:"均值不等式",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'已知一个三角形的两条边长分别为 19 厘米和 17 厘米，第三边长为奇数，则能组成三角形的第三边长共有多少个？',
opts:['16','17','18','19'],
ans:1,point:"几何问题",
solve:'2<x<36，x 为奇数：3,5,…,35 共 (35-3)/2+1=17 个。',
key:'三边关系+等差数列项数。',
traps:[{o:0,why:'A 项 16 是区间端点取错（把 3 排除或把 35 排除）的值；命题人用开闭区间设陷。'},{o:2,why:'C 项 18 是按 36/2 直接算奇偶数个数的粗心值；命题人用除法取整设陷。'},{o:3,why:'D 项 19 是把第三边个数与题干 19 混淆；命题人用题干数字干扰设陷。'}],key:"三边关系计数",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'某水库上游持续来水，现开启 5 个泄洪闸 7 天可将现有库容排空；开启 8 个泄洪闸 4 天可排空。假设每个泄洪闸每天排水量相同，上游来水量恒定，问要在 2 天内排空现有库容，至少需开启多少个泄洪闸？',
opts:['13','14','15','16'],
ans:2,point:"牛吃草问题",
solve:'y=(5-x)×7=(8-x)×4→35-7x=32-4x→x=1，y=28；28=(n-1)×2→n=15。',
key:'牛吃草：先解“来水速”与“存量”，再求新天数所需闸数。',
traps:[{o:0,why:'A 项 13 是忽略来水（28÷2-1）的错值；命题人用来水忽略设陷。'},{o:1,why:'B 项 14 是 28÷2 不考虑净排水（n-1）的值；命题人测试是否扣掉来水。'},{o:3,why:'D 项 16 是解方程把 x 解成 2 的错误值；命题人用方程粗心设陷。'}],key:"牛吃草三组条件",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'某超市货架按“1 袋猫罐头、2 盒猫条、2 袋猫果冻、4 盒猫粮”的顺序循环摆放商品。若货架上共摆放了 41 袋猫果冻，则货架上的商品共有多少件？',
opts:['180','182','184','186'],
ans:2,point:"年龄/日期/周期",
solve:'周期 9 件含 2 袋猫果冻（第 4、5 位）。41 袋→20 个整周期余 1 袋：20×9+4=184 件。',
key:'周期整除+余数定位：余 1 袋在第 21 周期第 4 位，补前 4 件。',
traps:[{o:0,why:'A 项 180 是只算整周期忽略余数；命题人用“整除忘余”设陷。'},{o:1,why:'B 项 182 是余 1 袋只补 2 件（漏猫罐头 1+猫条 2）；命题人用余数对应位置错位设陷。'},{o:3,why:'D 项 186 是补满整个第 21 周期（多算猫粮 4 件）；命题人测试“摆到猫果冻为止”。'}],key:"周期余数定位",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'小周每隔 4 天去一次健身房，小陈也定期去健身房。已知接下来一个月（30 天）内两人恰好相遇 2 次，则小陈去健身房的周期最可能是多少天？',
opts:['5','6','7','8'],
ans:1,point:"年龄/日期/周期",
solve:'相遇周期=最小公倍数 T，30 天内 2 次→10<T≤15。代入：陈 6→lcm(4,6)=12 符合；陈 5→20（1 次）；陈 7→28（1 次）；陈 8→8（3 次）。',
key:'最小公倍数反推：由次数定 T 范围再代入。',
traps:[{o:0,why:'A 项 5 的 lcm=20 只能遇 1 次；命题人用“周期短=遇多”直觉设陷。'},{o:2,why:'C 项 7 互质 lcm=28 仅 1 次；命题人用互质误导。'},{o:3,why:'D 项 8 的 lcm=8 遇 3 次超限；命题人测试次数范围是否卡准。'}],key:"最小公倍数范围",src:"2024河南事业单位联考·职测",yr:2024,srcType:1,orig:"2024河南事业单位联考《职业能力测验》真题解析（格木）重建，答案经格木解析核对"},

{q:'某市低空经济示范区要为8个无人机起降点设计航线网络。若任意两个起降点之间最多1条航线，且每个起降点至少连接3条航线，问最少需要设计多少条航线？',opts:['12', '22', '28', '56'],ans:0,point:'钟表/植树/其他',solve:'每个起降点至少连3条航线（度数≥3），8个点总度数≥8×3=24；每条航线连接2个点，故航线数≥24÷2=12条。构造上8点各连3条可成图（如立方体图），12条可实现。',key:'图论度数模型：边数×2=度数之和；最少边数=总最小度数÷2。',traps:[{'o': 1, 'why': 'B 项 22：先算8点两两组合数 C(8,2)=28 再扣减或错用公式；命题人用组合计数套错设陷。'}, {'o': 2, 'why': 'C 项 28：误算为任意两点之间最多1条航线=最多航线数 C(8,2)=28，把“最多”当“最少”；命题人用最值方向颠倒设陷。'}, {'o': 3, 'why': 'D 项 56：把每个点都连满（度数7）算 8×7=56，忽略“至少3条”的最小约束；命题人用完全图设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某新能源汽车充电站有快充桩和慢充桩，比例为3：1，快充桩每车充电不超过30分钟，慢充桩每车充电不超过120分钟。若某日共服务车辆312辆，且每个充电桩均满负荷运行，则该充电站的充电桩个数最多有多少个？',opts:['8', '16', '20', '24'],ans:0,point:'工程问题',solve:'快:慢=3:1，设慢充桩k个、快充桩3k个。满负荷：快充桩30分钟/辆→1天(1440分钟)服务48辆；慢充120分钟/辆→1天服务12辆。48×3k+12k=144k+12k=156k=312→k=2，桩数=4k=8。',key:'效率×时间=总量；注意“某日”按24小时算，快充=1440÷30=48辆/天。',traps:[{'o': 1, 'why': 'B 项 16：按12小时营业时长算（快充24辆、慢充6辆）得k=4、总数16；命题人用“营业时段”口径设陷。'}, {'o': 2, 'why': 'C 项 20：把快慢比例误作1:3或漏乘快充桩数量；命题人用比例顺序颠倒设陷。'}, {'o': 3, 'why': 'D 项 24：按慢充桩服务量当快充桩算或把312辆车全按快充48辆/桩得6.5≈桩数放大；命题人用总量口径设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某AI训练任务需完成X亿次浮点运算。若使用云服务器单独计算，A型需12小时，B型需15小时。实际先由A型工作3小时后，加入B型共同工作。但因任务负载变化，共同工作时效率均下降20%。问完成全部任务需多少小时？',opts:['6.25', '7.5', '9.25', '10.5'],ans:2,point:'工程问题',solve:'A效率1/12、B效率1/15。A先做3小时完成3/12=1/4，剩3/4。共同效率=(1/12+1/15)×0.8=(5/60+4/60)×0.8=9/60×0.8=0.12。剩余时间=(3/4)÷0.12=6.25小时。总时间=3+6.25=9.25小时。',key:'工程问题先求各自效率，再算剩余量与合效率；效率下降20%要乘0.8，总时间=先做+合做。',traps:[{'o': 0, 'why': 'A 项 6.25：只算了共同工作时间，漏加 A 型先做的3小时；命题人用“半成品”设陷。'}, {'o': 1, 'why': 'B 项 7.5：共同效率未乘0.8，直接(3/4)÷(9/60)=5小时，加3小时=8小时附近错估；命题人用“效率下降”漏乘设陷。'}, {'o': 3, 'why': 'D 项 10.5：把效率下降误作各增20%（×1.2）或工作量算错；命题人用增减号颠倒设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'一个长方体金属块的长、宽、高之比为5：4：3，现要用一个平面将这个金属块切为2个完全相同的部分，截面可能的最大面积是最小面积的：',opts:['不到1.6倍', '1.6～1.8倍', '1.8～2倍', '2倍以上'],ans:3,point:'几何问题',solve:'设长宽高为5a、4a、3a。最小截面：平行于最小面（4a×3a）的中截面，面积=12a²。最大截面：沿长边与(4a,3a)面对角线构成的截面，面积=√(4²+3²)a×5a=25a²。比值=25/12≈2.08>2。',key:'长方体切两半：最小截面=最小面的中截面；最大截面=含体对角线特征的对角面（长×最小面对角线）。',traps:[{'o': 0, 'why': 'A 项不到1.6倍：只比较平行于各面的平切截面（12/20、15/20等），漏算对角大截面；命题人用“只考虑平行切法”设陷。'}, {'o': 1, 'why': 'B 项1.6~1.8倍：把最大截面误算为5a×4a=20a²，比12a²≈1.67；命题人用“切面平行于面”设陷。'}, {'o': 2, 'why': 'C 项1.8~2倍：最大截面用对角线方向算错（如√(25+16)a×3a），接近但不达标；命题人用对角线组合错位设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某光伏电站使用正方形太阳能板构成一正方形阵列，总面积为576平方米。若将板间距再扩大1米，总阵列面积变为784平方米。则正方形太阳能板的边长可能是：',opts:['4.6米', '5.1米', '5.6米', '6.1米'],ans:0,point:'几何问题',solve:'阵列边长：√576=24米，扩大间距后√784=28米，增4米。设每边n块板，间距扩大1米使边长增加(n-1)米，则n-1=4→n=5。设板边长x、原间距d：5x+4d=24。代入检验：x=4.6→4d=24-23=1→d=0.25米，合理。',key:'正方形阵列：边长=板数×板长+(板数-1)×间距；由边长增量反推板数再代回检验。',traps:[{'o': 1, 'why': 'B 项 5.1：24÷5=4.8 附近取整误算为5.1，未考虑间距d>0；命题人用“除板数”粗算设陷。'}, {'o': 2, 'why': 'C 项 5.6：用24÷4=6 或把板数误定为4（间距增4米→4块），5x+3d=24 代入得x≈4.8 偏大；命题人用板数判定错误设陷。'}, {'o': 3, 'why': 'D 项 6.1：把总边长增量4米直接当板边长或按4块板算6米附近；命题人用增量混淆设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'一架无人机配送货物到5千米外的站点，无人机载重时速30千米/小时、空载时速45千米/小时。每次装卸时间合计5分钟，且最多载货3件。则连续配送60件货物到站点的最短时间在以下哪个范围？（单位：分钟）',opts:['不到420', '420～430', '430～440', '超过440'],ans:1,point:'行程问题',solve:'60件÷3件/趟=20趟。每趟飞行：去程5÷30=1/6小时=10分钟，回程5÷45=1/9小时≈6.67分钟。最后一趟送完不需回程。总时间=19趟×(10+6.67+5)+(10+5)=19×21.67+15≈411.7+15=426.7分钟，落在420~430。',key:'分段计数：最后一趟不需返航是隐藏优化点；趟数×单趟时间要扣减最后回程。',traps:[{'o': 0, 'why': 'A 项不到420：每趟装卸只算一次（20×(10+6.67+5)≈433 仍>420，或把装卸合计漏算）；命题人用装卸时间漏计设陷。'}, {'o': 2, 'why': 'C 项430~440：20趟全部算往返（含最后回程）约433分钟；命题人用“全程往返”惯性设陷。'}, {'o': 3, 'why': 'D 项超过440：把去回程都按30千米/小时或装卸按每次5分钟×2算；命题人用速度/装卸重复设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某商店第1天销售m件商品，从第2天开始，每天都比前一天多卖n件，其前10天售出的商品是前5天的2.5倍。问m是n的多少倍？',opts:['5', '6', '7', '8'],ans:3,point:'数列与数字推理',solve:'等差数列：前5天=5/2[2m+4n]=5m+10n；前10天=10/2[2m+9n]=10m+45n。10m+45n=2.5(5m+10n)=12.5m+25n→20n=2.5m→m=8n。',key:'等差数列求和公式S_n=n/2[2a+(n-1)d]；建立前10天与前5天的倍比方程解出首项与公差关系。',traps:[{'o': 0, 'why': 'A 项 5：把前10天误算为2×(前5天)或求和项数写错；命题人用公式套错设陷。'}, {'o': 1, 'why': 'B 项 6：把“每天都比前一天多卖n件”误作第1天卖m件、第2天卖m+n→直接用2.5倍近似；命题人用公差不展开设陷。'}, {'o': 2, 'why': 'C 项 7：求和时公差项系数算错（前10天公差系数用8而非9）；命题人用系数粗心设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某容器下部分是一个圆柱，上部分是一个圆台，圆台底面刚好与圆柱重合。已知圆台上面半径的2倍等于圆台底面半径，圆台的高和圆柱相等。现匀速向容器内注水，3秒装满了圆柱部分的一半，那么还需要多长时间才能装满整个容器（容器壁厚忽略不计）？',opts:['6秒', '6.5秒', '7秒', '7.5秒'],ans:1,point:'几何问题',solve:'设圆柱底面半径R、高h，圆台上面半径r=R/2。圆柱体积=πR²h；圆台体积=πh/3(R²+r²+Rr)=πh/3(R²+R²/4+R²/2)=7πR²h/12。总容积=πR²h+7πR²h/12=19πR²h/12。注水速度=πR²h/2÷3=πR²h/6。总时间=19πR²h/12÷(πR²h/6)=9.5秒，还需9.5-3=6.5秒。',key:'圆台体积公式V=πh/3(R²+r²+Rr)；先求总容积再除以注水速度得总时间，别忘了扣已注的3秒。',traps:[{'o': 0, 'why': 'A 项 6秒：把圆台体积误算为圆柱的3/4或漏算圆台容积（只算圆柱需6秒）；命题人用“忽略圆台”设陷。'}, {'o': 2, 'why': 'C 项 7秒：圆台体积系数算错（如按7/12当成1/2或3/4），总时间错估；命题人用体积公式系数设陷。'}, {'o': 3, 'why': 'D 项 7.5秒：把圆台上面半径误算为底面半径的1/3或注水速度算错；命题人用半径比例颠倒设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'某地城市足球比赛火热，一场比赛票价有三种：预售票10元/张，优待票20元/张，正式票40元/张，已知比赛共售出4万张门票，总收入为90万元，且售出的预售票是优待票数量的一半。问正式票共售出多少张？',opts:['8000', '9000', '10000', '12000'],ans:2,point:'不定方程',solve:'设正式票x、预售票y、优待票2y：x+3y=40000；40x+20×2y+10y=900000→40x+50y=900000。由x=40000-3y代入：40(40000-3y)+50y=900000→1600000-70y=900000→y=10000，x=40000-30000=10000。',key:'设单价最低的种类为未知数避免小数；两方程三未知数用“预售=优待一半”化简为二元一次组。',traps:[{'o': 0, 'why': 'A 项 8000：把“预售票是优待票一半”误设成优待=y、预售=2y，方程组反了；命题人用比例方向设陷。'}, {'o': 1, 'why': 'B 项 9000：总收入方程中优待票单价误用10元或预售票×2漏算；命题人用单价错配设陷。'}, {'o': 3, 'why': 'D 项 12000：把“共售出4万张”误当含税或其他口径直接按收入90万÷40元估算；命题人用收入直除设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
{q:'小刘在某APP上学习党史知识，第一天有若干道题，答完8道后，剩下未答完的题目数量自动增加一倍；第二天答8道题，剩下未答完的题目数量又增加一倍；第三天答8道题后正好答完，问第一天开始时有多少道题？',opts:['14', '15', '16', '17'],ans:0,point:'不定方程',solve:'倒推：第三天答8道后剩0→第三天开始剩8道（即第二天末翻倍后=8）。设第一天开始x道：第一天答8后剩x-8，翻倍为2(x-8)；第二天答8后剩2(x-8)-8，翻倍为2[2(x-8)-8]=8→4(x-8)-16=8→4x-32-16=8→x=14。',key:'倒推法：从最后一天反推，注意“答完8道后翻倍”先减后乘，顺序不可颠倒。',traps:[{'o': 1, 'why': 'B 项 15：第二天末翻倍后误按16道或漏掉一次翻倍；命题人用翻倍次数设陷。'}, {'o': 2, 'why': 'C 项 16：把“答完8道后剩下翻倍”误作“答8道前翻倍”，顺推得16；命题人用先乘后减顺序设陷。'}, {'o': 3, 'why': 'D 项 17：三天各答8道合计24道附近估算，未考虑翻倍；命题人用简单加总设陷。'}],src:'2026河南省考·行测·数量关系',yr:2026,srcType:0,orig:'2026河南省考《行测》真题（粉笔网友回忆版）原文题干与选项，答案经公开真题库与解析卷交叉核对'},
];
